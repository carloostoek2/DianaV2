[project]
name = "diana"
version = "0.1.0"
description = "DianaV2 Fase 1 foundation — supervised VIP chat automation"
requires-python = ">=3.12"
dependencies = [
  "aiogram>=3.0,<4",
  "sqlalchemy[asyncio]>=2.0,<3",
  "asyncpg>=0.29",
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
  "alembic>=1.13",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/diana"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
