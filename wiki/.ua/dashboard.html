-FEEDBACK.md` v1.0). Esta página no copia el spec: apunta al archivo y registra qué quedó vivo en código.", "tags": "[spec, aprendizaje, entities — specs, entities/specs, operacion]", "content": "<p>---</p>\n<p>title: SPEC-FEEDBACK.md</p>\n<p>created: 2026-08-16</p>\n<p>updated: 2026-08-21</p>\n<p>type: entity</p>\n<p>tags: [spec, aprendizaje, operacion]</p>\n<p>sources: [../../docs/SPEC-FEEDBACK.md]</p>\n<p>confidence: high</p>\n<p>---</p>\n\n<h2>SPEC-FEEDBACK.md</h2>\n\n<p>Síntesis del spec de implementación <b>Feedback de calidad + fix zona gris</b> (<code>docs/SPEC-FEEDBACK.md</code> v1.0). Esta página no copia el spec: apunta al archivo y registra qué quedó vivo en código.</p>\n\n<p><b>Estado (2026-08-21, <code>main</code> <code>b592192</code>):</b> Fase 0 y Fases 1–3 implementadas, pool <code>feedback-calidad</code> cerrado (4 ítems). El flag <code>FEATURE_QUALITY_FEEDBACK_ENABLED</code> está <b>ACTIVO</b> (<code>true</code> en <code>.env</code>; default <code>false</code> en código, overridable por env) — Destacar/Reprender operativos en borradores VIP y paracaídas de zona gris aplicado (ver [[estado-del-proyecto]]).</p>\n\n<h3>Qué cubre el spec</h3>\n\n<li>**Fase 0 (crítica, aislada)** — si falla el DM de `consult_doctrine` en el path **VIP**, no dejar al VIP congelado 24 h. Mismo patrón F6 que atención: `discard_and_close` + demote a `approve` con `reason=vip_doctrine_notify_failed`. Hoy está en `turn_orchestrator.py` (rama `else` de consult_doctrine). Ver [[zona-gris-y-politicas]].</li>\n<li>**Feedback de calidad (FB-01..FB-06)** — Destacar / Reprender, gold-first, contraejemplo determinista, `vip_id` nuevo (no reutilizar `policies.scope`), promoción inmediata sin cola de revisión de Corregir, todo detrás del flag. Producto: [[calidad-feedback]].</li>\n\n<h3>Desvíos respecto al texto del spec</h3>\n\n<p>El spec se escribió <b>antes</b> de implementar. Lo que el código hace hoy:</p>\n\n<div class='tbl'>| Spec | Código |</div>\n<div class='tbl'>|---|---|</div>\n<div class='tbl'>| Migración Alembic **027** | **029_feedback_quality** (027 = eventos temporales, 028 = link) |</div>\n<div class='tbl'>| Botones `⭐ Destacar` / `🚫 Reprender` | Labels `Destacar` / `Reprender` (sin emoji) |</div>\n<div class='tbl'>| Reprender: capturar texto → combo → entonces resolver/entregar | El texto se **entrega al instante**; el combo `rpc:` es promote-only |</div>\n<div class='tbl'>| Destacar/Reprender en el teclado genérico de drafts | Solo si hay `vip_id` (VIP). Atención excluida |</div>\n<div class='tbl'>| Combo vivo si el VIP escribe de nuevo | Se cancela (`cancel_combo_for_chat`) |</div>\n\n<p>FB-02/FB-03/FB-04 (retrieval gold-first, contraejemplo determinista, columna <code>vip_id</code>) están en repos + retrievers <b>siempre</b>, independientes del flag de botones.</p>\n\n<h3>Dónde leer el detalle</h3>\n\n<li>Texto completo, decisiones FB-01..FB-06 y el parche propuesto de Fase 0: [`docs/SPEC-FEEDBACK.md`](../../../docs/SPEC-FEEDBACK.md).</li>\n<li>UX de dueña: [`docs/UX.md`](../../../docs/UX.md), [[superficie-admin]].</li>\n<li>Límites de módulo: [[agents-md]] (Director determinista, Learning post-turno, Behavior no genera texto).</li>\n\n<div class='prov'>^[docs/SPEC-FEEDBACK.md]</div>", "wikilinks": ["estado-del-proyecto", "zona-gris-y-politicas", "calidad-feedback", "superficie-admin", "agents-md"]}}, {"id": "article:entities/specs/spec-requerimientos", "label": "REQUERIMIENTOS.md", "color": "#4f8ef7", "group": "article", "detail": {"name": "REQUERIMIENTOS.md", "type": "article", "typeLabel": "Artículo", "summary": "Documento de requisitos del sistema (v2.1 — Arquitectura Cognitiva + refinamiento de aprendizaje, políticas y métricas). Define **qué debe cumplir** el sistema, sin prescribir tecnologías (eso vive...", "tags": "[spec, entities — specs, entities/specs, estado], requisito", "content": "<p>---</p>\n<p>title: REQUERIMIENTOS.md</p>\n<p>created: 2026-08-11</p>\n<p>updated: 2026-08-11</p>\n<p>type: entity</p>\n<p>tags: [spec, requisito, estado]</p>\n<p>sources: [../../docs/REQUERIMIENTOS.md]</p>\n<p>confidence: high</p>\n<p>---</p>\n\n<h2>REQUERIMIENTOS.md</h2>\n\n<p>Documento de requisitos del sistema (v2.1 — Arquitectura Cognitiva + refinamiento de aprendizaje, políticas y métricas). Define <b>qué debe cumplir</b> el sistema, sin prescribir tecnologías (eso vive en [[spec-1-1]]).</p>\n\n<h3>Contenido principal</h3>\n\n<li>**Arquitectura Cognitiva** (§3): el sistema no es un chatbot; el LLM es razonador especializado; principio rector (ver [[principio-rector]]).</li>\n<li>**Alcance** (§4): chats de negocio VIP, DM de la dueña, escalación, memoria, recontacto, promo no-VIP, sandbox, pipeline auditable.</li>\n<li>**Requisitos funcionales** (§9): REQ-AUTH, REQ-COG, REQ-VIP, REQ-HUM, REQ-MODE, REQ-ESC, REQ-GAP, REQ-MEM, REQ-TRN, REQ-EVAL, REQ-REE, REQ-PRO, REQ-ADM, REQ-PER, REQ-MET.</li>\n<li>**Requisitos no funcionales** (§10): REQ-NFR-01..16 (UX percibida, concurrencia, control de riesgo, explicabilidad, sustituibilidad, anti-contaminación, aprendizaje controlado…).</li>\n<li>**Reglas de negocio transversales** (§11): BR-01..15.</li>\n<li>**Matriz de decisión** (§12), historias de usuario (§13), criterios de aceptación AC-01..19 (§14).</li>\n<li>**MVP recomendado** (§18): recorte por releases (supervisado → MVP+ aprendizaje → producto completo).</li>\n\n<h3>Relaciones</h3>\n\n<li>Bases de [[spec-1-1]] (el &quot;cómo&quot;).</li>\n<li>Operación para agentes: [[agents-md]] (límites de módulo).</li>\n<li>Cambios de comportamiento de producto → actualizar REQUERIMIENTOS primero, luego SPEC (§17).</li>\n\n<div class='prov'>^[docs/REQUERIMIENTOS.md]</div>", "wikilinks": ["spec-1-1", "principio-rector", "spec-1-1", "agents-md"]}}, {"id": "article:entities/tablas/esquema-conocimiento", "label": "Esquema de Datos — Conocimiento (F2)", "color": "#4f8ef7", "group": "article", "detail": {"name": "Esquema de Datos — Conocimiento (F2)", "type": "article", "typeLabel": "Artículo", "summary": "Tablas de conocimiento (Fase 2 + extensiones 027/029). Índices HNSW con pgvector (384 dims). Las columnas de SPEC-1.1 que nunca se migraron (`example_applied`, `quality_score`, `source_staging_id`)...", "tags": "[dato, aprendizaje, entities — tablas, entities/tablas, memoria, politica]", "content": "<p>---</p>\n<p>title: Esquema de Datos — Conocimiento (F2)</p>\n<p>created: 2026-08-11</p>\n<p>updated: 2026-08-16</p>\n<p>type: entity</p>\n<p>tags: [dato, memoria, aprendizaje, politica]</p>\n<p>sources: [../../alembic/versions/003_f2_knowledge_tables.py, ../../alembic/versions/029_feedback_quality.py, ../../alembic/versions/027_ephemeral_events.py, ../../src/diana/infrastructure/db/models.py]</p>\n<p>confidence: high</p>\n<p>---</p>\n\n<h2>Esquema de Datos — Conocimiento (F2)</h2>\n\n<p>Tablas de conocimiento (Fase 2 + extensiones 027/029). Índices HNSW con pgvector (384 dims). Las columnas de SPEC-1.1 que nunca se migraron (<code>example_applied</code>, <code>quality_score</code>, <code>source_staging_id</code>) no existen en el esquema vivo.</p>\n\n<h3>Tablas F2</h3>\n\n<li>**`profiles`** — un embedding por VIP. PK `vip_id` (FK `vips.id`); `embedding` vector(384); `content` jsonb (no `data`); `tipo` text. Recuperado por `ProfileRetriever` (knowledge.profile).</li>\n<li>**`memories`** — hechos y preferencias por VIP, **siempre filtradas por `vip_id`** (BR-15; ver [[memoria-vip]]). `content` jsonb, `category`, `confidence`, `embedding`. F5 (022): `status` (`auto`|`pending_owner`|`approved`|`discarded`), `source_turn_id` (sin FK).</li>\n<li>**`contexts`** — contexto temporal interpretado: `chat_id`, `embedding`, `content` jsonb, `expires_at`.</li>\n<li>**`policies`** — doctrina estructurada: `trigger_description`, `rule`, `scope` (eje de canal, default `all`), `is_active`, `valid_until`, `source_query_id` (sin FK; no `created_from_gray_zone`). 029: `vip_id` nullable (FK `vips.id`, índice). `vip_id IS NULL` = global. No reutilizar `scope` para el eje VIP.</li>\n<li>**`examples`** — banco vivo: `turn_text`, `draft_text`, `corrected_text`, `context` jsonb, `is_counter_example` (no `is_counterexample`). 029: `quality` text NOT NULL default `standard` (repo valida `standard`|`gold`; gold rankea antes en similitud); `vip_id` nullable (FK `vips.id`). Visibilidad: Atención/None solo globales; VIP ve globales + propios.</li>\n<li>**`staging_candidates`** — Staging Area: `candidate_type` (013; no `type`), `payload` jsonb, `status` default `pending`, `turn_id` FK. No hay columna `created_by`; `original_draft` vive dentro de `payload` — ver [[aprendizaje-post-turno]].</li>\n<li>**`gray_zone_queries`** — consultas de doctrina: `question`, `draft`, `status` default `open`, `freeze_until`, `resolved_at` (no `resolution`). F4: `chat_id` (019), `business_connection_id` (020) — ver [[zona-gris-y-politicas]].</li>\n\n<h3>Eventos temporales (027)</h3>\n\n<li>**`ephemeral_events`** — contexto acotado que inyecta la dueña (`knowledge.ephemeral`). Activa si `is_paused = false` y `start_at &lt;= now &lt; end_at` (ventana semiabierta). Columnas: `body`, `start_at`, `end_at`, `is_paused`, `created_by`, `created_at`, `updated_at`. Sin feature flag: el augmenter está siempre cableado. Caducadas no se purgan; el retriever deja de encontrarlas.</li>\n\n<p>Relacionado: [[capability-registry]], [[spec-fase2]], [[anti-contaminacion]], [[esquema-fase6]], [[feature-flags]].</p>\n\n<div class='prov'>^[alembic/versions/003_f2_knowledge_tables.py, alembic/versions/027_ephemeral_events.py, alembic/versions/029_feedba</div>", "wikilinks": ["memoria-vip", "aprendizaje-post-turno", "zona-gris-y-politicas", "capability-registry", "spec-fase2", "anti-contaminacion", "esquema-fase6", "feature-flags"]}}, {"id": "article:entities/tablas/esquema-evolucion", "label": "Esquema de Datos — Evolución de Agente", "color": "#4f8ef7", "group": "article", "detail": {"name": "Esquema de Datos — Evolución de Agente", "type": "article", "typeLabel": "Artículo", "summary": "Fundaciones de datos de la evolución de agente (migraciones 024–026; ver [[spec-evolucion-agente]]). Sin estos datos no hay perfil evolutivo ni trust budget.", "tags": "[dato, aprendizaje, decision], entities — tablas, entities/tablas", "content": "<p>---</p>\n<p>title: Esquema de Datos — Evolución de Agente</p>\n<p>created: 2026-08-11</p>\n<p>updated: 2026-08-16</p>\n<p>type: entity</p>\n<p>tags: [dato, aprendizaje, decision]</p>\n<p>sources: [../../alembic/versions/024_agent_evolution_foundations.py, ../../alembic/versions/026_agent_evolution_turn_category_columns.py, ../../src/diana/infrastructure/db/models.py]</p>\n<p>confidence: high</p>\n<p>---</p>\n\n<h2>Esquema de Datos — Evolución de Agente</h2>\n\n<p>Fundaciones de datos de la evolución de agente (migraciones 024–026; ver [[spec-evolucion-agente]]). Sin estos datos no hay perfil evolutivo ni trust budget.</p>\n\n<h3>Tablas</h3>\n\n<li>**`vip_profile`** — perfil sintetizado por VIP: `stable_traits` jsonb, `recent_trend` jsonb, `sensitivities` jsonb, `version`, `last_synthesized_at`, `synthesis_trigger` (`volume`|`session_close`|`strong_signal`|`emotional_signal`) — ver [[perfil-evolutivo]].</li>\n<li>**`vip_profile_history`** — snapshots de cada versión anterior: `profile_snapshot` jsonb, `diff_summary`, `created_at` — auditoría de drift.</li>\n<li>**`vip_mood_state`** — mood por VIP: 3 ejes float `axis_playful_serious`, `axis_warm_distant`, `axis_energy`, `updated_at`.</li>\n<li>**`vip_trust_budget`** — confianza por `(vip_id, turn_category)`: `trust_score` (0..1), `correction_count`, `autonomous_count`, `last_correction_at` — ver [[trust-budget]].</li>\n<li>**`turn_category_log`** — una fila por turno (unique `turn_id`). Vocab CHECK: `fatico`|`informativo`|`emocional`|`sensible`. 026: `would_autonomous` (shadow: el carril rápido habría autoenviado; no lee trust budget), `confidence` (nullable; “no estoy seguro” es confidence por debajo del umbral, no un valor extra del CHECK).</li>\n<li>**`emotional_signal_log`** — señal emocional por turno: `signal_type` (`vulnerabilidad`|`angustia`|`revelacion_de_vida`|`ruptura_de_patron`), `intensity`, `should_trigger_synthesis`, `should_escalate_to_owner`, `pipeline_would_have_escalated` (nullable) — ver [[detector-emocional]].</li>\n<li>**`backfill_queue`** — cola durable de perfiles pendientes (023, REQ-MEM-05): una extracción a la vez, lock global.</li>\n\n<h3>Retención</h3>\n\n<p><code>vip_profile_history</code>, <code>turn_category_log</code> y <code>emotional_signal_log</code> crecen sin límite — política de purga con el patrón de <code>TracePurgeJob</code> (<code>agent_data_purge.py</code>; TTL env <code>*_TTL_DAYS</code>, default 90).</p>\n\n<p>Relacionado: [[perfil-evolutivo]], [[trust-budget]], [[detector-emocional]], [[memoria-vip]], [[feature-flags]].</p>\n\n<div class='prov'>^[alembic/versions/023-026, docs/SPEC-EVOLUCION-AGENTE.md §Fase 0]</div>", "wikilinks": ["spec-evolucion-agente", "perfil-evolutivo", "trust-budget", "detector-emocional", "perfil-evolutivo", "trust-budget", "detector-emocional", "memoria-vip", "feature-flags"]}}, {"id": "article:entities/tablas/esquema-fase1", "label": "Esquema de Datos — Base (F1)", "color": "#4f8ef7", "group": "article", "detail": {"name": "Esquema de Datos — Base (F1)", "type": "article", "typeLabel": "Artículo", "summary": "Tablas fundacionales de la Fase 1 (MVP Supervisado). Diseñadas en SPEC-1.1 §5; implementadas en 001–005 y columnas operativas posteriores sobre las mismas tablas.", "tags": "[dato, entities — tablas, entities/tablas, operacion], requisito", "content": "<p>---</p>\n<p>title: Esquema de Datos — Base (F1)</p>\n<p>created: 2026-08-11</p>\n<p>updated: 2026-08-16</p>\n<p>type: entity</p>\n<p>tags: [dato, requisito, operacion]</p>\n<p>sources: [../../alembic/versions/001_f1_foundation.py, ../../src/diana/infrastructure/db/models.py]</p>\n<p>confidence: high</p>\n<p>---</p>\n\n<h2>Esquema de Datos — Base (F1)</h2>\n\n<p>Tablas fundacionales de la Fase 1 (MVP Supervisado). Diseñadas en SPEC-1.1 §5; implementadas en 001–005 y columnas operativas posteriores sobre las mismas tablas.</p>\n\n<h3>Tablas</h3>\n\n<li>**`vips`** — allowlist: `telegram_user_id` único, `display_name`, `is_active`, `paused_until` (REQ-AUTH-01..03, REQ-ADM-04). 004: `frozen_until`. 007: `auto_send` (default false).</li>\n<li>**`message_history`** — historial crudo (`chat_id`, `role` vip|owner|bot, `text`, `timestamp`; índice por chat+timestamp).</li>\n<li>**`pipeline_traces`** — trazabilidad del pipeline (comprensión, plan, retrieved, prompt, texto generado, evaluación, decisión, delivery). 005: `timings` jsonb. 019: `channel_type` (`vip`|`atencion`).</li>\n<li>**`pending_deliveries`** — entregas en vuelo con `status` (pending|delivering|done|cancelled); recuperación tras reinicio (REQ-PER-02).</li>\n<li>**`turns`** — máquina de estados (`status`: received…delivered|escalated|superseded|failed; `superseded_by`). 002: `error`. 019: `channel_type`. Invariante: un no-terminal por chat (ver [[turn-coordinator]]).</li>\n<li>**`escalation_events`** — eventos de escalación (`tipo`: cortocircuito_determinista | semantica, `motivo`, `notificado`; ver [[escalacion]]).</li>\n<li>**`business_connections`** — conexiones de negocio persistentes (015; REQ-PER-01).</li>\n<li>**`pending_approvals`** — cola de aprobaciones en DM (CAS `claim_waiting`, paridad con el doble en memoria).</li>\n<li>**`system_config`** — clave/valor jsonb global (flags sembrados, umbrales). Runtime de flags es env; ver [[feature-flags]].</li>\n\n<p>Relacionado: [[spec-1-1]], [[superficie-admin]], [[infrastructure-persistence]].</p>\n\n<div class='prov'>^[alembic/versions/001-007, src/diana/infrastructure/db/models.py]</div>", "wikilinks": ["turn-coordinator", "escalacion", "feature-flags", "spec-1-1", "superficie-admin", "infrastructure-persistence"]}}, {"id": "article:entities/tablas/esquema-fase3", "label": "Esquema de Datos — Proactividad y Métricas (F3)", "color": "#4f8ef7", "group": "article", "detail": {"name": "Esquema de Datos — Proactividad y Métricas (F3)", "type": "article", "typeLabel": "Artículo", "summary": "Tablas de la Fase 3 (Producto Completo): recontacto, promo, métricas, configuración y timers de runtime.", "tags": "[dato, entities — tablas, entities/tablas, modo], operacion", "content": "<p>---</p>\n<p>title: Esquema de Datos — Proactividad y Métricas (F3)</p>\n<p>created: 2026-08-11</p>\n<p>updated: 2026-08-16</p>\n<p>type: entity</p>\n<p>tags: [dato, operacion, modo]</p>\n<p>sources: [../../alembic/versions/008_recontact_promo.py, ../../alembic/versions/003_f2_knowledge_tables.py, ../../src/diana/infrastructure/db/models.py]</p>\n<p>confidence: high</p>\n<p>---</p>\n\n<h2>Esquema de Datos — Proactividad y Métricas (F3)</h2>\n\n<p>Tablas de la Fase 3 (Producto Completo): recontacto, promo, métricas, configuración y timers de runtime.</p>\n\n<h3>Tablas</h3>\n\n<li>**`recontact_schedules`** — recontacto programado: `last_contact_at`, `next_contact_at`, `status` (pending|done|cancelled). Índice por `(next_contact_at, status)`.</li>\n<li>**`promo_triggers`** — triggers exactos de promo: `trigger_text` único, `response_sequence` jsonb, `repeat_first_message`, `is_active`.</li>\n<li>**`promo_executions`** — trazabilidad ligera (`chat_id`, `trigger_id`, `sent_at`, `sequence_sent`, `status`) — no usa `pipeline_traces` (no es turno cognitivo).</li>\n<li>**`learning_metrics`** — EAV creado en 003 (no columnas semanales): `metric_name` text, `value` float, `vip_id` nullable, `recorded_at`. 009 no ALTER esta tabla; solo siembra el blob `calibration` en `system_config`.</li>\n<li>**`system_config`** — configuración global (flags sembrados, umbrales, blobs) — base de [[feature-flags]] y de [[calibracion-de-umbrales]]. Los flags de runtime se leen de env, no de esta tabla.</li>\n<li>**`runtime_timers`** — timers persistentes de runtime para recuperación tras crash (014/016).</li>\n<li>**`owner_marks`** — marcas de la dueña (ej. falsos positivos de escalación) para métricas. PK compuesta `(turn_id, kind)`.</li>\n\n<p>Relacionado: [[spec-fase3]], [[application-services]], [[jobs]], [[modos-de-operacion]].</p>\n\n<div class='prov'>^[alembic/versions/003, 008-010, 014, 016, src/diana/infrastructure/db/models.py]</div>", "wikilinks": ["feature-flags", "calibracion-de-umbrales", "spec-fase3", "application-services", "jobs", "modos-de-operacion"]}}, {"id": "article:entities/tablas/esquema-fase4", "label": "Esquema de Datos — Canal Atención (F4)", "color": "#4f8ef7", "group": "article", "detail": {"name": "Esquema de Datos — Canal Atención (F4)", "type": "article", "typeLabel": "Artículo", "summary": "Cambios de esquema de la Fase 4 (Atención al Cliente General, canal no-VIP; ver [[canal-atencion]]). Migraciones 018–021.", "tags": "[dato, entities — tablas, entities/tablas, modo, regla-negocio]", "content": "<p>---</p>\n<p>title: Esquema de Datos — Canal Atención (F4)</p>\n<p>created: 2026-08-11</p>\n<p>updated: 2026-08-16</p>\n<p>type: entity</p>\n<p>tags: [dato, modo, regla-negocio]</p>\n<p>sources: [../../alembic/versions/018_channel_type_atencion.py, ../../alembic/versions/021_atencion_cycles.py, ../../src/diana/infrastructure/db/models.py]</p>\n<p>confidence: high</p>\n<p>---</p>\n\n<h2>Esquema de Datos — Canal Atención (F4)</h2>\n\n<p>Cambios de esquema de la Fase 4 (Atención al Cliente General, canal no-VIP; ver [[canal-atencion]]). Migraciones 018–021.</p>\n\n<h3>Tablas y cambios</h3>\n\n<li>**`persona_versions.channel_type`** — columna (`vip` | `atencion`); unique parcial activo por `(channel_type, is_active)`. Seed del perfil `atencion`.</li>\n<li>**`daily_message_limits`** — contador diario por chat de canal atención: PK `(chat_id, fecha_local)`, `count`. Upsert atómico por turno; el corte es determinista (REQ-ATN-03/04).</li>\n<li>**`atencion_cycles`** — ciclo de vida por chat (021): PK `chat_id`, `started_at` (ventana lineal de 30 días, no se extiende al re-trigger), `closed_at` / `close_reason` (cierre anticipado, p. ej. pago).</li>\n<li>**`gray_zone_queries`** — F4 añade `chat_id` (019) y `business_connection_id` (020) para freeze/reconstrucción en chats sin VIP.</li>\n<li>**`turns.channel_type`** / **`pipeline_traces.channel_type`** — default `vip` (019).</li>\n\n<h3>Reglas</h3>\n\n<li>El canal `atencion` usa solo `message_history` por chat — **nunca** `memories` (anti-contaminación entre canales).</li>\n<li>Los turns de atención se marcan `channel_type=&quot;atencion&quot;` en `turns` y `pipeline_traces`.</li>\n\n<p>Relacionado: [[spec-fase4]], [[canal-atencion]], [[anti-contaminacion]], [[esquema-conocimiento]].</p>\n\n<div class='prov'>^[alembic/versions/018-021, docs/SPEC-FASE4.md §13]</div>", "wikilinks": ["canal-atencion", "spec-fase4", "canal-atencion", "anti-contaminacion", "esquema-conocimiento"]}}, {"id": "article:entities/tablas/esquema-fase6", "label": "Esquema de Datos — Vínculo Lucien (F6)", "color": "#4f8ef7", "group": "article", "detail": {"name": "Esquema de Datos — Vínculo Lucien (F6)", "type": "article", "typeLabel": "Artículo", "summary": "Ledger de expulsiones Canal VIP (Lucien → Diana). Migración **`028_link_events`** (encadena 027; SPEC-FASE6 decía 027, pero 027 ya era `ephemeral_events`).", "tags": "[dato, contrato], entities — tablas, entities/tablas, operacion", "content": "<p>---</p>\n<p>title: Esquema de Datos — Vínculo Lucien (F6)</p>\n<p>created: 2026-08-16</p>\n<p>updated: 2026-08-21</p>\n<p>type: entity</p>\n<p>tags: [dato, operacion, contrato]</p>\n<p>sources: [../../alembic/versions/028_link_events.py, ../../src/diana/infrastructure/db/repositories/link_events.py, ../../docs/SPEC-FASE6.md]</p>\n<p>confidence: high</p>\n<p>---</p>\n\n<h2>Esquema de Datos — Vínculo Lucien (F6)</h2>\n\n<p>Ledger de expulsiones Canal VIP (Lucien → Diana). Migración <b><code>028_link_events</code></b> (encadena 027; SPEC-FASE6 decía 027, pero 027 ya era <code>ephemeral_events</code>).</p>\n\n<h3>Tabla</h3>\n\n<li>**`link_events`** — una fila por payload `[LINK]`. `event_id` text unique (dedup idempotente). `user_id` del expulsado; `username`, `channel_id`, `channel_name` opcionales; `reason` obligatorio. `vip_id` UUID suelto (sin FK): se resuelve antes del insert si el expulsado es VIP activo; NULL si no. `state` default `pending`. `decision_at` al decidir. `created_at`.</li>\n\n<p>ORM: clase <code>LinkEvent</code> <b>inline</b> en <code>src/diana/infrastructure/db/repositories/link_events.py</code> (no está en <code>models.py</code>). Se registra en <code>Base.metadata</code> al importar el paquete de repositorios.</p>\n\n<h3>Estados</h3>\n\n<p><code>pending</code> → <code>notified</code> → <code>decided_expel</code> | <code>decided_disable</code> | <code>decided_keep</code>. Si no es VIP activo: <code>ignored_not_vip</code> (sin aviso a la dueña).</p>\n\n<h3>Gate</h3>\n\n<p>Solo corre con <code>FEATURE_LINK_ENABLED</code> y <code>LINK_CHAT_ID</code> (ver [[feature-flags]]). El flag está <b>activo</b> en <code>.env</code> desde 2026-08-21 (Fase 6 desplegada y verificada E2E); con el flag off el comportamiento sería idéntico al previo a la F6. Anti-contaminación: el <code>[LINK]</code> no entra al pipeline ni a <code>message_history</code>.</p>\n\n<p>Relacionado: [[esquema-conocimiento]], [[infrastructure-persistence]], [[modos-de-operacion]], [[spec-fase3]].</p>\n\n<div class='prov'>^[alembic/versions/028_link_events.py, src/diana/application/link.py, docs/SPEC-FASE6.md]</div>", "wikilinks": ["feature-flags", "esquema-conocimiento", "infrastructure-persistence", "modos-de-operacion", "spec-fase3"]}}, {"id": "topic:entities-—-specs", "label": "Entities — Specs", "color": "#2bb673", "group": "topic", "detail": {"name": "Entities — Specs", "type": "topic", "typeLabel": "Tema", "summary": "Category from index: Entities — Specs (13 articles)", "tags": "category", "content": "<i>Sin contenido.</i>", "wikilinks": []}}, {"id": "topic:entities-—-módulos", "label": "Entities — Módulos", "color": "#2bb673", "group": "topic", "detail": {"name": "Entities — Módulos", "type": "topic", "typeLabel": "Tema", "summary": "Category from index: Entities — Módulos (9 articles)", "tags": "category", "content": "<i>Sin contenido.</i>", "wikilinks": []}}, {"id": "topic:entities-—-comandos", "label": "Entities — Comandos", "color": "#2bb673", "group": "topic", "detail": {"name": "Entities — Comandos", "type": "topic", "typeLabel": "Tema", "summary": "Category from index: Entities — Comandos (1 articles)", "tags": "category", "content": "<i>Sin contenido.</i>", "wikilinks": []}}, {"id": "topic:entities-—-tablas", "label": "Entities — Tablas", "color": "#2bb673", "group": "topic", "detail": {"name": "Entities — Tablas", "type": "topic", "typeLabel": "Tema", "summary": "Category from index: Entities — Tablas (6 articles)", "tags": "category", "content": "<i>Sin contenido.</i>", "wikilinks": []}}, {"id": "topic:concepts", "label": "Concepts", "color": "#2bb673", "group": "topic", "detail": {"name": "Concepts", "type": "topic", "typeLabel": "Tema", "summary": "Category from index: Concepts (23 articles)", "tags": "category", "content": "<i>Sin contenido.</i>", "wikilinks": []}}, {"id": "topic:comparisons", "label": "Comparisons", "color": "#2bb673", "group": "topic", "detail": {"name": "Comparisons", "type": "topic", "typeLabel": "Tema", "summary": "Category from index: Comparisons (0 articles)", "tags": "category", "content": "<i>Sin contenido.</i>", "wikilinks": []}}, {"id": "topic:queries", "label": "Queries", "color": "#2bb673", "group": "topic", "detail": {"name": "Queries", "type": "topic", "typeLabel": "Tema", "summary": "Category from index: Queries (0 articles)", "tags": "category", "content": "<i>Sin contenido.</i>", "wikilinks": []}}, {"id": "entity:staging-area", "label": "staging_area", "color": "#e8a33d", "group": "entity", "detail": {"name": "staging_area", "type": "entity", "typeLabel": "Entidad", "summary": "Área intermedia donde los candidatos de aprendizaje (examples, memory, policy) esperan aprobación antes de promoverlos; operada desde la capa de aplicación, nunca durante el pipeline", "tags": "dato, aprendizaje", "content": "<i>Sin contenido.</i>", "wikilinks": []}}, {"id": "entity:banco-ejemplos", "label": "Banco de Ejemplos (few-shot)", "color": "#e8a33d", "group": "entity", "detail": {"name": "Banco de Ejemplos (few-shot)", "type": "entity", "typeLabel": "Entidad", "summary": "Casos exitosos reutilizables entre VIP con reglas de acceso propias, separado de la Memoria por VIP (BR-10); el retrieval prioriza similitud semantica, luego recencia y limpieza, pudiendo incluir un contraejemplo junto al positivo.", "tags": "aprendizaje, memoria", "content": "<i>Sin contenido.</i>", "wikilinks": []}}, {"id": "entity:system-config", "label": "system_config", "color": "#e8a33d", "group": "entity", "detail": {"name": "system_config", "type": "entity", "typeLabel": "Entidad", "summary": "Tabla de configuracion del sistema: recibe los umbrales calibrados con registro de timestamp para auditoria y es el mecanismo de override manual de las constantes fijas de seguridad y confianza.", "tags": "operacion, estado", "content": "<i>Sin contenido.</i>", "wikilinks": []}}, {"id": "entity:cortocircuito-escalacion", "label": "Cortocircuito deterministico de escalacion", "color": "#e8a33d", "group": "entity", "detail": {"name": "Cortocircuito deterministico de escalacion", "type": "entity", "typeLabel": "Entidad", "summary": "Palabras o temas prohibidos (pagos, reclamos, crisis, 'eres un bot') disparan la escalacion antes del Analista, sin costo de LLM y sin riesgo de que el modelo improvise (REQ-COG-16, REQ-ESC-01).", "tags": "riesgo, flujo", "content": "<i>Sin contenido.</i>", "wikilinks": []}}, {"id": "entity:espanol-neutro", "label": "Espanol neutro (regla de idioma)", "color": "#e8a33d", "group": "entity", "detail": {"name": "Espanol neutro (regla de idioma)", "type": "entity", "typeLabel": "Entidad", "summary": "Todo texto de producto (UI, prompts, seeds, mensajes al VIP, specs) se escribe en espanol neutro; el voseo rioplatense esta prohibido y cualquier texto en voseo se corrige de inmediato (AGENTS.md 0.6).", "tags": "regla-negocio, contrato", "content": "<i>Sin contenido.</i>", "wikilinks": []}}, {"id": "entity:zona-gris", "label": "Zona gris", "color": "#e8a33d", "group": "entity", "detail": {"name": "Zona gris", "type": "entity", "typeLabel": "Entidad", "summary": "Estado de consulta a la duena cuando el turno necesita politica y no existe una (needs_policy); su resolucion se convierte en Politica estructurada, no en few-shot, y tiene jerarquia definida frente a la escalacion (BR-02).", "tags": "decision, flujo", "content": "<i>Sin contenido.</i>", "wikilinks": []}}, {"id": "claim:umbrales-seguridad-nunca-auto-calibrados", "label": "Umbrales de seguridad y confianza: constantes fijas con override manual", "color": "#8e5bd9", "group": "claim", "detail": {"name": "Umbrales de seguridad y confianza: constantes fijas con override manual", "type": "claim", "typeLabel": "Claim", "summary": "Tras el incidente de escalaciones masivas (2026-08, calibracion de safety_min a ~0.95), los umbrales de seguridad y confianza quedan prohibidos de auto-calibracion por LLM: son constantes fijas con override manual via system_config (SPEC-EVOLUCION-AGENTE v1.2); la calibracion automatica esta desactivada en produccion.", "tags": "riesgo, decision", "content": "<i>Sin contenido.</i>", "wikilinks": []}}, {"id": "claim:zona-gris-antes-que-riesgo-alto", "label": "La zona gris se resuelve antes que escalar por risk=alto", "color": "#8e5bd9", "group": "claim", "detail": {"name": "La zona gris se resuelve antes que escalar por risk=alto", "type": "claim", "typeLabel": "Claim", "summary": "BR-02 modificado: la falta de doctrina es causa tratable y resolverla elimina escalaciones futuras, por eso la escalacion semantica por riesgo se evalua despues de la zona gris; la escalacion por seguridad mantiene prioridad absoluta sobre ambas.", "tags": "decision, flujo", "content": "<i>Sin contenido.</i>", "wikilinks": []}}, {"id": "claim:aprendizaje-siempre-post-turno", "label": "El aprendizaje es siempre post-turno y controlado", "color": "#8e5bd9", "group": "claim", "detail": {"name": "El aprendizaje es siempre post-turno y controlado", "type": "claim", "typeLabel": "Claim", "summary": "El aprendizaje ocurre siempre despues de terminar el turno, nunca durante el pipeline de decision (REQ-TRN-05, BR-11); nada se promueve al banco de ejemplos sin confirmacion explicita de la duena y ningun hecho de memoria se convierte automaticamente en few-shot.", "tags": "aprendizaje", "content": "<i>Sin contenido.</i>", "wikilinks": []}}, {"id": "entity:tabla-memories", "label": "Tabla memories", "color": "#e8a33d", "group": "entity", "detail": {"name": "Tabla memories", "type": "entity", "typeLabel": "Entidad", "summary": "Tabla de memoria procesada del VIP: filas por categoría (identidad, preferencias, comercial, limites, sensible, perfil) con embedding y content jsonb, filtrada siempre por vip_id.", "tags": "dato, memoria", "content": "<i>Sin contenido.</i>", "wikilinks": []}}, {"id": "entity:modo-sandbox", "label": "Modo sandbox", "color": "#e8a33d", "group": "entity", "detail": {"name": "Modo sandbox", "type": "entity", "typeLabel": "Entidad", "summary": "Modo de operación con el pipeline cognitivo completo donde el Behavior Engine usa FakeDelivery; no contamina el aprendizaje de producción.", "tags": "modo, operacion", "content": "<i>Sin contenido.</i>", "wikilinks": []}}, {"id": "entity:congelacion", "label": "Congelación", "color": "#e8a33d", "group": "entity", "detail": {"name": "Congelación", "type": "entity", "typeLabel": "Entidad", "summary": "Estado del VIP durante una consulta de zona gris abierta: cero señales del bot (sin lectura, typing, envío ni recontacto) hasta resolver la política.", "tags": "modo, flujo, politica", "content": "<i>Sin contenido.</i>", "wikilinks": []}}, {"id": "entity:objeto-comprension", "label": "Objeto de Comprensión", "color": "#e8a33d", "group": "entity", "detail": {"name": "Objeto de Comprensión", "type": "entity", "typeLabel": "Entidad", "summary": "Salida estructurada del Analista (intent, topics, emotion, urgency, risk, flags needs_*) que funciona como lenguaje interno del pipeline; todo lo demás depende de él.", "tags": "arquitectura, contrato", "content": "<i>Sin contenido.</i>", "wikilinks": []}}, {"id": "entity:turn-categories", "label": "Categorías de turno", "color": "#e8a33d", "group": "entity", "detail": {"name": "Categorías de turno", "type": "entity", "typeLabel": "Entidad", "summary": "Clasificación de turnos (phatic, informational, emotional, sensitive) registrada en turn_category_log que define el trust budget por categoría de turno.", "tags": "dato, decision", "content": "<i>Sin contenido.</i>", "wikilinks": []}}, {"id": "entity:categoria-sensitive-no-autonoma", "label": "Regla EA-03: sensitive nunca autónoma", "color": "#e8a33d", "group": "entity", "detail": {"name": "Regla EA-03: sensitive nunca autónoma", "type": "entity", "typeLabel": "Entidad", "summary": "Regla dura: la categoría de turno sensitive nunca entra en autonomía sin importar el trust_score; siempre requiere aprobación del owner.", "tags": "regla-negocio, riesgo, decision", "content": "<i>Sin contenido.</i>", "wikilinks": []}}, {"id": "claim:sistema-toma-decisiones", "label": "El sistema no genera respuestas: toma decisiones", "color": "#8e5bd9", "group": "claim", "detail": {"name": "El sistema no genera respuestas: toma decisiones", "type": "claim", "typeLabel": "Claim", "summary": "Principio rector de DianaV2: el LLM es un razonador especializado dentro del pipeline y las respuestas son solo consecuencia de decisiones; el Director jamás pregunta a un LLM qué hacer (BR-08).", "tags": "arquitectura, decision", "content": "<i>Sin contenido.</i>", "wikilinks": []}}, {"id": "claim:umbrales-calibrados-empiricamente", "label": "Los umbrales operativos se calibran empíricamente, no   physics: { stabilization: {iterations: 350}, barnesHut: {gravitationalConstant: -3200, springLength: 135, springConstant: 0.045}},
  nodes: { shape: 'dot', size: 15, font: {color: '#dde3ea', size: 11}, borderWidth: 1, borderWidthSelected: 2.5 },
  edges: { color: {color: '#4a5a6e', highlight: '#7ab8ff'}, font: {color: '#8fa3b8', size: 9, strokeWidth: 0}, smooth: {enabled: true} },
  interaction: { hover: true, tooltipDelay: 150, navigationButtons: true, keyboard: true, selectConnectedEdges: true }
});

// stats
document.getElementById('stats').textContent = NODES.length + ' nodos · ' + EDGES.length + ' relaciones';

// filtros por tipo
const filterBar = document.getElementById('filters');
TYPE_ORDER.forEach(t => {
  const c = document.createElement('div');
  c.className = 'chip on'; c.textContent = t;
  c.onclick = () => {
    if (ACTIVE.has(t)) { ACTIVE.delete(t); c.classList.remove('on'); }
    else { ACTIVE.add(t); c.classList.add('on'); }
    applyFilters();
  };
  filterBar.appendChild(c);
});
function applyFilters() {
  const ids = new Set(NODES.filter(n => ACTIVE.has(n.type)).map(n => n.id));
  nodes.forEach(n => nodes.update({id: n.id, hidden: !ids.has(n.id)}));
  edges.forEach(e => {
    const vis = ids.has(e.from) && ids.has(e.to);
    edges.update({id: e.id, hidden: !vis});
  });
}

// slugify: normaliza títulos a slugs (sin acentos, guiones) para resolver wikilinks
function slugify(s) {
  return String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '')
    .replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
}
function findNodeBySlug(slug) {
  const w = slugify(slug);
  return NODES.find(n => slugify(n.label) === w
    || String(n.id).includes(':' + w) || String(n.id).includes('/' + w)) || null;
}
// panel lateral
const side = document.getElementById('side');
const sideBody = document.getElementById('sideBody');
function showDetail(d) {
  if (!d) return;
  const wl = (d.wikilinks || []).map(w => `<a data-wl="${w.replace(/"/g,'&quot;')}">[[${w}]]</a>`).join(' ');
  sideBody.innerHTML = `
    <h2>${d.name}</h2>
    <span class="badge" style="background:${({article:'#4f8ef7',entity:'#e8a33d',claim:'#8e5bd9',topic:'#2bb673',table:'#e86f4f',source:'#999999',module:'#4f8ef7',concept:'#e8a33d'})[d.type] || '#888'}">${d.typeLabel}</span>
    ${d.tags ? `<div class="tags">🏷️ ${d.tags}</div>` : ''}
    ${d.summary ? `<p><b>${d.summary}</b></p>` : ''}
    ${wl ? `<div class="wl">Enlaza a: ${wl}</div>` : ''}
    <hr style="border:none;border-top:1px solid var(--border);margin:10px 0"/>
    ${d.content}
  `;
  side.classList.add('open');
  sideBody.querySelectorAll('a[data-wl]').forEach(a => {
    a.onclick = () => {
      const target = findNodeBySlug(a.dataset.wl);
      if (target) { network.selectNodes([target.id]); network.focus(target.id, {scale: 1.1}); showDetail(target.detail); }
      else { hint.textContent = `No encontré '${a.dataset.wl}' en el grafo`; }
    };
  });
}
document.getElementById('closeSide').onclick = () => side.classList.remove('open');
network.on('selectNode', p => { showDetail(p.nodes[0] && nodes.get(p.nodes[0]).detail); });
network.on('deselectNode', () => side.classList.remove('open'));

// busqueda con navegacion entre coincidencias
const search = document.getElementById('search');
const hint = document.getElementById('hint');
const resultsBox = document.getElementById('results');
let hits = [], hitIdx = 0;
function renderDropdown() {
  resultsBox.innerHTML = '';
  if (!hits.length) { resultsBox.style.display = 'none'; return; }
  hits.forEach((h, i) => {
    const row = document.createElement('div');
    row.className = 'rrow' + (i === hitIdx ? ' cur' : '');
    row.innerHTML = `${h.label}<span class="rtype">${h.detail.typeLabel}</span>`;
    row.onclick = () => { goHit(i); };
    resultsBox.appendChild(row);
  });
  resultsBox.style.display = 'block';
}
function goHit(i) {
  if (!hits.length) return;
  hitIdx = ((i % hits.length) + hits.length) % hits.length;
  const h = hits[hitIdx];
  network.selectNodes([h.id]); network.focus(h.id, {scale: 1.15}); showDetail(h.detail);
  hint.textContent = hits.length > 1
    ? `Coincidencia ${hitIdx + 1} de ${hits.length} — Enter para la siguiente`
    : '1 coincidencia';
  renderDropdown();
}
search.addEventListener('input', () => {
  const q = search.value.trim().toLowerCase();
  if (!q) { hits = []; hitIdx = 0; renderDropdown(); network.selectNodes([]);
    hint.textContent = 'Clic en un nodo para ver detalle'; return; }
  hits = NODES.filter(n => String(n.label).toLowerCase().includes(q) ||
                            String(n.detail.summary).toLowerCase().includes(q)).slice(0, 10);
  hitIdx = 0;
  if (hits.length === 0) { renderDropdown(); hint.textContent = 'Sin resultados'; return; }
  goHit(0);
});
search.addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); if (hits.length) goHit(hitIdx + 1); }
  if (e.key === 'Escape') { search.value = ''; hits = []; renderDropdown(); }
});
document.addEventListener('click', e => {
  if (!resultsBox.contains(e.target) && e.target !== search) resultsBox.style.display = 'none';
});
window.addEventListener('resize', () => network.redraw());
setTimeout(() => { document.body.dataset.theme = (tg && tg.colorScheme === 'light') ? 'light' : 'dark'; }, 50);
</script>
</body>
</html>
