olicy=true` o el Evaluador detecta Doctrina insuficiente — esto es una **observación**, no una decisión (REQ-GAP-01).</li>\n<li>Si ya existe política aplicable, se reutiliza y no se vuelve a preguntar (REQ-GAP-02). El retriever ve políticas globales más, en un turno VIP, las de ese `vip_id` (ver [[capability-registry]]).</li>\n<li>Si no hay política, el [[decisor]] decide &quot;Consultar doctrina&quot; (prioridad 2) y el VIP queda **congelado** (sin lectura/typing/envío/recontacto del bot). En Atención (sin `vip_id`) el freeze es la fila abierta de `gray_zone_queries` resuelta por `chat_id`.</li>\n<li>La dueña responde: doctrina, usar el borrador propuesto, u omitir (REQ-GAP-04).</li>\n<li>El sistema pide **generalización**: &quot;¿esto aplica siempre que pregunten por X, o solo en este caso?&quot; — sin este paso no se crea la política (REQ-GAP-11).</li>\n<li>La respuesta se destila a política **estructurada**, nunca literal (REQ-GAP-05, BR-14), y pasa por confirmación explícita antes de quedar activa (`promote_to_policy`, opcionalmente con `vip_id`).</li>\n<li>Se descongela y el flujo vuelve al camino normal (REQ-GAP-06).</li>\n\n<h3>Paracaídas si falla el aviso a la dueña (F6, 2026-08-16)</h3>\n\n<p><code>consult_doctrine</code> crea la query (y congela) <b>antes</b> de mandar el DM. Si <code>send_doctrine_query</code> lanza:</p>\n\n<li>`GrayZoneService.discard_and_close` — cierra la query y descongela.</li>\n<li>La decisión se degrada a `approve` con `reason=vip_doctrine_notify_failed` (VIP) o `atencion_doctrine_notify_failed` (Atención).</li>\n<li>El turno pasa a `PENDING_APPROVAL` y la dueña ve el borrador, no un freeze huérfano de 24 h sin DM.</li>\n\n<p>Otros demotes de aplicación (no cambian al Decider): sandbox sin VIP → <code>sandbox_no_vip_doctrine</code>; Atención sin flags/servicio → <code>atencion_no_vip_doctrine</code>. Si fallan a la vez la entrega supervisada y el fallback de escalate, <code>reopen_query</code> puede reabrir una fila <code>resolved</code>/<code>expired</code> para no dejar el turno en gray_zone muerto.</p>\n\n<h3>Estructura obligatoria de una política (REQ-GAP-10)</h3>\n\n<p><code>disparador</code> (tipo de situación, no palabras exactas) + <code>regla</code> (qué hacer/decir) + <code>ejemplo_aplicado</code> (opcional, contrato de producto; la fila live guarda <code>trigger_description</code>, <code>rule</code>, <code>scope</code>, <code>valid_until</code>, <code>vip_id</code>) + <code>alcance</code> (todos los VIP, un VIP, o segmento) + <code>vigencia</code> (expiración opcional).</p>\n\n<p><code>vip_id</code> es eje distinto de <code>scope</code>: Atención solo recupera filas globales; un VIP recupera globales + las suyas ([[anti-contaminacion]]).</p>\n\n<h3>Límites</h3>\n\n<li>La zona gris **no** se usa para dudas de</li>", "wikilinks": ["capability-registry", "decisor", "anti-contaminacion"]}}, {"id": "article:entities/comandos/superficie-admin", "label": "Superficie de Admin", "color": "#4f8ef7", "group": "article", "detail": {"name": "Superficie de Admin", "type": "article", "typeLabel": "Artículo", "summary": "Superficie de administración de la dueña en el DM con el bot (REQ-ADM-*). Toda acción de admin exige que el emisor sea el admin configurado (middleware `owner.py`). La vía principal es el **menú** ...", "tags": "[operacion, contrato, entities — comandos, entities/comandos, modo]", "content": "<p>---</p>\n<p>title: Superficie de Admin</p>\n<p>created: 2026-08-11</p>\n<p>updated: 2026-08-21</p>\n<p>type: entity</p>\n<p>tags: [operacion, contrato, modo]</p>\n<p>sources: [../../src/diana/telegram/handlers/, ../../docs/UX.md, ../../docs/PRODUCT_OWNER_ADMIN_SANDBOX.md]</p>\n<p>confidence: high</p>\n<p>---</p>\n\n<h2>Superficie de Admin</h2>\n\n<p>Superficie de administración de la dueña en el DM con el bot (REQ-ADM-*). Toda acción de admin exige que el emisor sea el admin configurado (middleware <code>owner.py</code>). La vía principal es el <b>menú</b> (<code>/start</code> o <code>/menu</code>); los slash commands son alias.</p>\n\n<h3>Handlers reales (2026-08-16)</h3>\n\n<li>**`menu.py`** — panel `🌸 Panel de Diana` y wizards (TTL 15 min + `/cancelar`).</li>\n<li>**`admin.py`** — comandos legacy, texto libre de Corregir/Reprender/doctrina, estado.</li>\n<li>**`doctrine.py`** — zona gris: `dr:` responder (sesión de texto), `dx:` usar borrador, `de:` escalar (ver [[zona-gris-y-politicas]]).</li>\n<li>**`staging.py`** — cola de candidatos (`sp:` promover, `sd:` descartar en dos pasos; ver [[aprendizaje-post-turno]]).</li>\n<li>**`memory_approval.py`** — hechos sensibles `pending_owner` (F5; ver [[memoria-vip]]).</li>\n<li>**`persona_admin.py`** — `persona_versions` por canal ([[canal-atencion]]); flag `FEATURE_PERSONA_ADMIN_ENABLED`.</li>\n<li>**`callbacks.py`** — teclado del borrador: aprobar / corregir / escalar / versiones / traza / nota; Destacar/Reprender si el flag de [[calidad-feedback]] está ON y el turno es VIP.</li>\n<li>**`link.py`** — decisión sobre VIP expulsado del canal (Fase 6, `link:expel|disable|keep`).</li>\n<li>**`business.py`** — mensajes de negocio (VIP); tags de media `[imagen]`/`[video]`/… para que el modelo vea el tipo de archivo.</li>\n<li>**`business_connection.py`** — gestión de la conexión de negocio.</li>\n\n<h3>Teclado del borrador</h3>\n\n<div class='tbl'>| Fila | Botones | Condición |</div>\n<div class='tbl'>|---|---|---|</div>\n<div class='tbl'>| 1 | ✅ Aprobar · ✏️ Corregir · ⚠️ Escalar | Siempre |</div>\n<div class='tbl'>| 2 | Destacar · Reprender | `FEATURE_QUALITY_FEEDBACK_ENABLED` **y** `vip_id` presente (flag **activo** en `.env`, 2026-08-21) |</div>\n<div class='tbl'>| 3 | ◀ Anterior · 🔄 Regenerar · Siguiente ▶ | Siempre |</div>\n<div class='tbl'>| 4 | 🔍 Traza (`vtd:` vuelve al borrador) · 📝 Agregar nota | Siempre |</div>\n\n<p>Aprobar edita el mismo DM en vivo (<code>👀 Mensaje visto</code> → <code>✍️ Escribiendo…</code> → <code>✅ Enviado</code>). Regenerar muestra <code>♻️ Regenerando…</code> solo si el run arranca. Un toque stale usa tokens honestos (<code>stale_replaced</code>, <code>stale_already_sent</code>, …). El header del DM usa el <code>display_name</code> del VIP.</p>\n\n<p>Destacar confirma alcance (General / Este VIP) <b>antes</b> de enviar. Reprender <b>entrega el texto al instante</b>; el combo posterior solo guarda la lección. Detalle: [[calidad-feedback]] y [[spec-feedback]].</p>\n\n<h3>Menú (`m:`)</h3>\n\n<p>Categorías: Mis VIPs · Revisar mensajes · Modo de prueba · Métricas y aprendizaje · Historial y diagnóstico · Eventos temporales · Personalidad y reglas (flag) · Configuración.</p>\n\n<p>Si falla el aviso de doctrina en un turno VIP, el orquestador descongela y degrada a <code>approve</code> (<code>vip_doctrine_notify_failed</code>) en vez de dejar un freeze de 24 h sin DM.</p>\n\n<h3>Capacidades por área (REQ-ADM)</h3>\n\n<li>Allowlist VIP: añadir/quitar sin redeploy (REQ-AUTH-02); tope configurabl</li>", "wikilinks": ["zona-gris-y-politicas", "aprendizaje-post-turno", "memoria-vip", "canal-atencion", "calidad-feedback", "calidad-feedback", "spec-feedback", "comunicacion-con-producto", "canal-atencion"]}}, {"id": "article:entities/modulos/application-services", "label": "Application Services", "color": "#4f8ef7", "group": "article", "detail": {"name": "Application Services", "type": "article", "typeLabel": "Artículo", "summary": "Capa de orquestación de casos de uso. Traduce intenciones de la capa Telegram en ejecución de servicios.", "tags": "[modulo, contrato, entities — módulos, entities/modulos, flujo]", "content": "<p>---</p>\n<p>title: Application Services</p>\n<p>created: 2026-08-11</p>\n<p>updated: 2026-08-16</p>\n<p>type: entity</p>\n<p>tags: [modulo, contrato, flujo]</p>\n<p>sources: [../../AGENTS.md, ../../docs/SPEC-1.1.md]</p>\n<p>confidence: high</p>\n<p>---</p>\n\n<h2>Application Services</h2>\n\n<p>Capa de orquestación de casos de uso. Traduce intenciones de la capa Telegram en ejecución de servicios.</p>\n\n<li>**Pregunta que responde:** ¿Qué caso de uso es este?</li>\n<li>**Puede:** orquestar Orquestador, Admin, Sandbox, Recontacto, Promo, Calibración.</li>\n<li>**Nunca puede:** contener lógica cognitiva, generar texto, evaluar.</li>\n\n<h3>Servicios</h3>\n\n<li>**Turn Orchestrator** — orquestación del turno completo.</li>\n<li>**AdminService** — superficie de administración (allowlist, estado, modo, pausa, staging, métricas; ver REQ-ADM-*).</li>\n<li>**SandboxService** — modo de prueba con FakeDelivery (Fase 2).</li>\n<li>**RecontactService** — `execute_recontact(vip_id)` con pipeline reducido; nunca ejecuta Analista/Planificador; plantillas fijas; respeta congelación/pausa (AGENTS.md §4.3).</li>\n<li>**PromoService** — `match_trigger(text)` y `execute_promo(chat_id, trigger)`; **sin LLM**, disparo por texto exacto (AGENTS.md §4.4, REQ-PRO-*).</li>\n<li>**CalibrationService** — `calibrate_thresholds(window_days=30)` y `detect_drift()`; solo como job programado, nunca en el pipeline (AGENTS.md §4.5).</li>\n\n<h3>Reglas de dependencia</h3>\n\n<li>Application Services → Learning (solo post-turno).</li>\n<li>Application Services → Jobs (programación).</li>\n<li>Jobs delegan aquí; nunca ejecutan lógica cognitiva directa.</li>\n\n<h3>Implementación real (2026-08-11, actualizado 2026-08-16)</h3>\n\n<p><code>application/</code> tiene <b>50</b> archivos <code>.py</code> (sin <code>__init__.py</code>). Familias reales:</p>\n\n<li>**Turno:** `turn_coordinator.py` (ciclo de vida del turno, guard de concurrencia; ver [[turn-coordinator]]), `turn_orchestrator.py` (wiring del caso de uso VIP, supervisado + autónomo).</li>\n<li>**Admin/superficie:** `admin_service.py` (cola de aprobación, sin tipos aiogram; `handle_mark_gold` / `handle_reprimand` detrás de `feature_quality_feedback_enabled` — ver [[calidad-feedback]]), `admin_trace_service.py`, `admin_metrics_service.py` (resumen semanal + `export_week_json` como documento), `approval_ui.py`, `persona_admin_service.py`, `persona_catalog_provider.py` (caché en proceso).</li>\n<li>**Memoria (F5):** `memory_extraction_service.py` (post-turno), `memory_backfill_service.py` + `memory_backfill_queue.py` (cola durable), `memory_approval_service.py` (aprobación de sensibles).</li>\n<li>**Evolución de agente (shadow):** `trust_budget_service.py` (Fase 5 shadow), `emotional_signal_detector.py` (heurística v1, shadow-only), `mood_engine.py` (3 ejes, shadow), `turn_classifier.py` (Fase 2 shadow), `profile_synthesis_service.py` + `profile_synthesis_trigger_service.py` + `strong_signal_heuristics.py` (Fase 1 shadow).</li>\n<li>**Proactividad (F3):** `recontact_service.py` (sin LLM/Analista/Planner), `promo_service.py` (trigger exacto, sin LLM), `autonomous_mode_service.py` (gate L2 + notify cerca de umbral), `gray_zone_service.py`.</li>\n<li>**Calibración:** `calibration_service.py` + `calibration_math.py` (math pura,</li>", "wikilinks": ["turn-coordinator", "calidad-feedback", "vinculo-lucien", "eventos-temporales"]}}, {"id": "article:entities/modulos/behavior-engine", "label": "Behavior Engine", "color": "#4f8ef7", "group": "article", "detail": {"name": "Behavior Engine", "type": "article", "typeLabel": "Artículo", "summary": "Módulo de **actuación human-like** — infraestructura pura, **fuera de la cognición** (REQ-COG-13, principio rector nº 3).", "tags": "[modulo, contrato], entities — módulos, entities/modulos", "content": "<p>---</p>\n<p>title: Behavior Engine</p>\n<p>created: 2026-08-11</p>\n<p>updated: 2026-08-16</p>\n<p>type: entity</p>\n<p>tags: [modulo, contrato]</p>\n<p>sources: [../../AGENTS.md, ../../docs/SPEC-1.1.md, ../../docs/REQUERIMIENTOS.md]</p>\n<p>confidence: high</p>\n<p>---</p>\n\n<h2>Behavior Engine</h2>\n\n<p>Módulo de <b>actuación human-like</b> — infraestructura pura, <b>fuera de la cognición</b> (REQ-COG-13, principio rector nº 3).</p>\n\n<li>**Pregunta que responde:** ¿Cómo se actúa el mensaje?</li>\n<li>**Puede:** delay, marcar como leído, typing, enviar, cancelar, FakeDelivery (sandbox), dividir mensajes, quirks humanos.</li>\n<li>**Nunca puede:** generar texto, decidir la acción, invocar Analista/Generador/Evaluador/Decisor.</li>\n\n<h3>Secuencia de entrega</h3>\n\n<p><code>delay configurable → read_business_message → send_chat_action(typing) (duración proporcional) → send_message con business_connection_id</code> (SPEC-1.1 §4.9).</p>\n\n<h3>Extensiones Fase 3 (AGENTS.md §4.2)</h3>\n\n<li>`deliver_with_sequence(texts, ctx)`: secuencias multi-mensaje (promo, recontacto) con delays y typing entre mensajes.</li>\n<li>`ctx.allow_split=True` → divide mensajes largos preservando sentido (puntos, comas, saltos de línea).</li>\n<li>`ctx.allow_human_quirks=True` → con probabilidad baja (≈5%): pausas extra, correcciones tipográficas, divisiones &quot;naturales&quot;.</li>\n<li>`ctx.is_frozen` (congelación por zona gris) debe respetarse: cero I/O hacia el VIP (REQ-NFR-03).</li>\n\n<h3>Reglas</h3>\n\n<li>`allow_split` y `allow_human_quirks` son flags del `DeliveryContext`, no configuraciones globales.</li>\n<li>Los quirks son probabilísticos y no afectan el contenido del mensaje.</li>\n<li>Cancelación: se aborta la asyncio.Task y se marca `cancelled` en `pending_deliveries`.</li>\n<li>FakeDelivery para Sandbox (BR-06: no contamina producción).</li>\n\n<h3>Implementación real (2026-08-11, actualizado 2026-08-16)</h3>\n\n<p><code>behavior/</code> sigue con <b>6</b> archivos (sin altas ni bajas desde el freeze): <code>engine.py</code> (entrega human-like, nunca decide ni llama LLM), <code>ports.py</code> (puertos I/O, sin LLM ni módulos cognitivos), <code>quirks.py</code> (helpers puros de quirks, H3.6), <code>split.py</code> (helpers puros de división de texto, H3.6), <code>timer_manager.py</code> (mapa en proceso de tareas de entrega por chat_id), <code>fake.py</code> (dobles de test).</p>\n\n<p>Cambio post-freeze (2026-08-12, <code>ecd6d79</code>): <code>ports.py</code> exporta <code>ProgressKind</code> (<code>&quot;reading&quot;</code> | <code>&quot;typing&quot;</code>) y <code>DeliveryProgressCallback</code>. <code>BehaviorEngine.deliver(..., on_progress=)</code> notifica esas etapas en best-effort; un fallo del callback no aborta la entrega. La capa Telegram usa esto para el progreso en vivo del borrador (leer → escribiendo → enviado) sin que el engine conozca aiogram. Ver [[telegram-layer]] y [[application-services]].</p>\n\n<div class='prov'>^[src/diana/behavior/*, AGENTS.md §2.1]</div>", "wikilinks": ["telegram-layer", "application-services"]}}, {"id": "article:entities/modulos/cognitive-core", "label": "Cognitive Core", "color": "#4f8ef7", "group": "article", "detail": {"name": "Cognitive Core", "type": "article", "typeLabel": "Artículo", "summary": "Capa que ejecuta el pipeline de decisión (Director → Analista → Planificador → Recuperación → Contexto → Generación → Evaluación → Decisión). Es **puro**: no conoce aiogram, no envía mensajes, no e...", "tags": "[modulo, arquitectura, contrato], entities — módulos, entities/modulos", "content": "<p>---</p>\n<p>title: Cognitive Core</p>\n<p>created: 2026-08-11</p>\n<p>updated: 2026-08-16</p>\n<p>type: entity</p>\n<p>tags: [modulo, arquitectura, contrato]</p>\n<p>sources: [../../AGENTS.md, ../../docs/SPEC-1.1.md, ../../src/diana/cognitive/]</p>\n<p>confidence: high</p>\n<p>---</p>\n\n<h2>Cognitive Core</h2>\n\n<p>Capa que ejecuta el pipeline de decisión (Director → Analista → Planificador → Recuperación → Contexto → Generación → Evaluación → Decisión). Es <b>puro</b>: no conoce aiogram, no envía mensajes, no escribe en Staging, no decide delays.</p>\n\n<li>**Pregunta que responde:** ¿Qué decisión tomar?</li>\n<li>**Nunca puede:** conocer aiogram, enviar mensajes, escribir en Staging, decidir delays.</li>\n\n<h3>Componentes internos</h3>\n\n<li>[[director-cognitivo]] (orquestador determinista)</li>\n<li>Analista (LLM → Comprensión)</li>\n<li>Planificador (determinista → Plan)</li>\n<li>[[capability-registry]] + Retrievers (resolución de capacidades)</li>\n<li>Constructor de Contexto (prompt mínimo dinámico, REQ-NFR-07)</li>\n<li>Generador (LLM, solo redacta)</li>\n<li>Evaluador (LLM → [[perfil-evaluacion-multidimensional]])</li>\n<li>[[decisor]] (reglas sobre vector + modo)</li>\n\n<h3>Reglas de dependencia</h3>\n\n<li>Cognitive Core → Capability Registry → Retrievers → Persistence.</li>\n<li>Cognitive Core → LLM Provider.</li>\n<li>**Prohibido:** que Cognitive Core importe cualquier cosa de `telegram/` o `behavior/`.</li>\n\n<h3>Implementación real (2026-08-16)</h3>\n\n<p><code>cognitive/</code> tiene 31 archivos <code>.py</code> (29 módulos + 2 <code>__init__</code>) y cumple el diseño, con detalles adicionales:</p>\n\n<li>**Director** (`director.py`) — sequencer determinista del path de decisión. Tras el Registry puede inyectar un `KnowledgeAugmenter` de aplicación (`knowledge.ephemeral`, perfil sandbox) **sin** que el Core conozca esas tablas.</li>\n<li>**Decider** (`decider.py`) — matriz F3 pura (ver [[decisor]]). Los hooks de evolución de agente (clasificador, mood, trust, detector, síntesis) viven en `application/` y son **shadow-only**: miden y registran; no cambian esta matriz.</li>\n<li>**Evaluator** (`evaluator.py`) — perfil 7D; **Generator** — solo redacta; **Analyst** — Comprensión.</li>\n<li>**Planner** (`planner.py`) — función pura, sin llamadas al modelo.</li>\n<li>**Registry** (`registry.py`) — resolución nombre → Retriever (Anexo H.1).</li>\n<li>**Thresholds** (`thresholds.py`) — defaults duales F3 (SPEC-FASE3 §4.2); `runtime_thresholds.py` — umbrales mutables en runtime para lecturas del Decider tras la calibración (ver [[calibracion-de-umbrales]]).</li>\n<li>**ContextBuilder** (`context_builder.py`) — emite bloques en orden fijo (D.4) y omite valores nulos. Cerca user-controllable (profile / memory / policy / examples / ephemeral) con fences SEC-INJ para que el LLM no los trate como instrucciones.</li>\n<li>**Retrievers reales:** `history` (mensajes recientes del chat), `context` (REAL parcial: estado conversacional derivado del historial; **no** lee la tabla `contexts`), `memory` (VIP-scoped, BR-15), `policy` (estáticas por tema + DB con `scope` y `vip_id`), `profile` (por PK; no fetch si `vip_id` es None), `examples` (nunca lee memoria VIP; gold-first + visibilidad `vip_id`; anexa 1 contraejemplo), `schedule` (agenda semanal fija), `pers</li>", "wikilinks": ["director-cognitivo", "capability-registry", "perfil-evaluacion-multidimensional", "decisor", "decisor", "calibracion-de-umbrales", "anti-contaminacion", "zona-gris-y-politicas"]}}, {"id": "article:entities/modulos/infrastructure-persistence", "label": "Infrastructure / Persistence", "color": "#4f8ef7", "group": "article", "detail": {"name": "Infrastructure / Persistence", "type": "article", "typeLabel": "Artículo", "summary": "Capa de persistencia e infraestructura. **PostgreSQL es el único almacén durable** (ADR-003) — sin Redis en V1.", "tags": "[modulo, contrato], entities — módulos, entities/modulos", "content": "<p>---</p>\n<p>title: Infrastructure / Persistence</p>\n<p>created: 2026-08-11</p>\n<p>updated: 2026-08-16</p>\n<p>type: entity</p>\n<p>tags: [modulo, contrato]</p>\n<p>sources: [../../AGENTS.md, ../../src/diana/infrastructure/db/models.py, ../../alembic/versions/029_feedback_quality.py]</p>\n<p>confidence: high</p>\n<p>---</p>\n\n<h2>Infrastructure / Persistence</h2>\n\n<p>Capa de persistencia e infraestructura. <b>PostgreSQL es el único almacén durable</b> (ADR-003) — sin Redis en V1.</p>\n\n<li>**Pregunta que responde:** ¿Cómo guardo y recupero datos?</li>\n<li>**Puede:** repositorios, sesiones, migraciones (Alembic).</li>\n<li>**Nunca puede:** contener lógica de negocio o cognitiva.</li>\n\n<h3>Tecnología</h3>\n\n<li>SQLAlchemy 2.0 (async) + asyncpg; Pydantic v2 para validación de objetos cognitivos.</li>\n<li>pgvector con índices HNSW para embeddings (Fase 2+).</li>\n<li>34 tablas en `Base.metadata`. Head de repo: **`029_feedback_quality`** (cadena 001–029 en `alembic/versions/`). Tablas por fase: [[esquema-fase1]], [[esquema-conocimiento]], [[esquema-fase3]], [[esquema-fase4]], [[esquema-evolucion]], [[esquema-fase6]].</li>\n\n<h3>Reglas</h3>\n\n<li>Secretos (tokens, API keys) nunca en código versionado (REQ-PER-04) — viven en `.env`.</li>\n<li>Los objetos intermedios del pipeline se persisten con TTL configurable (REQ-COG-11, REQ-PER-06).</li>\n<li>La capa no conoce el pipeline; los repositorios exponen operaciones de datos.</li>\n\n<h3>Implementación real (2026-08-16)</h3>\n\n<p><code>infrastructure/</code> agrupa <code>db/models.py</code> (ORM F1–F5 + evo + <code>ephemeral_events</code>), <code>db/session.py</code>, 35 repositorios en <code>db/repositories/</code>, y <code>telethon/vip_history_fetcher.py</code>.</p>\n\n<p>Repositorios: evo-agente (<code>vip_profile</code>, <code>vip_profile_history</code>, <code>vip_trust_budget</code>, <code>vip_mood_state</code>, <code>turn_category</code>, <code>emotional_signal</code>), memoria F5 (<code>backfill_queue</code>, <code>memories</code>), F4 (<code>atencion_cycles</code>, <code>daily_message_limits</code>), F3 (<code>promo_triggers</code>, <code>promo_executions</code>, <code>recontact_schedules</code>, <code>runtime_timers</code>), F6 (<code>link_events</code>), eventos temporales (<code>ephemeral_events</code>), más <code>traces</code>, <code>turns</code>, <code>deliveries</code>, <code>approvals</code>, <code>staging</code>, <code>gray_zone</code>, <code>system_config</code>, <code>persona_versions</code>, <code>owner_marks</code>, <code>calibration_data</code>, <code>metrics_data</code>, <code>learning_metrics</code>, <code>examples</code>, <code>policies</code>, <code>profiles</code>, <code>history</code>, <code>vips</code>, <code>escalations</code>, <code>business_connections</code>.</p>\n\n<p><code>LinkEvent</code> no vive en <code>models.py</code>: ORM inline en <code>db/repositories/link_events.py</code> (se registra al importar el paquete). <code>examples.quality</code> / <code>examples.vip_id</code> / <code>policies.vip_id</code> están en <code>models.py</code> (029).</p>\n\n<p>Apply en producción de 027–029: <b>no verificado</b> (último snapshot: [[estado-del-proyecto]] 2026-08-11, head prod 026).</p>\n\n<div class='prov'>^[src/diana/infrastructure/*, alembic/versions/027-029]</div>", "wikilinks": ["esquema-fase1", "esquema-conocimiento", "esquema-fase3", "esquema-fase4", "esquema-evolucion", "esquema-fase6", "estado-del-proyecto"]}}, {"id": "article:entities/modulos/jobs", "label": "Jobs", "color": "#4f8ef7", "group": "article", "detail": {"name": "Jobs", "type": "article", "typeLabel": "Artículo", "summary": "Tareas periódicas programadas del sistema.", "tags": "[modulo, contrato], entities — módulos, entities/modulos, operacion", "content": "<p>---</p>\n<p>title: Jobs</p>\n<p>created: 2026-08-11</p>\n<p>updated: 2026-08-16</p>\n<p>type: entity</p>\n<p>tags: [modulo, operacion, contrato]</p>\n<p>sources: [../../AGENTS.md, ../../docs/SPEC-1.1.md]</p>\n<p>confidence: high</p>\n<p>---</p>\n\n<h2>Jobs</h2>\n\n<p>Tareas periódicas programadas del sistema.</p>\n\n<li>**Pregunta que responde:** ¿Qué tareas periódicas ejecutar?</li>\n<li>**Puede:** recontacto, purga de trazas, calibración.</li>\n<li>**Nunca puede:** ejecutar lógica cognitiva o de decisión directamente — debe delegar en Application Services.</li>\n\n<h3>Jobs conocidos</h3>\n\n<li>**Recontacto por silencio** (ej. cada hora): `RecontactService.get_due_vips()` + `execute_recontact` (flujo 4.9 de AGENTS.md; ver [[application-services]]).</li>\n<li>**Calibración de umbrales** (ej. domingo 3 AM): `CalibrationService.calibrate_thresholds(window_days=30)` + `detect_drift()` (flujo 4.11).</li>\n<li>**Purga de trazas:** TTL de objetos intermedios (30 días recomendado en Fase 1, configurable).</li>\n\n<h3>Invariantes</h3>\n\n<li>No se programa recontacto si el VIP está congelado, en pausa o con aprobación pendiente (AGENTS.md §4.9).</li>\n<li>La calibración nunca corre dentro del pipeline (AGENTS.md §4.5).</li>\n<li>Jobs → Application Services (dirección de dependencia obligatoria).</li>\n\n<h3>Implementación real (2026-08-11, verificado 2026-08-16)</h3>\n\n<p><code>jobs/</code> sigue con <b>8</b> jobs (0 archivos nuevos o borrados desde 2026-08-11). Todos envuelven servicios de [[application-services]] (nunca lógica cognitiva directa):</p>\n\n<li>`recontact.py` — loop periódico de recontacto por silencio.</li>\n<li>`calibration.py` — calibración dual de umbrales + drift.</li>\n<li>`backfill.py` — scheduler de la cola de backfill de perfiles VIP.</li>\n<li>`profile_synthesis_job.py` — escaneo + drenaje + síntesis de perfiles.</li>\n<li>`gray_zone_expiration.py` — expiración de consultas de doctrina obsoletas.</li>\n<li>`metrics.py` — agregación semanal de learning_metrics.</li>\n<li>`trace_purge.py` — purga TTL de pipeline_traces.</li>\n<li>`agent_data_purge.py` — purga TTL de tablas de evolución de agente.</li>\n\n<p>No hay job de [[vinculo-lucien]] ni de [[eventos-temporales]]: el vínculo es middleware + <code>LinkCoordinator</code>; los eventos expiran por ventana <code>[start_at, end_at)</code> en el augmenter.</p>\n\n<div class='prov'>^[src/diana/jobs/*, AGENTS.md §2.1]</div>", "wikilinks": ["application-services", "application-services", "vinculo-lucien", "eventos-temporales"]}}, {"id": "article:entities/modulos/learning", "label": "Learning", "color": "#4f8ef7", "group": "article", "detail": {"name": "Learning", "type": "article", "typeLabel": "Artículo", "summary": "Módulo de aprendizaje, **siempre post-turno y controlado** (ver [[aprendizaje-post-turno]]).", "tags": "[modulo, aprendizaje, contrato], entities — módulos, entities/modulos", "content": "<p>---</p>\n<p>title: Learning</p>\n<p>created: 2026-08-11</p>\n<p>updated: 2026-08-16</p>\n<p>type: entity</p>\n<p>tags: [modulo, aprendizaje, contrato]</p>\n<p>sources: [../../AGENTS.md, ../../docs/SPEC-1.1.md, ../../src/diana/application/staging_service.py]</p>\n<p>confidence: high</p>\n<p>---</p>\n\n<h2>Learning</h2>\n\n<p>Módulo de aprendizaje, <b>siempre post-turno y controlado</b> (ver [[aprendizaje-post-turno]]).</p>\n\n<li>**Pregunta que responde:** ¿Qué aprendimos de este turno?</li>\n<li>**Puede:** extraer candidatos, escribir en Staging, destilar políticas, actualizar métricas, calibrar umbrales.</li>\n<li>**Nunca puede:** ejecutarse durante el pipeline de decisión, promover automáticamente a banco vivo.</li>\n\n<h3>Subcomponentes (SPEC-1.1 §11 — diseño)</h3>\n\n<p>El diseño nombra extractor, staging, destiller y métricas. En el repo el grueso vive fuera de <code>learning/</code>:</p>\n\n<li>`cognitive/policy_distiller.py` — destilación de doctrina de zona gris a política estructurada.</li>\n<li>`application/staging_service.py` — Staging Area y promoción (Fase 2+).</li>\n<li>`application/memory_extraction_service.py` — extracción de hechos (Fase 5).</li>\n<li>`application/calibration_service.py` + jobs — métricas y calibración (Fase 3).</li>\n\n<h3>APIs de promoción (2026-08-16)</h3>\n\n<p><code>StagingService</code> exige confirmación de la dueña. No hay auto-promoción.</p>\n\n<div class='tbl'>| API | Qué escribe | Staging previo |</div>\n<div class='tbl'>|---|---|---|</div>\n<div class='tbl'>| `promote_to_example` | few-shot global `quality=standard` | sí (candidato `example` pending) |</div>\n<div class='tbl'>| `promote_to_counter_example(vip_id=…)` | contraejemplo, global o de ese VIP | sí |</div>\n<div class='tbl'>| `insert_gold_example(..., quality=gold, vip_id=…)` | gold (Destacar); alcance global o VIP | no — la dueña ya confirmó con Destacar |</div>\n<div class='tbl'>| `promote_to_policy(..., vip_id=…)` | política activa, global o de ese VIP | sí |</div>\n\n<p><code>AtencionPromoteBlocked</code>: un candidato del canal <code>atencion</code> no entra al banco VIP (REQ-ATN-13, ver [[anti-contaminacion]]). Escrituras Destacar/Reprender van detrás de <code>FEATURE_QUALITY_FEEDBACK_ENABLED</code>; el retrieval de examples <b>siempre</b> usa <code>quality</code> y <code>vip_id</code>.</p>\n\n<h3>Límites duros</h3>\n\n<li>**Prohibido** que Learning sea llamado desde dentro del Director o del pipeline de decisión (AGENTS.md §2.2).</li>\n<li>La calibración de umbrales solo se ejecuta como job programado, nunca dentro del pipeline (AGENTS.md §4.5, ver [[feature-flags]]).</li>\n\n<h3>Implementación real (2026-08)</h3>\n\n<p><code>learning/</code> tiene 1 archivo real: <code>post_turn.py</code> — &quot;Post-turn learning for F1: TRACE_KEYS completeness check only (no Staging)&quot;. El staging se opera desde la capa de aplicación, respetando la regla post-turno.</p>\n\n<div class='prov'>^[src/diana/learning/*, src/diana/application/staging_service.py, AGENTS.md §2.1]</div>", "wikilinks": ["aprendizaje-post-turno", "anti-contaminacion", "feature-flags"]}}, {"id": "article:entities/modulos/llm-provider", "label": "LLM Provider", "color": "#4f8ef7", "group": "article", "detail": {"name": "LLM Provider", "type": "article", "typeLabel": "Artículo", "summary": "Abstracción de proveedores de modelo de lenguaje (ADR-006). Interfaz abstracta con **hot-swap** (REQ-ADM-03): cambiar proveedor/modelo en caliente sin tocar el resto del sistema.", "tags": "[modulo, decision], entities — módulos, entities/modulos", "content": "<p>---</p>\n<p>title: LLM Provider</p>\n<p>created: 2026-08-11</p>\n<p>updated: 2026-08-16</p>\n<p>type: entity</p>\n<p>tags: [modulo, decision]</p>\n<p>sources: [../../AGENTS.md, ../../docs/SPEC-1.1.md]</p>\n<p>confidence: high</p>\n<p>---</p>\n\n<h2>LLM Provider</h2>\n\n<p>Abstracción de proveedores de modelo de lenguaje (ADR-006). Interfaz abstracta con <b>hot-swap</b> (REQ-ADM-03): cambiar proveedor/modelo en caliente sin tocar el resto del sistema.</p>\n\n<li>**Pregunta que responde:** ¿Cómo hablo con el modelo?</li>\n<li>**Puede:** `generate` y `generate_structured`.</li>\n<li>**Nunca puede:** contener prompts de negocio, decidir umbrales, conocer VIP.</li>\n\n<h3>Proveedores</h3>\n\n<li>**Primario:** DeepSeek (LLM principal del sistema).</li>\n<li>**Secundario:** Anthropic (Claude) — respaldo de diseño, **no implementado**.</li>\n\n<h3>Reglas</h3>\n\n<li>El Cognitive Core depende de la interfaz, no del proveedor concreto.</li>\n<li>Los prompts de negocio viven en el Constructor de Contexto ([[pipeline-cognitivo]]), no en el provider.</li>\n<li>Generación estructurada (Pydantic v2) para objetos como la Comprensión y el [[perfil-evaluacion-multidimensional]].</li>\n\n<h3>Implementación real (2026-08-11, actualizado 2026-08-16)</h3>\n\n<p><code>llm/</code> sigue con <b>2</b> archivos: <code>deepseek.py</code> (cliente OpenAI-compatible vía httpx, solo I/O) y <code>fake.py</code> (FakeLLM scriptable para tests). <b>Solo DeepSeek está implementado</b> — no hay cliente Anthropic en el árbol. Sin commits en <code>llm/</code> desde 2026-08-11.</p>\n\n<p>Toggle de thinking (landed 2026-08-09, omitido en el inventario del 11): <code>DeepSeekProvider(thinking_enabled=...)</code> cableado a <code>settings.llm_thinking_enabled</code> (default <code>True</code>).</p>\n\n<li>`generate` (borradores de texto libre): envía `&quot;thinking&quot;: {&quot;type&quot;: &quot;enabled&quot;|&quot;disabled&quot;}`. Con thinking on, timeout mínimo 120 s y `max_tokens` default 4096 (si no, 1024). Nunca usa `reasoning_content` como draft.</li>\n<li>`generate_structured` (Analista / Evaluador y demás JSON): **siempre** `&quot;thinking&quot;: {&quot;type&quot;: &quot;disabled&quot;}`, independiente del flag — el CoT puede agotar tokens y dejar `content` vacío.</li>\n\n<div class='prov'>^[src/diana/llm/*, src/diana/config/settings.py, docs/SPEC-1.1.md §1]</div>", "wikilinks": ["pipeline-cognitivo", "perfil-evaluacion-multidimensional"]}}, {"id": "article:entities/modulos/telegram-layer", "label": "Telegram Layer", "color": "#4f8ef7", "group": "article", "detail": {"name": "Telegram Layer", "type": "article", "typeLabel": "Artículo", "summary": "Capa de adaptación con Telegram (aiogram 3.x, Business Connection). Es la puerta de entrada y salida del sistema.", "tags": "[modulo, contrato], entities — módulos, entities/modulos", "content": "<p>---</p>\n<p>title: Telegram Layer</p>\n<p>created: 2026-08-11</p>\n<p>updated: 2026-08-16</p>\n<p>type: entity</p>\n<p>tags: [modulo, contrato]</p>\n<p>sources: [../../AGENTS.md, ../../docs/SPEC-1.1.md]</p>\n<p>confidence: high</p>\n<p>---</p>\n\n<h2>Telegram Layer</h2>\n\n<p>Capa de adaptación con Telegram (aiogram 3.x, Business Connection). Es la puerta de entrada y salida del sistema.</p>\n\n<li>**Pregunta que responde:** ¿Cómo entro y salgo de Telegram?</li>\n<li>**Puede:** recibir updates, enviar mensajes, middlewares de short-circuit.</li>\n<li>**Nunca puede:** decidir qué decir, invocar LLM, escribir en tablas de conocimiento.</li>\n\n<h3>Middlewares (SPEC-1.1 §2)</h3>\n\n<p>Contrato de producto (SPEC):</p>\n\n<li>**Auth:** ¿está en allowlist? (REQ-AUTH-01)</li>\n<li>**ForbiddenWords:** cortocircuito de escalación por palabras/temas prohibidos (Fase 1, ver [[escalacion]])</li>\n<li>**FreezeCheck:** ¿está congelado por zona gris? (Fase 2, ver [[zona-gris-y-politicas]])</li>\n\n<p>Orden real de registro (<code>F2_MIDDLEWARE_ORDER</code> en <code>telegram/middlewares/__init__.py</code>; el primero es el más externo):</p>\n\n<p><code>ErrorHandler → Dedup → RateLimit → Logging → BusinessConnection → LinkCoordinator → Owner → FreezeCheck → Auth → Forbidden</code></p>\n\n<p>Auth va antes de Forbidden para que un no-VIP no dispare escalación J.4. <code>FreezeCheckMiddleware</code> vive en <code>telegram/freeze_middleware.py</code> (raíz del paquete, no en <code>middlewares/</code>). En <code>callback_query</code> se omite Freeze (no-op). El update <code>business_connection</code> solo lleva ErrorHandler + Logging.</p>\n\n<h3>Estructura prevista (SPEC-1.1 §11)</h3>\n\n<p><code>telegram/handlers/</code> (business.py, admin.py, callbacks.py), <code>telegram/middlewares/</code> (auth, forbidden, freeze), <code>telegram/keyboards.py</code>.</p>\n\n<h3>Reglas de dependencia</h3>\n\n<li>Telegram Layer → Turn Coordinator (nunca directo al Cognitive Core).</li>\n<li>El mensaje saliente al VIP se envía en nombre de la dueña vía la conexión de negocio (REQ-AUTH-04, REQ-NFR-09) — nunca como un bot con otro nombre.</li>\n\n<h3>Implementación real (2026-08-11, actualizado 2026-08-16)</h3>\n\n<p><code>telegram/</code> tiene <b>26</b> archivos <code>.py</code> (sin <code>__init__.py</code>). El directorio <code>telegram/menu/</code> no tiene fuentes; el menú está en <code>handlers/menu.py</code>.</p>\n\n<li>**Handlers (10):** `business.py` (mensajes VIP; cancela combo de calidad al inbound), `admin.py`, `menu.py` (panel de dueña + wizard de [[eventos-temporales]]), `callbacks.py` (keyboards de borradores + Destacar/Reprender), `doctrine.py` (zona gris `g:`), `staging.py`, `memory_approval.py` (aprobación de hechos sensibles F5), `persona_admin.py`, `business_connection.py`, `link.py` (callbacks `link:&lt;action&gt;:&lt;event_id&gt;` de [[vinculo-lucien]]).</li>\n<li>**Middlewares (9 en `middlewares/` + Freeze en raíz):** `auth.py`, `forbidden.py`, `owner.py`, `rate_limit.py`, `dedup.py`, `business_connection.py`, `error_handler.py`, `logging.py`, `link.py` (`LinkCoordinatorMiddleware`: consume `[LINK]` del chat Lucien, no llega al orquestador). Freeze: `freeze_middleware.py`.</li>\n<li>**Otros:** `actuator.py` (adaptador aiogram del puerto de actuación), `notifier.py` (DMs a la dueña: draft/escalate/doctrine/info + `notify_link` + `edit_draft`/`void_draft`), `keyboards.py` (callback_data ≤ 64 bytes; fila</li>", "wikilinks": ["escalacion", "zona-gris-y-politicas", "eventos-temporales", "vinculo-lucien", "calidad-feedback", "vinculo-lucien", "eventos-temporales"]}}, {"id": "article:entities/modulos/turn-coordinator", "label": "Turn Coordinator", "color": "#4f8ef7", "group": "article", "detail": {"name": "Turn Coordinator", "type": "article", "typeLabel": "Artículo", "summary": "Módulo de la capa Application que **serializa por chat_id** y garantiza que solo exista **un turno no terminal** por chat (REQ-NFR-02, REQ-VIP-06). Principio rector nº 7: \"El Turn Coordinator garan...", "tags": "[modulo, contrato, entities — módulos, entities/modulos, flujo]", "content": "<p>---</p>\n<p>title: Turn Coordinator</p>\n<p>created: 2026-08-11</p>\n<p>updated: 2026-08-16</p>\n<p>type: entity</p>\n<p>tags: [modulo, contrato, flujo]</p>\n<p>sources: [../../AGENTS.md, ../../docs/SPEC-1.1.md]</p>\n<p>confidence: high</p>\n<p>---</p>\n\n<h2>Turn Coordinator</h2>\n\n<p>Módulo de la capa Application que <b>serializa por chat_id</b> y garantiza que solo exista <b>un turno no terminal</b> por chat (REQ-NFR-02, REQ-VIP-06). Principio rector nº 7: &quot;El Turn Coordinator garantiza la serialización por chat&quot;.</p>\n\n<li>**Pregunta que responde:** ¿Qué turno está vivo?</li>\n<li>**Puede:** serializar por chat, gestionar la máquina de estados del Turn, cancelar entregas obsoletas.</li>\n<li>**Nunca puede:** decidir qué decir, invocar LLM, tocar memoria persistente (banco de conocimiento VIP).</li>\n\n<h3>Máquina de estados del Turn</h3>\n\n<p>Estados en <code>TurnStatus</code> (<code>cognitive/models.py</code>):</p>\n\n<pre>\n[received] → [waiting_delay] → [analyzing] → [planning] → [retrieving]\n           → [building_context] → [generating] → [evaluating] → [deciding]\n           → [pending_approval] → (aprueba) → [delivered] (TERMINAL)\n                               → (descarta/escala) → [escalated] (TERMINAL)\n                               → (nuevo msg del VIP) → [superseded] (TERMINAL)\n[received] → (cortocircuito) → [escalated] (TERMINAL)\n[gray_zone] (consulta de doctrina)\n[promo_pending] (secuencia no-VIP en vuelo)\n[failed] (TERMINAL)\n</pre>\n\n<p><b>Invariante crítica:</b> solo un Turn no terminal (fuera de <code>superseded|delivered|failed|escalated</code>) por chat_id. Terminales = ese cuarteto (<code>TERMINAL_TURN_STATUSES</code>).</p>\n\n<h3>Implementación real (verificado 2026-08-16)</h3>\n\n<p><code>turn_coordinator.py</code> <b>no cambió</b> desde 2026-08-11. La serialización es <code>ChatLockProvider</code>: un <code>asyncio.Lock</code> por <code>chat_id</code> <b>en el proceso</b> (<code>lock_acquire_timeout_s=5</code>, 2 reintentos). Timeouts levantan <code>ChatLockTimeoutError</code> (G.5 F1: fail loud, sin cola durable).</p>\n\n<p><code>SELECT … FOR UPDATE</code> / advisory lock multi-proceso <b>no está implementado</b> — queda residual documentado en el propio módulo y en <code>docs/OPS_SINGLE_INSTANCE.md</code>. No es una decisión abierta.</p>\n\n<p>También mantiene épocas VIP por chat (mensaje nuevo aborta trabajo en vuelo), cancela entregas vía <code>BehaviorCanceller</code>, y opcionalmente invalida la UI de aprobación / reagenda recontacto.</p>\n\n<h3>Reglas de dependencia</h3>\n\n<li>Recibe de la capa Telegram (middlewares) y orquesta hacia [[pipeline-cognitivo]].</li>\n<li>Vive en [[application-services]]; prohibido **by-passear** el Turn Coordinator (AGENTS.md §2.2).</li>\n\n<div class='prov'>^[src/diana/application/turn_coordinator.py, docs/SPEC-1.1.md §3, AGENTS.md §2.1]</div>", "wikilinks": ["pipeline-cognitivo", "application-services"]}}, {"id": "article:entities/specs/agents-md", "label": "AGENTS.md", "color": "#4f8ef7", "group": "article", "detail": {"name": "AGENTS.md", "type": "article", "typeLabel": "Artículo", "summary": "Documento de operación para agentes de desarrollo (v1.3 — Fase 3 Producto Completo). Define **límites duros de módulo y flujos canónicos que ningún agente (humano o IA) puede violar** al modificar ...", "tags": "[spec, contrato, entities — specs, entities/specs, operacion]", "content": "<p>---</p>\n<p>title: AGENTS.md</p>\n<p>created: 2026-08-11</p>\n<p>updated: 2026-08-21</p>\n<p>type: entity</p>\n<p>tags: [spec, contrato, operacion]</p>\n<p>sources: [../../AGENTS.md]</p>\n<p>confidence: high</p>\n<p>---</p>\n\n<h2>AGENTS.md</h2>\n\n<p>Documento de operación para agentes de desarrollo (v1.3 — Fase 3 Producto Completo). Define <b>límites duros de módulo y flujos canónicos que ningún agente (humano o IA) puede violar</b> al modificar el código.</p>\n\n<h3>Contenido clave</h3>\n\n<li>**§0 Comunicación con el usuario:** reglas de [[comunicacion-con-producto]] y español neutro obligatorio.</li>\n<li>**§1 Propósito y principios rectores:** los 7 innegociables (Director determinista, una pregunta por componente, Behavior fuera de la cognición, aprendizaje post-turno, anti-contaminación, decisión reconstruible, Turn Coordinator serializa).</li>\n<li>**§2 Mapa de módulos y límites duros:** capas, preguntas, qué puede/nunca puede hacer cada módulo; reglas de dependencia unidireccionales y prohibiciones explícitas.</li>\n<li>**§3 Flujos canónicos por fase:** 4.1-4.12 (turno normal, cortocircuito, cancelación, memoria, zona gris, staging, sandbox, autónomo, recontacto, promo, calibración, behavior avanzado).</li>\n<li>**§4 Contratos críticos:** orden de prioridades del [[decisor]], BehaviorEngine, RecontactService, PromoService, CalibrationService.</li>\n<li>**§5 Reglas operativas por feature** y §6 checklist de revisión para PRs.</li>\n<li>**§7 Prohibiciones explícitas** con su razón; §8 cómo evolucionar el documento; §9 relación con los otros docs.</li>\n\n<h3>Decisor (orden de prioridades alineado 2026-08-21)</h3>\n\n<p>El orden exacto que evalúa el [[decisor]] (coincide con <code>src/diana/cognitive/decider.py</code>):</p>\n\n<div class='tbl'>| Prioridad | Condición | Acción |</div>\n<div class='tbl'>|---|---|---|</div>\n<div class='tbl'>| 1 | `perfil.seguridad` &lt; umbral | Escalar |</div>\n<div class='tbl'>| 2 | `needs_policy` Y retrieval vacío Y `FEATURE_GRAY_ZONE_ENABLED` | Consultar doctrina |</div>\n<div class='tbl'>| 3 | `risk == &quot;alto&quot;` | Escalar (risk_high) |</div>\n<div class='tbl'>| 4 | `emotion == &quot;molesta&quot;` | Escalar (frustracion_directa) |</div>\n<div class='tbl'>| 5 | (pre-Decisor) `naturalidad` &lt; umbral → Director re-genera 1× | no-op del Decisor |</div>\n<div class='tbl'>| 6 | Modo autónomo activo Y umbrales superados | Enviar |</div>\n<div class='tbl'>| 7 | Ninguna de las anteriores | Aprobar |</div>\n\n<p>Cambio notable (2026-08-21): <b><code>risk_high</code> (prioridad 3) se evalúa antes que <code>frustracion_directa</code> (prioridad 4)</b>. Si ambas aplican, la acción es Escalar y el <code>reason</code> queda <code>risk_high</code> (la severidad semántica gana; visible en <code>/traza</code>). <code>molesta</code> sola escala sin esperar acumulación de risk.</p>\n\n<h3>Tabla de docs (relación §9)</h3>\n\n<p>La sección §9 etiqueta cada SPEC como diseño de fase y añade las piezas recientes:</p>\n\n<div class='tbl'>| Documento | Qué define |</div>\n<div class='tbl'>|---|---|</div>\n<div class='tbl'>| SPEC-1.1.md v1.5 | Diseño de Fase 1 (MVP supervisado) |</div>\n<div class='tbl'>| SPEC-FASE2.md | Diseño de Fase 2 (MVP+) |</div>\n<div class='tbl'>| SPEC-FASE3.md | Diseño de Fase 3 (Producto Completo) |</div>\n<div class='tbl'>| SPEC-FASE4.md | Atención general (canal no-VIP) |</div>\n<div class='tbl'>| SPEC-FASE5.md | Perfil de memoria por VIP |</div>\n<div class='tbl'>| SPEC-FASE6.md | Vínculo Lucien→Diana (migración real 028) |</div>\n<div class='tbl'>| SPEC-FEEDBACK.md | Destacar/Reprender y bancos gold/vip (migración real 029) |</div>\n<div class='tbl'>| ARCHITECTURE.md | Arquitectura consolidada del sistema actual (entrada técnica ú</div>", "wikilinks": ["comunicacion-con-producto", "decisor", "decisor"]}}, {"id": "article:entities/specs/changelog", "label": "Changelog", "color": "#4f8ef7", "group": "article", "detail": {"name": "Changelog", "type": "article", "typeLabel": "Artículo", "summary": "Historial de cambios del sistema (CHANGELOG.md). **Al día: 2026-08-20** (última entrada \"Cognitive greeting and delivery polish\").", "tags": "[estado, entities — specs, entities/specs, operacion]", "content": "<p>---</p>\n<p>title: Changelog</p>\n<p>created: 2026-08-11</p>\n<p>updated: 2026-08-21</p>\n<p>type: entity</p>\n<p>tags: [estado, operacion]</p>\n<p>sources: [../../CHANGELOG.md]</p>\n<p>confidence: high</p>\n<p>---</p>\n\n<h2>Changelog</h2>\n\n<p>Historial de cambios del sistema (CHANGELOG.md). <b>Al día: 2026-08-20</b> (última entrada &quot;Cognitive greeting and delivery polish&quot;).</p>\n\n<h3>Saludo cognitivo y pulido de entrega — 2026-08-20</h3>\n\n<li>Entrega en **burbujas por párrafo**: los borradores se dividen por bloques de línea en blanco antes del corte por caracteres; las respuestas multi-párrafo llegan como mensajes separados naturales.</li>\n<li>**Progreso de envío**: entregas multi-segmento muestran a la dueña un indicador &quot;enviando X/Y&quot; en vivo.</li>\n<li>**Quirks de entrega ponderados**: la selección de quirks favorece el error de tipeo + autocorrección y la tasa general sube a 20 %.</li>\n<li>Fix: arranque sin hang en la cola de backfill de memoria — el chequeo de historial usa un `count()` barato en vez de recorrer todo el historial por páginas.</li>\n\n<h3>Control de la dueña, vínculo Lucien y calidad — 2026-08-16</h3>\n\n<li>[[calidad-feedback]]: Destacar/Reprender en borradores VIP; banco gold-first.</li>\n<li>[[vinculo-lucien]]: aviso de expulsión Lucien→Diana.</li>\n<li>[[eventos-temporales]]: contexto con fecha, sin flag.</li>\n<li>Menú unificado, progreso en vivo al aprobar, paracaídas si falla el aviso de doctrina.</li>\n<li>Ops: repo en migración 029; producción verificada hasta 026.</li>\n\n<h3>Evolución de agente (shadow) — 2026-08-07</h3>\n\n<li>Motor de observación completo en modo shadow: señales emocionales, auto-clasificación por turno, mood 3 ejes, trust por VIP (ver [[detector-emocional]], [[perfil-evolutivo]], [[trust-budget]]).</li>\n<li>Eventos de corrección estructurados; purga automática TTL (housekeeping).</li>\n<li>El clasificador pondera contenido sensible/personal primero.</li>\n\n<h3>Funcionalidades acumuladas</h3>\n\n<li>**Memoria automática** y **perfiles VIP** desde el historial ([[memoria-vip]]).</li>\n<li>**Canal de atención** no-VIP con escalación real ([[canal-atencion]]).</li>\n<li>Freeze/pausa de VIP, menú rediseñado, registro de VIP por reenvío.</li>\n<li>Staging con aprobación de la dueña ([[aprendizaje-post-turno]]).</li>\n<li>Dashboard de la dueña (`/resumen`, `/metricas`), trazabilidad paso a paso.</li>\n<li>Ciclo de atención de 30 días + seguimiento proactivo no-VIP.</li>\n<li>Seguimiento autónomo post-respuesta, manejo de mensajes editados, recuperación resiliente tras reinicio, sandbox.</li>\n\n<h3>Mejoras y seguridad</h3>\n\n<li>Historial rápido en conversaciones largas; entrega human-like por modo.</li>\n<li>Español neutro consistente, sin dialecto ni slang (ver [[comunicacion-con-producto]]).</li>\n<li>Seguridad: los errores de memoria no exponen contenido crudo; sanitización de prompts; gates owner-only; canal de atención fail-closed.</li>\n\n<h3>Cambio rompedor</h3>\n\n<p>El canal de atención solo admite chats que recibieron la promo y permanece abierto 30 días (el pago lo cierra).</p>\n\n<div class='prov'>^[CHANGELOG.md]</div>", "wikilinks": ["calidad-feedback", "vinculo-lucien", "eventos-temporales", "detector-emocional", "perfil-evolutivo", "trust-budget", "memoria-vip", "canal-atencion", "aprendizaje-post-turno", "comunicacion-con-producto"]}}, {"id": "article:entities/specs/estado-del-proyecto", "label": "Estado del Proyecto", "color": "#4f8ef7", "group": "article", "detail": {"name": "Estado del Proyecto", "type": "article", "typeLabel": "Artículo", "summary": "Síntesis del 2026-08-21. Fuente canónica: `docs/ESTADO-PROYECTO.md`. Head `b592192`. El snapshot de producción (PID, filas de memoria) **no se re-midió el 21**; lo verificado en código es el repo e...", "tags": "[estado, entities — specs, entities/specs, operacion, riesgo]", "content": "<p>---</p>\n<p>title: Estado del Proyecto</p>\n<p>created: 2026-08-11</p>\n<p>updated: 2026-08-21</p>\n<p>type: summary</p>\n<p>tags: [estado, operacion, riesgo]</p>\n<p>sources: [../../docs/ESTADO-PROYECTO.md]</p>\n<p>confidence: high</p>\n<p>---</p>\n\n<h2>Estado del Proyecto</h2>\n\n<p>Síntesis del 2026-08-21. Fuente canónica: <code>docs/ESTADO-PROYECTO.md</code>. Head <code>b592192</code>. El snapshot de producción (PID, filas de memoria) <b>no se re-midió el 21</b>; lo verificado en código es el repo en <code>b592192</code> y el <code>.env</code> (valores de flags).</p>\n\n<h3>Qué está en código y activo</h3>\n\n<li>**Fase 6 — Vínculo Lucien** ✅ **ACTIVO** (`FEATURE_LINK_ENABLED=true`), desplegada y verificada E2E (bot-to-bot DM). Ver [[vinculo-lucien]], [[spec-fase6]].</li>\n<li>**Destacar / Reprender** ✅ **ACTIVO** (`FEATURE_QUALITY_FEEDBACK_ENABLED=true`). Retrieval gold-first siempre activo. Ver [[calidad-feedback]], [[spec-feedback]].</li>\n<li>**Fase 4 — Atención general** ✅ activa (`FEATURE_GENERAL_MODE_ENABLED=true`): ciclo 30 días, pago cierra, límite 20/día. Ver [[canal-atencion]].</li>\n<li>**Fase 5 — Memoria VIP** ✅ completa (81 filas snapshot 2026-08-11). Ver [[memoria-vip]].</li>\n<li>**Evolución de agente** ✅ shadow activo (F0–F5 miden/registran, no deciden). `FEATURE_AUTONOMOUS_MODE=false`. Ver [[perfil-evolutivo]], [[trust-budget]], [[detector-emocional]].</li>\n<li>**Eventos temporales** ✅ en código, **sin flag** (siempre cableados). Ver [[eventos-temporales]].</li>\n<li>**Menú de la dueña** ✅ A1–A13 cerrados. Ver [[superficie-admin]].</li>\n\n<h3>Datos</h3>\n\n<li>Repo Alembic: head **029**. Cadena 027 ephemeral → 028 link → 029 quality.</li>\n<li>Producción: último apply verificado = **026** (2026-08-11). 027–029 **SIN VERIFICAR**.</li>\n<li>El bot sigue 100 % supervisado: la **doble puerta de autoenvío está cableada** (pipeline de envío autónomo en `turn_orchestrator.py` ~304/2549, `recontact_service.py` ~209) **pero deshabilitada** por el kill-switch L1 (`FEATURE_AUTONOMOUS_MODE=false`). Nada se autoenvía.</li>\n\n<h3>Pendientes reales (2026-08-21)</h3>\n\n<li>**AUTH-03** — Tope configurable de VIPs: no implementado.</li>\n<li>**AUTH-07** — Modo observación silenciosa de chats no-VIP: no implementado.</li>\n<li>**GAP-11** — Generalización explícita al crear políticas: **parcial** (el campo `generalization` existe y se persiste; `doctrine.py` usa el mismo texto para generalization y rule sin preguntar el alcance).</li>\n<li>**REE-02 / COG-15** — Recontacto con pipeline reducido: no implementado (plantillas fijas `{nombre}`/`{producto}`).</li>\n<li>**MODE-09** — Feedback post-send autónomo dedicado: no implementado.</li>\n<li>**ADM-03** — Cambio de LLM en caliente: no implementado.</li>\n<li>**Autoenvío (doble puerta)** — deshabilitado: `FEATURE_AUTONOMOUS_MODE=false`.</li>\n<li>**Cola durable `synthesis_queue`** para síntesis de perfiles: no implementada (hoy guard en memoria).</li>\n<li>**Ficha de perfil EA-06** con historial de versiones (`vip_profile_history`): no implementada.</li>\n<li>**Fase 4 de evolución de agente (iniciativa contextual)**: diferida por decisión de producto.</li>\n<li>**Migraciones 027–029 en producción**: apply sin verificar (operativo).</li>\n<li>**Deuda técnica de privacidad**: masking PII previo al envío al LLM, retenci</li>", "wikilinks": ["vinculo-lucien", "spec-fase6", "calidad-feedback", "spec-feedback", "canal-atencion", "memoria-vip", "perfil-evolutivo", "trust-budget", "detector-emocional", "eventos-temporales", "superficie-admin"]}}, {"id": "article:entities/specs/informe-auditoria", "label": "Informe de Auditoría", "color": "#4f8ef7", "group": "article", "detail": {"name": "Informe de Auditoría", "type": "article", "typeLabel": "Artículo", "summary": "Auditoría de alineamiento código ↔ requerimientos (julio 2026, re-verificada 2026-08-21 contra el código en `b592192`): **161 requisitos revisados** (P0/P1/P2), base [[spec-requerimientos]].", "tags": "[riesgo, entities — specs, entities/specs, estado, requisito]", "content": "<p>---</p>\n<p>title: Informe de Auditoría</p>\n<p>created: 2026-08-11</p>\n<p>updated: 2026-08-21</p>\n<p>type: summary</p>\n<p>tags: [riesgo, estado, requisito]</p>\n<p>sources: [../../docs/INFORME_AUDITORIA.md]</p>\n<p>confidence: high</p>\n<p>---</p>\n\n<h2>Informe de Auditoría</h2>\n\n<p>Auditoría de alineamiento código ↔ requerimientos (julio 2026, re-verificada 2026-08-21 contra el código en <code>b592192</code>): <b>161 requisitos revisados</b> (P0/P1/P2), base [[spec-requerimientos]].</p>\n\n<h3>Resumen numérico</h3>\n\n<div class='tbl'>| Estado | Cantidad |</div>\n<div class='tbl'>|---|---|</div>\n<div class='tbl'>| ✅ Cumple | 143 |</div>\n<div class='tbl'>| ⚠️ Observación menor | 11 |</div>\n<div class='tbl'>| 🔍 No implementado (P2 / fuera de alcance) | 5 |</div>\n<div class='tbl'>| ❌ No implementado (P1) | **2** |</div>\n\n<p>Reclasificados a CUMPLE en la re-verificación: <b>MODE-05</b> (regenerar variantes — <code>DraftVariantService.regenerate</code> + callbacks regen/prev/next), <b>MET-04</b> (drift detector con baseline — <code>drift_alert_threshold: 0.1</code>, <code>baseline_weeks: 4</code>), <b>MEM-02</b> (extracción post-turno — <code>extract_post_turn</code> → <code>insert_facts</code> cableada) y <b>TRN-06</b> (fuentes de señal de aprendizaje — <code>strong_signal_heuristics</code> + <code>profile_synthesis_trigger_service</code>).</p>\n\n<h3>Los 2 no implementados (P1)</h3>\n\n<li>**AUTH-03** — No hay tope configurable de VIPs (el sistema intentaría procesar cualquier cantidad).</li>\n<li>**AUTH-07** — Modo observación de chats no-VIP sin responder no existe.</li>\n\n<h3>Observaciones relevantes</h3>\n\n<li>**GAP-11 (P1)** — Al resolver zona gris no se pide generalización explícita a la dueña; hoy se usa el texto tal cual como `generalization` y `rule` (parcial: el campo existe y se persiste). Ver [[zona-gris-y-politicas]].</li>\n<li>**MODE-09 (P1)** — Sin feedback post-send autónomo dedicado.</li>\n<li>**ADM-03 (P1)** — Sin cambio de LLM en caliente (overrides por `system_config` solo para `phatic_classifier`, `profile_synthesis`, `trust_budget`).</li>\n<li>**COG-16** — El cortocircuito de escalación vive en un middleware de Telegram, no en el Director como dice el diseño (funciona, capa distinta).</li>\n<li>**REE-02 / COG-15 (P2)** — El recontacto usa plantillas fijas, no el pipeline reducido con personalización.</li>\n<li>**EVAL-04 (P2)** — Sin visualización de calibración por dimensión (el resumen semanal muestra tasa global y drift).</li>\n<li>**GAP-08 (P2)** — Sin comando dedicado para listar/desactivar políticas de doctrina desde admin.</li>\n\n<h3>Fortalezas confirmadas</h3>\n\n<p>Pipeline cognitivo completo con Director determinista, evaluación 7D con prioridades correctas, Behavior Engine separado, zona gris completa con expiración 24h, 5 tipos de conocimiento separados con anti-contaminación, persistencia total en PostgreSQL con secretos fuera del repo, admin completa.</p>\n\n<div class='prov'>^[docs/INFORME_AUDITORIA.md]</div>", "wikilinks": ["spec-requerimientos", "zona-gris-y-politicas"]}}, {"id": "article:entities/specs/spec-1-1", "label": "SPEC-1.1.md", "color": "#4f8ef7", "group": "article", "detail": {"name": "SPEC-1.1.md", "type": "article", "typeLabel": "Artículo", "summary": "Contrato de diseño e implementación (SPEC.md v1.5 — Híbrido Integrado, basado en [[spec-requerimientos]] v2.1). Es la **única fuente de verdad para la implementación**; estrategia incremental por f...", "tags": "[spec, arquitectura], decision, entities — specs, entities/specs", "content": "<p>---</p>\n<p>title: SPEC-1.1.md</p>\n<p>created: 2026-08-11</p>\n<p>updated: 2026-08-21</p>\n<p>type: entity</p>\n<p>tags: [spec, decision, arquitectura]</p>\n<p>sources: [../../docs/SPEC-1.1.md]</p>\n<p>confidence: high</p>\n<p>---</p>\n\n<h2>SPEC-1.1.md</h2>\n\n<p>Contrato de diseño e implementación (SPEC.md v1.5 — Híbrido Integrado, basado en [[spec-requerimientos]] v2.1). Es la <b>única fuente de verdad para la implementación</b>; estrategia incremental por fases. <b>Estado (2026-08-21): implementado</b> — Fase 1 desplegada, Fase 2 activa por flags, Fase 3 activa según flag (ver [[estado-del-proyecto]]).</p>\n\n<h3>Stack tecnológico (bloqueado)</h3>\n\n<li>Python 3.12+, aiogram 3.x (Business Connection nativo), PostgreSQL 16+ (único almacén durable), SQLAlchemy 2.0 async + asyncpg, Pydantic v2, pgvector (Fase 2+).</li>\n<li>LLM primario **DeepSeek**, secundario **Anthropic** (hot-swap vía interfaz abstracta).</li>\n<li>Embeddings locales sentence-transformers (Fase 2).</li>\n<li>**No se usa en V1:** Redis, LangChain, Celery, Kafka.</li>\n\n<h3>Contenido clave</h3>\n\n<li>Arquitectura de alto nivel con [[turn-coordinator]] y máquina de estados del turno (§2-3).</li>\n<li>Contratos por componente (§4): [[director-cognitivo]], Analista, Planificador, [[capability-registry]], Constructor de Contexto, Generador, Evaluador, [[decisor]], [[behavior-engine]].</li>\n<li>Modelo de datos clasificado por fase (§5): tablas Fase 1 (vips, message_history, pipeline_traces, pending_deliveries, turns, escalation_events), Fase 2 (profiles, memories, contexts, policies, examples, staging_candidates, gray_zone_queries), Fase 3 (learning_metrics, system_config).</li>\n<li>ADRs (§9): ADR-001 aiogram; ADR-002 Director + Capability Registry; ADR-003 solo PostgreSQL+pgvector; ADR-004 Behavior Engine con asyncio.Task; ADR-005 embeddings locales; ADR-006 LLMProvider con hot-swap.</li>\n<li>Criterios de aceptación técnicos TAC-01..13 (§10).</li>\n<li>Estructura de carpetas propuesta (§11) — coincide con `src/diana/` del repo.</li>\n\n<div class='prov'>^[docs/SPEC-1.1.md]</div>", "wikilinks": ["spec-requerimientos", "estado-del-proyecto", "turn-coordinator", "director-cognitivo", "capability-registry", "decisor", "behavior-engine"]}}, {"id": "article:entities/specs/spec-evolucion-agente", "label": "SPEC-EVOLUCION-AGENTE.md", "color": "#4f8ef7", "group": "article", "detail": {"name": "SPEC-EVOLUCION-AGENTE.md", "type": "article", "typeLabel": "Artículo", "summary": "Contrato de implementación de la **Evolución de agente** (v1.2): llevar a Diana de \"bot con memoria consultada\" a \"agente con perfil evolutivo, autonomía calibrada por confianza y personalidad con ...", "tags": "[spec, aprendizaje, decision, entities — specs, entities/specs, riesgo]", "content": "<p>---</p>\n<p>title: SPEC-EVOLUCION-AGENTE.md</p>\n<p>created: 2026-08-11</p>\n<p>updated: 2026-08-21</p>\n<p>type: entity</p>\n<p>tags: [spec, decision, aprendizaje, riesgo]</p>\n<p>sources: [../../docs/SPEC-EVOLUCION-AGENTE.md]</p>\n<p>confidence: high</p>\n<p>---</p>\n\n<h2>SPEC-EVOLUCION-AGENTE.md</h2>\n\n<p>Contrato de implementación de la <b>Evolución de agente</b> (v1.2): llevar a Diana de &quot;bot con memoria consultada&quot; a &quot;agente con perfil evolutivo, autonomía calibrada por confianza y personalidad con textura (mood)&quot;.</p>\n\n<p><b>Principio guía:</b> cada pieza nueva detrás de feature flag y con traza auditable — nada se libera sin poder revertirse.</p>\n\n<p><b>Lección incorporada (2026-08-06):</b> los umbrales de seguridad/confianza son <b>constantes fijas con override manual</b> vía <code>system_config</code>, <b>nunca auto-calibrados por LLM</b>. Precedente: el incidente de calibración (safety_min calibrado a 0.95 por correcciones → escalaciones masivas). Ver [[calibracion-de-umbrales]].</p>\n\n<h3>Decisiones de diseño aprobadas (EA-01..06)</h3>\n\n<li>**EA-01** — El [[trust-budget]] es la **fuente única de la decisión conductual** por (VIP, categoría); autoenvío = doble puerta: `trust_score &gt;= umbral` Y evaluación del turno &gt;= mínimos del Decider. Se actualiza solo por eventos (correcciones/autónomos), jamás por calibración LLM.</li>\n<li>**EA-02** — Carril rápido con 3 filtros baratos: clasificador seguro de fático, sin trigger forbidden, chequeo de seguridad del borrador.</li>\n<li>**EA-03** — Categoría `sensitive` = regla dura: siempre aprobación del owner.</li>\n<li>**EA-04** — `feedback_signals`: proxy por categoría + LLM de síntesis filtra relevancia (sin esquema de clasificación extra).</li>\n<li>**EA-05** — Anti-contaminación: `stable_traits`/`sensitivities` jamás alimentan el banco de ejemplos; solo `recent_trend` y mood entran al contexto de generación.</li>\n<li>**EA-06** — UI admin: secciones en la ficha existente del VIP (sin comandos nuevos).</li>\n\n<h3>Fases del contrato</h3>\n\n<li>**Fase 0 — Fundaciones:** migraciones 024+ (`vip_profile`, `vip_profile_history`, `vip_mood_state`, `vip_trust_budget`, `turn_category_log`, `emotional_signal_log`) + [[detector-emocional]] (componente transversal).</li>\n<li>**Fase 1 — Resíntesis de memoria:** [[perfil-evolutivo]] (stable_traits/recent_trend/sensitivities, decaimiento, versionado, `profile_synthesis_job`).</li>\n<li>**Fase 2 — Autonomía fática:** clasificador de turno (phatic/informational/emotional/sensitive) + carril rápido (ver [[trust-budget]]).</li>\n<li>**Fase 3 — Motor de mood:** 3 ejes (juguetón-serio, cálido-distante, energía), promedio móvil con retorno a la base; matiza selección de variantes.</li>\n<li>**Fase 4 — Iniciativa contextual:** recontacto prioriza `recent_trend` + hechos con `follow_up` (campo aditivo opcional). **No implementada (diferida por decisión de producto).**</li>\n<li>**Fase 5 — Trust budget:** [[trust-budget]] activo.</li>\n\n<h3>Estado (2026-08-21) — shadow mode activo</h3>\n\n<p>La capa de evolución de agente está desplegada en <b>shadow mode (modo medición)</b> en producción: los flags F0–F5 están <code>true</code> y <b>miden/registran sin cambiar decisiones</b> ([[perfil-evolutivo]], [[trust-budget]], [[det</p>", "wikilinks": ["calibracion-de-umbrales", "trust-budget", "detector-emocional", "perfil-evolutivo", "trust-budget", "trust-budget", "perfil-evolutivo", "trust-budget", "detector-emocional"]}}, {"id": "article:entities/specs/spec-fase2", "label": "SPEC-FASE2.md", "color": "#4f8ef7", "group": "article", "detail": {"name": "SPEC-FASE2.md", "type": "article", "typeLabel": "Artículo", "summary": "Contrato de diseño e implementación de la **Fase 2 (MVP+)**: Memoria, Aprendizaje Controlado y Zona Gris (v2.1, basado en [[spec-1-1]] y [[spec-requerimientos]] bloques MEM/TRN/GAP/EVAL). **Estado ...", "tags": "[spec, aprendizaje, entities — specs, entities/specs, memoria, politica]", "content": "<p>---</p>\n<p>title: SPEC-FASE2.md</p>\n<p>created: 2026-08-11</p>\n<p>updated: 2026-08-21</p>\n<p>type: entity</p>\n<p>tags: [spec, memoria, aprendizaje, politica]</p>\n<p>sources: [../../docs/SPEC-FASE2.md]</p>\n<p>confidence: high</p>\n<p>---</p>\n\n<h2>SPEC-FASE2.md</h2>\n\n<p>Contrato de diseño e implementación de la <b>Fase 2 (MVP+)</b>: Memoria, Aprendizaje Controlado y Zona Gris (v2.1, basado en [[spec-1-1]] y [[spec-requerimientos]] bloques MEM/TRN/GAP/EVAL). <b>Estado (2026-08-21): implementada y desplegada</b> — los cuatro flags están activos en el entorno de ejecución (ver [[feature-flags]] y [[estado-del-proyecto]]).</p>\n\n<h3>Propósito</h3>\n\n<p>Transformar el &quot;bot supervisado&quot; de Fase 1 en un sistema que aprende y razona con memoria:</p>\n\n<li>**Memoria real** — retrievers con pgvector (memories, policies, examples).</li>\n<li>**Doctrina reutilizable** — [[zona-gris-y-politicas]]: consultas a la dueña → policies estructuradas.</li>\n<li>**Aprendizaje controlado** — [[aprendizaje-post-turno]] con Staging Area y promoción explícita.</li>\n<li>**Evaluación calibrable** — registro de perfiles para [[calibracion-de-umbrales]] futura.</li>\n<li>**Sustituibilidad** — mismas interfaces del [[capability-registry]]; el Director no cambia.</li>\n\n<h3>Feature toggles (activos en runtime)</h3>\n\n<p><code>FEATURE_MEMORY_ENABLED=true</code>, <code>FEATURE_GRAY_ZONE_ENABLED=true</code>, <code>FEATURE_STAGING_ENABLED=true</code>, <code>FEATURE_SANDBOX_ENABLED=true</code> — los cuatro activos en <code>.env</code> (defaults <code>false</code> en código, overridables por env; ver [[feature-flags]]).</p>\n\n<h3>Componentes nuevos</h3>\n\n<li>**Retrievers reales** (reemplazan stubs): MemoryRetriever (umbral 0.75, `WHERE vip_id` obligatorio), PolicyRetriever (umbral 0.8, scope), ExamplesRetriever (top-k 3-5, contraejemplo 10%).</li>\n<li>**StagingService** — `save_correction`, `promote_to_example`, `promote_to_policy`, `discard`. Toda política nueva pasa por staging (BR-13).</li>\n<li>**GrayZoneService** — `create_query`, `freeze_vip`/`unfreeze_vip`, `resolve_with_doctrine`, `expire_old_queries` (timeout 24h default, acción configurable: escalate o use_draft).</li>\n<li>**PolicyDistiller** — estructura la política: `trigger_description`, `rule`, `scope`, `ejemplo_aplicado`.</li>\n<li>**Evaluador** — doctrina según tabla: `needs_policy=false` → 0.7 neutral; con políticas → valor real; `needs_policy=true` + sin políticas → 0.2 (señal de zona gris).</li>\n<li>**Decisor** — prioridad 2 nueva: `consult_doctrine` cuando `needs_policy=true` y retrieval vacío (ver [[decisor]]).</li>\n\n<h3>Orden de activación (histórico)</h3>\n\n<p>Índices HNSW → seed de políticas → flags uno a uno (memoria → staging → zona gris). Rollback solo cambiando configuración.</p>\n\n<div class='prov'>^[docs/SPEC-FASE2.md]</div>", "wikilinks": ["spec-1-1", "spec-requerimientos", "feature-flags", "estado-del-proyecto", "zona-gris-y-politicas", "aprendizaje-post-turno", "calibracion-de-umbrales", "capability-registry", "feature-flags", "decisor"]}}, {"id": "article:entities/specs/spec-fase3", "label": "SPEC-FASE3.md", "color": "#4f8ef7", "group": "article", "detail": {"name": "SPEC-FASE3.md", "type": "article", "typeLabel": "Artículo", "summary": "Contrato de diseño e implementación de la **Fase 3 (Producto Completo)**: Autonomía, Proactividad y Métricas (v3.1, revisión post-review; base: [[spec-1-1]], [[spec-fase2]], Anexo T). **Estado (202...", "tags": "[spec, aprendizaje], entities — specs, entities/specs, modo, operacion", "content": "<p>---</p>\n<p>title: SPEC-FASE3.md</p>\n<p>created: 2026-08-11</p>\n<p>updated: 2026-08-21</p>\n<p>type: entity</p>\n<p>tags: [spec, modo, operacion, aprendizaje]</p>\n<p>sources: [../../docs/SPEC-FASE3.md]</p>\n<p>confidence: high</p>\n<p>---</p>\n\n<h2>SPEC-FASE3.md</h2>\n\n<p>Contrato de diseño e implementación de la <b>Fase 3 (Producto Completo)</b>: Autonomía, Proactividad y Métricas (v3.1, revisión post-review; base: [[spec-1-1]], [[spec-fase2]], Anexo T). <b>Estado (2026-08-21): implementada</b> — recontacto, promo y behavior avanzado activos por flag; modo autónomo y calibración implementados en código pero deshabilitados por flag (<code>FEATURE_AUTONOMOUS_MODE=false</code>, <code>FEATURE_CALIBRATION_ENABLED=false</code>).</p>\n\n<h3>Capacidades que completa</h3>\n\n<li>**Modo autónomo** — envío sin aprobación previa sujeto a umbrales y config por VIP (extensión del [[decisor]]: prioridades 5-6; ver [[modos-de-operacion]]). *(Implementado en código; deshabilitado por flag.)*</li>\n<li>**Recontacto por silencio** — pipeline reducido con exclusión de estados bloqueantes (`is_blocked()`: pausa, congelación, aprobación pendiente, sandbox; REQ-REE-03, BR-05). *(Activo: `FEATURE_RECONTACT_ENABLED=true`.)*</li>\n<li>**Promo no-VIP** — trigger exacto, secuencia multi-mensaje **sin LLM**, diferenciación primer envío/reenvío (`promo.repeat_days` = 30) y trazabilidad (`promo_executions`). *(Activo: `FEATURE_PROMO_ENABLED=true`.)*</li>\n<li>**[[calibracion-de-umbrales]] automática** — job semanal; garantía de margen: autónomo &gt;= supervisado + 0.05. *(Implementado; `FEATURE_CALIBRATION_ENABLED=false`; `detect_drift()` es de solo lectura y reporta métricas.)*</li>\n<li>**Behavior Engine avanzado** — mensajes divididos (`split_chars` 4096), quirks humanos, secuencias (`deliver_with_sequence`). *(Activo: `FEATURE_ADVANCED_BEHAVIOR=true`.)*</li>\n<li>**Métricas agregadas** — `learning_metrics`: tasa de aprobación sin corrección, repetición de zona gris, falsos positivos de escalación, `style_drift_score`, `autonomous_send_rate`.</li>\n\n<h3>Umbrales iniciales (arranque en frío)</h3>\n\n<li>Autónomos: `safety_min=0.9`, `doctrine_min=0.8`, `naturalness_min=0.7`.</li>\n<li>Supervisados: `safety_min=0.5`, `doctrine_min=0.4`, `naturalness_min=0.5`.</li>\n\n<h3>Tablas nuevas</h3>\n\n<p><code>recontact_schedules</code>, <code>promo_triggers</code>, <code>promo_executions</code>, <code>learning_metrics.style_drift_score</code>.</p>\n\n<h3>Hook de cancelación (BR-07)</h3>\n\n<p>El TurnCoordinator llama <code>RecontactService.cancel_recontact(vip_id)</code> cuando el VIP escribe — el recontacto programado se cancela si hay actividad.</p>\n\n<h3>Nota de activación (estado real)</h3>\n\n<p>Recontacto, promo y behavior avanzado están <b>activos</b>; modo autónomo y calibración <b>deshabilitados</b> por flag (ver [[feature-flags]]). La secuencia recomendada de activación original fue: recontacto → promo → calibración → autónomo → behavior avanzado.</p>\n\n<div class='prov'>^[docs/SPEC-FASE3.md]</div>", "wikilinks": ["spec-1-1", "spec-fase2", "decisor", "modos-de-operacion", "calibracion-de-umbrales", "feature-flags"]}}, {"id": "article:entities/specs/spec-fase4", "label": "SPEC-FASE4.md", "color": "#4f8ef7", "group": "article", "detail": {"name": "SPEC-FASE4.md", "type": "article", "typeLabel": "Artículo", "summary": "Contrato de diseño e implementación de la **Fase 4 — Atención al Cliente General (canal no-VIP)** (v1.1, implementada y desplegada). Convierte el sistema en asistente permanente de atención: cualqu...", "tags": "[spec, entities — specs, entities/specs, modo, regla-negocio]", "content": "<p>---</p>\n<p>title: SPEC-FASE4.md</p>\n<p>created: 2026-08-11</p>\n<p>updated: 2026-08-21</p>\n<p>type: entity</p>\n<p>tags: [spec, modo, regla-negocio]</p>\n<p>sources: [../../docs/SPEC-FASE4.md]</p>\n<p>confidence: high</p>\n<p>---</p>\n\n<h2>SPEC-FASE4.md</h2>\n\n<p>Contrato de diseño e implementación de la <b>Fase 4 — Atención al Cliente General (canal no-VIP)</b> (v1.1, implementada y desplegada). Convierte el sistema en asistente permanente de atención: cualquier persona que escriba por Telegram Business (no-VIP) recibe atención con identidad Diana versión servicio.</p>\n\n<h3>Decisiones de producto</h3>\n\n<li>Atención **supervisada** siempre (aprobación/corrección de la dueña; el modo automático queda **fuera de alcance, no implementado**).</li>\n<li>Identidad: misma Diana, **versión servicio**: cálida y profesional, sin coqueteo, sin contenido íntimo.</li>\n<li>Flujo con guion: promo de bienvenida automática (existente) → identificación de intención → guion (precios, diferencias, suscripción, datos de pago).</li>\n<li>Reglas duras: sin contacto personal (&quot;¿dónde te puedo ver?&quot; → servicio inexistente); **Diana es la única que atiende** (nunca derivar).</li>\n<li>**Límite: 20 mensajes del cliente por día por chat** (zona horaria `America/Mexico_City`).</li>\n<li>Sin entrega automática de contenido: el bot guía hasta el pago y **avisa a la dueña** (entrega manual).</li>\n<li>Zona gris aplica a atención: ante desconocimiento → consulta a la dueña, nunca inventar ni derivar.</li>\n\n<h3>Concepto clave: perfil de canal</h3>\n\n<p>El sistema pasa de &quot;una persona global&quot; a un perfil por tipo de chat (ver [[canal-atencion]]). Una sola rama determinista en la puerta (AuthMiddleware): <code>vip_id</code> + <code>channel_type</code> se deciden una vez, el pipeline no cambia.</p>\n\n<li>`FEATURE_GENERAL_MODE_ENABLED` (default `false` en código; **activo**: `true` en `.env`) gobierna todo el comportamiento.</li>\n<li>`persona_versions.channel_type` (`vip` | `atencion`) — una versión activa por canal (migración 018).</li>\n<li>Tabla `daily_message_limits` (chat_id, fecha_local, count).</li>\n<li>Anti-contaminación total entre canales: atención nunca toca `memories` ni el banco VIP.</li>\n\n<h3>Seguridad</h3>\n\n<p>El perfil <code>atencion</code> nunca emite contenido explícito/sexual ni material del canal VIP; <code>forbidden_keywords</code> y freeze aplican a ambos canales (ver [[zona-gris-y-politicas]]).</p>\n\n<div class='prov'>^[docs/SPEC-FASE4.md]</div>", "wikilinks": ["canal-atencion", "zona-gris-y-politicas"]}}, {"id": "article:entities/specs/spec-fase5", "label": "SPEC-FASE5.md", "color": "#4f8ef7", "group": "article", "detail": {"name": "SPEC-FASE5.md", "type": "article", "typeLabel": "Artículo", "summary": "Contrato de diseño e implementación de la **Fase 5 — Perfil de VIP con Memoria (backfill + mantenimiento)** (v1.1, implementada — Fase 5 completa). Construye el puente entre los dos caminos de la i...", "tags": "[spec, aprendizaje], entities — specs, entities/specs, memoria", "content": "<p>---</p>\n<p>title: SPEC-FASE5.md</p>\n<p>created: 2026-08-11</p>\n<p>updated: 2026-08-21</p>\n<p>type: entity</p>\n<p>tags: [spec, memoria, aprendizaje]</p>\n<p>sources: [../../docs/SPEC-FASE5.md]</p>\n<p>confidence: high</p>\n<p>---</p>\n\n<h2>SPEC-FASE5.md</h2>\n\n<p>Contrato de diseño e implementación de la <b>Fase 5 — Perfil de VIP con Memoria (backfill + mantenimiento)</b> (v1.1, implementada — Fase 5 completa). Construye el puente entre los dos caminos de la información:</p>\n\n<li>**Historial crudo** (`message_history`): funcional, 1.015+ mensajes importados.</li>\n<li>**Memoria procesada** (`memories`): **implementada y poblada** — escritores activos (backfill + post-turno + aprobación). Snapshot verificado 2026-08-11: **81 filas** en `memories` (52 auto, 18 discarded, 11 approved) y 10 backfills (ver [[memoria-vip]] y [[estado-del-proyecto]]).</li>\n\n<h3>Decisiones de producto (dueña)</h3>\n\n<li>El perfil por VIP se construye **una vez (backfill)** leyendo el historial completo; fichas ricas o casi vacías son aceptables.</li>\n<li>Luego se **mantiene solo** con extracción post-turno incremental.</li>\n<li>**Control de la dueña**: datos sensibles (salud, familia, dinero, ubicación, trabajo) → candidatos que la dueña aprueba; lo trivial se agrega solo.</li>\n<li>La ficha es **visible y editable** en el panel (datos/notas por VIP).</li>\n<li>Nada de esto se comparte con el canal de atención ([[spec-fase4]]): la memoria es exclusiva de VIPs.</li>\n<li>`FEATURE_MEMORY_ENABLED` es la llave maestra: apagada → comportamiento idéntico al actual.</li>\n\n<h3>Elementos clave</h3>\n\n<li>**Backfill**: historial → LLM (ventanas de 200 msgs / 12K chars) → secciones en `memories` + fila `perfil`. Idempotente. Cola persistente con **lock global: una extracción a la vez** y timer (`BACKFILL_INTERVAL_SEC` = 3600s) para proteger la cuenta de Telegram.</li>\n<li>**Categorías de la ficha**: `identidad`, `preferencias`, `comercial`, `limites`, `sensible`, `perfil` (ficha completa).</li>\n<li>**Migración 022**: `memories.status` (`auto` | `pending_owner` | `approved` | `discarded`) + `source_turn_id` + índice `(vip_id, status)`.</li>\n<li>**Aprobación**: hechos `pending_owner` aparecen en el DM de la dueña (aprobar/descartar/editar); **no se inyectan al contexto** hasta aprobación.</li>\n<li>**Dedup**: similitud semántica ≥ 0.85 contra filas del mismo VIP antes de insertar.</li>\n<li>**Anti-contaminación**: toda lectura/escritura filtra por `vip_id` (BR-15); el canal `atencion` nunca toca `memories`; tests explícitos de aislamiento.</li>\n\n<h3>Pendientes de privacidad (fix round F3)</h3>\n\n<p>Durante el backfill el historial completo del chat se envía al proveedor LLM externo (by-design, con ventanas y tope de 12K chars). Pendientes: opt-out por VIP, evaluación de masking PII, documentar retención, acuerdo de procesamiento con el proveedor.</p>\n\n<div class='prov'>^[docs/SPEC-FASE5.md]</div>", "wikilinks": ["memoria-vip", "estado-del-proyecto", "spec-fase4"]}}, {"id": "article:entities/specs/spec-fase6", "label": "SPEC-FASE6.md", "color": "#4f8ef7", "group": "article", "detail": {"name": "SPEC-FASE6.md", "type": "article", "typeLabel": "Artículo", "summary": "Contrato de diseño de la **Fase 6 — Vínculo entre bots (Lucien → Diana)** (v1.1, implementada y desplegada). Cuando Lucien expulsa a un suscriptor del Canal VIP, Diana verifica si es VIP suyo y pid...", "tags": "[spec, contrato], entities — specs, entities/specs, flujo", "content": "<p>---</p>\n<p>title: SPEC-FASE6.md</p>\n<p>created: 2026-08-16</p>\n<p>updated: 2026-08-21</p>\n<p>type: entity</p>\n<p>tags: [spec, flujo, contrato]</p>\n<p>sources: [../../docs/SPEC-FASE6.md, ../../docs/ESTADO-PROYECTO.md]</p>\n<p>confidence: high</p>\n<p>---</p>\n\n<h2>SPEC-FASE6.md</h2>\n\n<p>Contrato de diseño de la <b>Fase 6 — Vínculo entre bots (Lucien → Diana)</b> (v1.1, implementada y desplegada). Cuando Lucien expulsa a un suscriptor del Canal VIP, Diana verifica si es VIP suyo y pide a la dueña qué hacer. Nada destructivo es automático. Ver [[vinculo-lucien]].</p>\n\n<h3>Decisiones de producto (dueña)</h3>\n\n<li>La vía es la **conexión business** de la misma cuenta (Telegram no deja que dos bots se vean mensajes).</li>\n<li>Chat de coordinación = **grupo privado** (`LINK_CHAT_ID` en ambos bots); en el despliegue actual es el DM con el bot de Lucien (`LINK_CHAT_ID=7360762013`), flujo bot↔bot verificado E2E. &lt;!-- VERIFY: lado emisor (repo lucienbot) y el chat desplegado no son verificables desde este repo --&gt;</li>\n<li>Si el expulsado es VIP activo de Diana → aviso a la dueña con **Expulsar / Inhabilitar / Mantener**.</li>\n<li>Si no es VIP → se registra y no se notifica.</li>\n<li>**Inhabilitar** es indefinido (`frozen_until` lejana, default `2099-12-31T00:00:00Z`).</li>\n<li>`FEATURE_LINK_ENABLED`: default `false` en código, **activo en `.env`** (`true`). Apagado → comportamiento idéntico al anterior.</li>\n<li>Sin ack de vuelta a Lucien en esta fase (fuera de alcance).</li>\n\n<h3>Qué implementó Diana (2026-08-15)</h3>\n\n<p>Pool cerrado 4/4. <b>Flag ACTIVO en <code>.env</code></b> (<code>FEATURE_LINK_ENABLED=true</code>); <b>integration spike completado</b> — Fase 6 desplegada y verificada E2E (bot-to-bot DM, aceptación real pasada). Migración real de <code>link_events</code>: <b>028</b> (027 se usó para eventos temporales).</p>\n\n<div class='tbl'>| Pieza | Dónde |</div>\n<div class='tbl'>|---|---|</div>\n<div class='tbl'>| Ledger `link_events` | Migración **028** (el SPEC citaba 027; 027 es ephemeral) |</div>\n<div class='tbl'>| Decisión | `LinkCoordinator` en [[application-services]]: dedup → VIP → notificar → Expel/Disable/Keep |</div>\n<div class='tbl'>| Entrada `[LINK]` | `LinkCoordinatorMiddleware` **antes** de `OwnerDetectionMiddleware` (corrección a REQ-LNK-04) |</div>\n<div class='tbl'>| Callbacks | `handlers/link.py` (`link:expel\\|disable\\|keep:&lt;event_id&gt;`), solo dueña |</div>\n<div class='tbl'>| Aviso | `notify_link` + teclado de 3 botones |</div>\n\n<h3>Deltas vs el SPEC v1.0</h3>\n\n<p>El SPEC sigue siendo el contrato de producto. El código corrigió tres detalles de implementación:</p>\n\n<li>Receptor en **middleware**, no en un router de `business_message` (`handlers/link.py` solo maneja botones).</li>\n<li>Tabla `link_events` = migración **028**, no 027.</li>\n<li>Flag: default OFF en código pero **activo por env** (`FEATURE_LINK_ENABLED=true`); con OFF, el middleware es pass-through y el coordinator no-opea.</li>\n\n<p>Diana solo consume el payload <code>[LINK]</code> / <code>event=vip_kicked</code>. Los puntos de emisión viven en Lucien; no se documentan aquí. <b>Sin pendientes de esta Fase</b> (los 3 ítems abiertos — fecha centinela de Inhabilitar, <code>username</code> opcional, política de reintento best-effort — están resueltos; ver [[estado-del-proyecto]]).</p>\n\n<p>Relacionado: [[feature-flags]], [[anti-contaminacion]], [[estado-del-proyecto]].</p>\n\n<div class='prov'>^[docs/SPEC-FASE6.md]</div>", "wikilinks": ["vinculo-lucien", "application-services", "estado-del-proyecto", "feature-flags", "anti-contaminacion", "estado-del-proyecto"]}}, {"id": "article:entities/specs/spec-feedback", "label": "SPEC-FEEDBACK.md", "color": "#4f8ef7", "group": "article", "detail": {"name": "SPEC-FEEDBACK.md", "type": "article", "typeLabel": "Artículo", "summary": "Síntesis del spec de implementación **Feedback de calidad + fix zona gris** (`docs/SPEC
