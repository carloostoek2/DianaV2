<style>
  :root {

  [data-theme="light"] {
    --bg:#f3f5f8; --panel:#ffffff; --border:#d9e0e8; --text:#1a2330;

         background:var(--bg); color:var(--text); }

  .chip { padding:4px 11px; border-radius:20px; font-size:12px; cursor:pointer; user-select:none;

  #side { position:fixed; top:100px; right:0; bottom:0; width:min(380px, 92vw); z-index:18;
          background:var(--panel); border-left:1px solid var(--border); overflow-y:auto;
          transform:translateX(100%); transition:transform .22s ease; padding:14px 16px; }

             border:1px solid var(--border); border-radius:10px; overflow:hidden;
             max-height:min(320px, 45vh); overflow-y:auto; display:none; min-width:240px;

  #results .rrow { padding:8px 12px; font-size:12.5px; cursor:pointer; border-bottom:1px solid var(--border); }

  #results .rrow:hover, #results .rrow.cur { background:var(--accent); color:#fff; }
  #results .rrow .rtype { font-size:10px; opacity:.7; margin-left:6px; }

<script>
const NODES = [{"id": "article:SCHEMA", "label": "Wiki Schema — Sistema DianaV2", "color": "#4f8ef7", "group": "article", "detail": {"name": "Wiki Schema — Sistema DianaV2", "type": "article", "typeLabel": "Artículo", "summary": "Sistema DianaV2 (Diana Business Bot): automatización de chats VIP en Telegram con pipeline cognitivo (Director determinista + componentes LLM especializados), aprendizaje controlado (Staging Area),...", "tags": "", "content": "<h2>Wiki Schema — Sistema DianaV2</h2>\n\n<p>&gt; Esta wiki es la base de conocimiento compilada del sistema Diana Business Bot.</p>\n<p>&gt; Patrón: Karpathy LLM Wiki (https://gist.github.com/karpathy/442a6bf555914893e9891c11519de94f).</p>\n<p>&gt; El agente mantiene la wiki; las fuentes viven en <code>docs/</code> del repositorio.</p>\n\n<h3>Domain</h3>\n\n<p>Sistema DianaV2 (Diana Business Bot): automatización de chats VIP en Telegram con</p>\n<p>pipeline cognitivo (Director determinista + componentes LLM especializados),</p>\n<p>aprendizaje controlado (Staging Area), modos supervisado/autónomo, y evolución</p>\n<p>por fases (Fase 1 MVP → Fase 3 Producto Completo → Fase 5 Evolución de Agente).</p>\n\n<h3>Convenciones</h3>\n\n<li>Nombres de archivo: minúsculas, guiones, sin espacios (ej. `director-cognitivo.md`).</li>\n<li>Toda página lleva frontmatter YAML (ver plantilla abajo).</li>\n<li>Usar enlaces entre páginas con la sintaxis de doble corchete (dos corchetes de apertura y cierre alrededor del nombre), mínimo 2 enlaces salientes por página.</li>\n<li>Al actualizar una página, subir la fecha `updated`.</li>\n<li>Toda página nueva se agrega a `index.md` bajo su sección.</li>\n<li>Toda acción se registra en `log.md` (append-only, rotar a `log-YYYY.md` a 500 entradas).</li>\n<li>**Idioma: español neutro obligatorio** (regla AGENTS.md v1.3 §0.6). Prohibido el</li>\n<p>voseo rioplatense (querés, tenés, hacés, podés, vos, y los imperativos voseantes).</p>\n<li>**Provenance:** en páginas que sintetizan 3+ fuentes, anexar `^[docs/&lt;archivo&gt;]` al</li>\n<p>final del párrafo cuya afirmación proviene de esa fuente.</p>\n<li>**Fuentes:** las fuentes NO se duplican en `wiki/raw/` — ya viven versionadas en</li>\n<p><code>docs/</code> y <code>src/</code> del repositorio. Las páginas las referencian con <code>sources:</code> en el</p>\n<p>frontmatter (ruta relativa desde <code>wiki/</code>). <code>raw/</code> queda reservado para material</p>\n<p>externo sin versionar que se ingiera en el futuro.</p>\n\n<h3>Frontmatter</h3>\n\n<pre>\n---\ntitle: Nombre de la Página\ncreated: YYYY-MM-DD\nupdated: YYYY-MM-DD\ntype: entity | concept | comparison | query | summary\ntags: [de la taxonomía de abajo]\nsources: [../../docs/REQUERIMIENTOS.md]\nconfidence: high | medium | low   # opcional\ncontested: true                    # opcional\ncontradictions: [otra-pagina]      # opcional\n---\n</pre>\n\n<h3>Taxonomía de tags (16)</h3>\n\n<p>Definir aquí TODO tag nuevo ANTES de usarlo. Regla: todo tag de una página debe</p>\n<p>aparecer en esta taxonomía.</p>\n\n<li>**arquitectura** — diseño estructural del sistema (capas, dependencias, sustituibilidad)</li>\n<li>**modulo** — componente/módulo concreto del sistema (Director, Decisor, Behavior, Learning…)</li>\n<li>**contrato** — límites duros y contratos que ningún agente puede romper</li>\n<li>**flujo** — flujos canónicos del pipeline (turno normal, escalación, recontacto, promo…)</li>\n<li>**requisito** — requisitos funcionales (REQ-*) y no funcionales (REQ-NFR-*)</li>\n<li>**regla-negocio** — reglas transversales de producto (BR-*)</li>\n<li>**modo** — modos de operación: supervisado, autónomo, sandbox, pausa</li>\n<li>**aprendizaje** — Staging Area, destilación de políticas, métricas, calibración</li>\n<li>**memoria** — cinco tipos de conocimiento, anti-contaminación, retrieval</li>\n<li>**politic</li>", "wikilinks": []}}, {"id": "article:concepts/anti-contaminacion", "label": "Anti-Contaminación", "color": "#4f8ef7", "group": "article", "detail": {"name": "Anti-Contaminación", "type": "article", "typeLabel": "Artículo", "summary": "La Memoria de un VIP es **privada a ese VIP** y **nunca** puede filtrarse al banco de few-shots reutilizables entre VIP (REQ-MEM-07, REQ-TRN-09, REQ-NFR-15, BR-15). Es uno de los cinco principios r...", "tags": "[memoria, aprendizaje, concepts, contrato]", "content": "<p>---</p>\n<p>title: Anti-Contaminación</p>\n<p>created: 2026-08-11</p>\n<p>updated: 2026-08-16</p>\n<p>type: concept</p>\n<p>tags: [memoria, aprendizaje, contrato]</p>\n<p>sources: [../../docs/REQUERIMIENTOS.md, ../../AGENTS.md, ../../src/diana/infrastructure/db/repositories/examples.py, ../../src/diana/application/staging_service.py]</p>\n<p>confidence: high</p>\n<p>---</p>\n\n<h2>Anti-Contaminación</h2>\n\n<p>La Memoria de un VIP es <b>privada a ese VIP</b> y <b>nunca</b> puede filtrarse al banco de few-shots reutilizables entre VIP (REQ-MEM-07, REQ-TRN-09, REQ-NFR-15, BR-15). Es uno de los cinco principios rectores innegociables del sistema.</p>\n\n<h3>Qué protege</h3>\n\n<li>**Memoria/Perfil/Contexto:** hechos y preferencias de un VIP concreto.</li>\n<li>**Banco de Ejemplos (few-shot):** casos exitosos reutilizables, separados y con reglas de acceso propias.</li>\n\n<h3>Reglas</h3>\n\n<li>Los cinco tipos de conocimiento nunca se mezclan ni se recuperan indiscriminadamente (BR-10).</li>\n<li>Ningún hecho de Memoria se convierte automáticamente en few-shot general.</li>\n<li>El contenido de cualquier tipo de conocimiento se trata como **dato no confiable**, nunca como instrucciones del sistema (REQ-MEM-05).</li>\n<li>En el checklist de revisión: &quot;¿Se mantiene la anti-contaminación Memoria ↔ Ejemplos?&quot; (AGENTS.md §6).</li>\n\n<h3>Bancos con `vip_id` (2026-08-16)</h3>\n\n<p><code>examples.vip_id</code> y <code>policies.vip_id</code> <b>no</b> mezclan Memoria con el banco: son el mismo tipo de conocimiento, acotado a un VIP o global.</p>\n\n<p>Cláusula de visibilidad (ejemplos y políticas):</p>\n\n<li>Canal Atención / `vip_id is None` → solo filas globales (`column IS NULL`).</li>\n<li>Turno VIP → globales **o** las de ese VIP (`IS NULL OR == vip_id`).</li>\n<li>Un VIP **nunca** ve el banco scoped de otro VIP.</li>\n\n<p>El retriever de examples no importa módulos de memoria (AST gate). El retriever de memoria exige <code>WHERE vip_id = :vip_id</code> y no toca <code>examples</code>.</p>\n\n<h3>Escritura al banco (Staging / calidad)</h3>\n\n<li>`promote_to_example` inserta un few-shot **global** `quality=standard` (sin `vip_id`).</li>\n<li>Destacar (`insert_gold_example`) inserta `quality=gold` con alcance global o de ese VIP; no requiere candidato de staging, pero **sí** confirmación explícita de la dueña. Flag de escritura: `FEATURE_QUALITY_FEEDBACK_ENABLED`. El retrieval siempre usa `quality`/`vip_id`.</li>\n<li>Reprender → `promote_to_counter_example(vip_id=…)` o `promote_to_policy(vip_id=…)`.</li>\n<li>**REQ-ATN-13:** un candidato del canal `atencion` no puede entrar al banco VIP (`AtencionPromoteBlocked`) — ni gold, ni example, ni contraejemplo.</li>\n<li>EA-05: `stable_traits` / `sensitivities` del [[perfil-evolutivo]] jamás alimentan el banco ni el retriever de examples.</li>\n\n<p>Relacionado: [[aprendizaje-post-turno]], [[capability-registry]], [[zona-gris-y-politicas]].</p>\n\n<div class='prov'>^[docs/REQUERIMIENTOS.md §9.8, AGENTS.md §1, src/diana/infrastructure/db/repositories/examples.py]</div>", "wikilinks": ["perfil-evolutivo", "aprendizaje-post-turno", "capability-registry", "zona-gris-y-politicas"]}}, {"id": "article:concepts/aprendizaje-post-turno", "label": "Aprendizaje Post-Turno", "color": "#4f8ef7", "group": "article", "detail": {"name": "Aprendizaje Post-Turno", "type": "article", "typeLabel": "Artículo", "summary": "El aprendizaje ocurre **siempre después de terminar el turno**, nunca durante el pipeline de decisión (REQ-TRN-05, BR-11). Es un proceso separado del pipeline cognitivo (AGENTS.md: \"El aprendizaje ...", "tags": "[aprendizaje, concepts, contrato, flujo]", "content": "<p>---</p>\n<p>title: Aprendizaje Post-Turno</p>\n<p>created: 2026-08-11</p>\n<p>updated: 2026-08-16</p>\n<p>type: concept</p>\n<p>tags: [aprendizaje, contrato, flujo]</p>\n<p>sources: [../../docs/REQUERIMIENTOS.md, ../../AGENTS.md]</p>\n<p>confidence: high</p>\n<p>---</p>\n\n<h2>Aprendizaje Post-Turno</h2>\n\n<p>El aprendizaje ocurre <b>siempre después de terminar el turno</b>, nunca durante el pipeline de decisión (REQ-TRN-05, BR-11). Es un proceso separado del pipeline cognitivo (AGENTS.md: &quot;El aprendizaje es siempre post-turno y controlado&quot;).</p>\n\n<h3>Fuentes de señal (REQ-TRN-06, con calidad distinta)</h3>\n\n<li>**Aprobación sin cambios** → señal fuerte positiva.</li>\n<li>**Corrección de la dueña** → la más valiosa: se guarda el par `(borrador_original, corrección_final)` como **contraejemplo**.</li>\n<li>**Resolución de zona gris** → se convierte en Política estructurada, no en few-shot.</li>\n<li>**Turnos observados** (dueña responde a mano) → señal ruidosa, menor confianza por defecto.</li>\n\n<h3>Staging Area (REQ-TRN-07, BR-13, REQ-NFR-16)</h3>\n\n<p>La corrección clásica entra primero a una zona intermedia (<code>staging_candidates</code>) y solo pasa al banco vivo tras <b>confirmación explícita</b> de la dueña. <b>Nunca se promueve solo.</b></p>\n\n<p>Excepción controlada ([[calidad-feedback]]): <b>Destacar</b> inserta un ejemplo <code>quality=gold</code> <b>sin</b> candidato de staging, porque la dueña ya confirmó. <b>Reprender</b> entrega el texto al VIP al instante y el combo posterior promociona el contraejemplo (tampoco espera la cola de revisión). Atención no puede destacar ni reprender.</p>\n\n<h3>Reglas de oro</h3>\n\n<li>El banco de Ejemplos y la Memoria por VIP tienen reglas de acceso separadas ([[anti-contaminacion]]).</li>\n<li>El retrieval de few-shots es **gold-first** (destacados antes que standard) + similitud; si hay match, siempre anexa 1 contraejemplo. Ya no hay sorteo al 10 %.</li>\n<li>Un ejemplo o una política puede ser global (`vip_id` vacío) o de un VIP. Atención solo ve globales.</li>\n<li>La extracción de hechos nuevos (REQ-MEM-02) clasifica en el tipo correcto de conocimiento; nada entra sin revisión cuando corresponde.</li>\n\n<div class='prov'>^[docs/REQUERIMIENTOS.md §9.9, AGENTS.md §1]</div>", "wikilinks": ["calidad-feedback", "anti-contaminacion"]}}, {"id": "article:concepts/calibracion-de-umbrales", "label": "Calibración de Umbrales", "color": "#4f8ef7", "group": "article", "detail": {"name": "Calibración de Umbrales", "type": "article", "typeLabel": "Artículo", "summary": "Ajuste empírico de los umbrales del Evaluador/Decisor a partir de la tasa de corrección real (REQ-EVAL-01..03). Los valores absolutos del Evaluador no se toman al pie de la letra: se calibran contr...", "tags": "[aprendizaje, concepts, decision, riesgo]", "content": "<p>---</p>\n<p>title: Calibración de Umbrales</p>\n<p>created: 2026-08-11</p>\n<p>updated: 2026-08-11</p>\n<p>type: concept</p>\n<p>tags: [aprendizaje, decision, riesgo]</p>\n<p>sources: [../../docs/REQUERIMIENTOS.md, ../../docs/SPEC-FASE3.md, ../../docs/SPEC-EVOLUCION-AGENTE.md]</p>\n<p>confidence: high</p>\n<p>---</p>\n\n<h2>Calibración de Umbrales</h2>\n\n<p>Ajuste empírico de los umbrales del Evaluador/Decisor a partir de la tasa de corrección real (REQ-EVAL-01..03). Los valores absolutos del Evaluador no se toman al pie de la letra: se calibran contra la curva real de correcciones de la dueña.</p>\n\n<h3>Mecanismo (SPEC-FASE3 §5.5)</h3>\n\n<li>Job semanal (ej. domingo 3 AM) → `CalibrationService.calibrate_thresholds(window_days=30)`.</li>\n<li>Para cada dimensión calcula el percentil donde la tasa de corrección es baja: **supervisado = percentil 70**, **autónomo = percentil 90**.</li>\n<li>**Garantía de margen:** umbral autónomo &gt;= umbral supervisado + `autonomous_margin_min` (0.05) — el autónomo siempre es más estricto.</li>\n<li>Actualiza `system_config` con ambos conjuntos + registro con timestamp para auditoría.</li>\n<li>`detect_drift()` compara el estilo actual con la línea base; si supera el umbral, alerta a la dueña (REQ-MET-04).</li>\n\n<h3>El incidente que cambió la regla (2026-08)</h3>\n\n<p>La calibración automática calibro <code>safety_min</code> a ~0.95 a partir de correcciones → <b>escalaciones masivas</b>. Consecuencia, codificada en SPEC-EVOLUCION-AGENTE v1.2:</p>\n\n<p>&gt; Los umbrales de seguridad y confianza son <b>constantes fijas con override manual</b> vía <code>system_config</code>, <b>nunca auto-calibrados por LLM</b>. La recalibración automática de gates de seguridad/confianza queda prohibida.</p>\n\n<p>La calibración automática quedó <b>desactivada</b> en producción (<code>FEATURE_CALIBRATION_ENABLED=false</code>); umbrales en DB con valores por defecto. Al reactivarla: no calibrar gates P1 desde correcciones y recomputar la línea base de deriva.</p>\n\n<h3>Umbrales de arranque en frío (SPEC-FASE3 §4.2)</h3>\n\n<div class='tbl'>| Dimensión | Supervisado | Autónomo |</div>\n<div class='tbl'>|---|---|---|</div>\n<div class='tbl'>| safety_min | 0.5 | 0.9 |</div>\n<div class='tbl'>| doctrine_min | 0.4 | 0.8 |</div>\n<div class='tbl'>| naturalness_min | 0.5 | 0.7 |</div>\n\n<p>Relacionado: [[perfil-evaluacion-multidimensional]], [[decisor]], [[feature-flags]].</p>\n\n<div class='prov'>^[docs/SPEC-FASE3.md §5.5, docs/SPEC-EVOLUCION-AGENTE.md §0]</div>", "wikilinks": ["perfil-evaluacion-multidimensional", "decisor", "feature-flags"]}}, {"id": "article:concepts/calidad-feedback", "label": "Calidad Feedback (Destacar / Reprender)", "color": "#4f8ef7", "group": "article", "detail": {"name": "Calidad Feedback (Destacar / Reprender)", "type": "article", "typeLabel": "Artículo", "summary": "Dos palancas extra en el borrador VIP, más allá de Aprobar / Corregir / Escalar: **Destacar** una respuesta que sí hay que repetir, y **Reprender** una que no.", "tags": "[aprendizaje, concepts, flujo, operacion]", "content": "<p>---</p>\n<p>title: Calidad Feedback</p>\n<p>created: 2026-08-16</p>\n<p>updated: 2026-08-21</p>\n<p>type: concept</p>\n<p>tags: [aprendizaje, flujo, operacion]</p>\n<p>sources: [../../docs/SPEC-FEEDBACK.md, ../../docs/UX.md, ../../src/diana/application/admin_service.py]</p>\n<p>confidence: high</p>\n<p>---</p>\n\n<h2>Calidad Feedback (Destacar / Reprender)</h2>\n\n<p>Dos palancas extra en el borrador VIP, más allá de Aprobar / Corregir / Escalar: <b>Destacar</b> una respuesta que sí hay que repetir, y <b>Reprender</b> una que no.</p>\n\n<p>El flag <code>FEATURE_QUALITY_FEEDBACK_ENABLED</code> (env <code>feature_quality_feedback_enabled</code>) está <b>activo en producción desde 2026-08-21</b> (<code>FEATURE_QUALITY_FEEDBACK_ENABLED=true</code> en <code>.env</code>; default <code>false</code> en código, overridable por env). Con el flag activo los botones Destacar/Reprender aparecen en los borradores VIP y la escritura de oro/lección es operativa. El retrieval gold-first y el filtro <code>vip_id</code> están en el esquema (migración <code>029_feedback_quality</code>) y escriben filas al usar los botones.</p>\n\n<h3>Estado actual</h3>\n\n<p>Solo borradores <b>VIP</b> (<code>approval.vip_id</code> presente). Canal [[canal-atencion]] se bloquea antes de enviar (<code>AtencionPromoteBlocked</code>, REQ-ATN-13). Sandbox entrega el mensaje pero <b>no</b> persiste gold ni lección (<code>should_persist=false</code>).</p>\n\n<h4>Destacar</h4>\n\n<li>La dueña toca Destacar. **Todavía no se envía.**</li>\n<li>Elige **🌍 General** (`vip_id` NULL) o **👤 Este VIP** (`vip_id` del turno). Volver restaura el teclado del borrador.</li>\n<li>Entonces se aprueba (misma entrega que Aprobar) y se inserta un `Example` con `quality=&#x27;gold&#x27;`, `draft_text == corrected_text`. **No** pasa por la cola de `staging_candidates`.</li>\n\n<h4>Reprender (entrega ya, combo solo promociona)</h4>\n\n<li>Toca Reprender y escribe el texto corregido.</li>\n<li>Ese texto **se entrega al VIP en ese momento** (`handle_correct_with_candidate`). Queda un candidato interno.</li>\n<li>El combo posterior es **solo promoción** (no reenvía):</li>\n\n<li>**Regla dura** → `promote_to_policy` (trigger recortado del texto del VIP, `rule` = texto de la dueña, `scope=&#x27;all&#x27;`, `vip_id` según alcance).</li>\n<li>**No repetir** → `promote_to_counter_example` (`is_counter_example=True`).</li>\n\n<li>Si el VIP escribe de nuevo, el combo se cancela. El mensaje ya enviado no se revierte. Un combo huérfano o vencido no vuelve a entregar (fail-closed).</li>\n\n<p>La dueña elige severidad y alcance caso por caso. No hay heurística automática (FB-01). Superficie: [[superficie-admin]].</p>\n\n<h3>Bancos: gold-first y alcance VIP</h3>\n\n<div class='tbl'>| Columna | Dónde | Semántica |</div>\n<div class='tbl'>|---|---|---|</div>\n<div class='tbl'>| `examples.quality` | `standard` (default) / `gold` | Un gold sobre el umbral de similitud **siempre** ordena antes que un standard más parecido. |</div>\n<div class='tbl'>| `examples.vip_id` / `policies.vip_id` | `NULL` = global | VIP ve `(vip_id IS NULL) OR (vip_id = este)`. Atención ve **solo** globales. Eje distinto de `policies.scope` (canal). |</div>\n\n<p>El [[aprendizaje-post-turno]] de Corregir sigue igual: candidato <code>pending</code> y la dueña confirma en staging. Destacar/Reprender no usan esa cola de revisión. Los contraejemplos ya no se muestrean al 10%: si hay match sobre el umbral, se incluye</p>", "wikilinks": ["canal-atencion", "superficie-admin", "aprendizaje-post-turno", "anti-contaminacion", "superficie-admin", "trust-budget", "spec-feedback"]}}, {"id": "article:concepts/canal-atencion", "label": "Canal de Atención", "color": "#4f8ef7", "group": "article", "detail": {"name": "Canal de Atención", "type": "article", "typeLabel": "Artículo", "summary": "Perfil de canal para clientes **no-VIP** (Fase 4, `channel_type=\"atencion\"`). El sistema pasa de \"una persona global\" a **un perfil por tipo de chat**; el canal se decide una vez, de forma determin...", "tags": "[modo, concepts, memoria], regla-negocio", "content": "<p>---</p>\n<p>title: Canal de Atención</p>\n<p>created: 2026-08-11</p>\n<p>updated: 2026-08-11</p>\n<p>type: concept</p>\n<p>tags: [modo, regla-negocio, memoria]</p>\n<p>sources: [../../docs/SPEC-FASE4.md]</p>\n<p>confidence: high</p>\n<p>---</p>\n\n<h2>Canal de Atención</h2>\n\n<p>Perfil de canal para clientes <b>no-VIP</b> (Fase 4, <code>channel_type=&quot;atencion&quot;</code>). El sistema pasa de &quot;una persona global&quot; a <b>un perfil por tipo de chat</b>; el canal se decide una vez, de forma determinista, en la puerta de entrada (AuthMiddleware) — el pipeline cognitivo no cambia.</p>\n\n<h3>Diferencias con el canal VIP</h3>\n\n<div class='tbl'>| Aspecto | VIP | Atención |</div>\n<div class='tbl'>|---|---|---|</div>\n<div class='tbl'>| Determinación | allowlist (auth) | no-VIP + `FEATURE_GENERAL_MODE_ENABLED` |</div>\n<div class='tbl'>| Identidad | Diana actual | Diana versión servicio |</div>\n<div class='tbl'>| Estilo | Cálida, cercana, coqueta permitida | Cálida-profesional, **sin coqueteo**, sin contenido íntimo |</div>\n<div class='tbl'>| Memoria | `memories` por VIP | Solo `message_history` por chat (nunca `memories`) |</div>\n<div class='tbl'>| Entrega | Supervisada / autónoma | **Supervisada** (autónomo postergado) |</div>\n<div class='tbl'>| Límite | Sin límite | **20 mensajes del cliente/día/chat** (zona `America/Mexico_City`) |</div>\n<div class='tbl'>| Aprendizaje | Banco de ejemplos VIP | Marcado `channel_type=atencion`, jamás al banco VIP |</div>\n\n<h3>Reglas de oro</h3>\n\n<li>**Diana es la única que atiende**: prohibido derivar a terceros o decir &quot;eso lo ves con alguien más&quot;. Ante desconocimiento → [[zona-gris-y-politicas]] (consulta a la dueña), nunca inventar.</li>\n<li>**Sin contacto personal** (política `no_contacto_personal`): &quot;¿dónde te puedo ver?&quot; → servicio inexistente, respuesta cálida y firme.</li>\n<li>**Sin entrega de contenido automática**: el bot guía hasta el pago y avisa a la dueña por DM (entrega manual; `datos_pago` activada o comprensión de pago → notificación).</li>\n<li>**Guiones son doctrina** (policies), no few-shots: precios, diferencias_niveles, suscripcion, datos_pago, no_contacto_personal, no_contenido_hasta_pago, unica_atencion, fuera_alcance.</li>\n<li>**Anti-contaminación total entre canales** (REQ-ATN-13): el staging filtra por canal; la calibración y el drift usan **solo muestras VIP**.</li>\n<li>**Tope diario** (REQ-ATN-03): contador determinista por `(chat_id, fecha_local)` en `daily_message_limits`; al alcanzar 20, una única respuesta de cierre (plantilla fija) y luego drop silencioso.</li>\n\n<h3>Cambios de esquema</h3>\n\n<p>Migración 018: <code>persona_versions.channel_type</code> (constraint de activo por <code>(channel_type, is_active)</code>) + tabla <code>daily_message_limits</code>. El toggle manual <code>training_mode_enabled</code> queda deprecado para producción.</p>\n\n<p>Relacionado: [[spec-fase4]], [[modos-de-operacion]], [[anti-contaminacion]], [[feature-flags]].</p>\n\n<div class='prov'>^[docs/SPEC-FASE4.md]</div>", "wikilinks": ["zona-gris-y-politicas", "spec-fase4", "modos-de-operacion", "anti-contaminacion", "feature-flags"]}}, {"id": "article:concepts/capability-registry", "label": "Capability Registry", "color": "#4f8ef7", "group": "article", "detail": {"name": "Capability Registry", "type": "article", "typeLabel": "Artículo", "summary": "El corazón de la **sustituibilidad** (REQ-NFR-14). El [[director-cognitivo]] no conoce módulos concretos: conoce únicamente **capacidades** (`knowledge.memory`, `knowledge.policy`, `knowledge.sched...", "tags": "[arquitectura, concepts, contrato], modulo", "content": "<p>---</p>\n<p>title: Capability Registry</p>\n<p>created: 2026-08-11</p>\n<p>updated: 2026-08-16</p>\n<p>type: concept</p>\n<p>tags: [arquitectura, modulo, contrato]</p>\n<p>sources: [../../docs/REQUERIMIENTOS.md, ../../docs/SPEC-1.1.md, ../../src/diana/cognitive/registry.py]</p>\n<p>confidence: high</p>\n<p>---</p>\n\n<h2>Capability Registry</h2>\n\n<p>El corazón de la <b>sustituibilidad</b> (REQ-NFR-14). El [[director-cognitivo]] no conoce módulos concretos: conoce únicamente <b>capacidades</b> (<code>knowledge.memory</code>, <code>knowledge.policy</code>, <code>knowledge.schedule</code>, <code>knowledge.examples</code>, <code>knowledge.history</code>, <code>knowledge.context</code>, <code>knowledge.profile</code>, <code>knowledge.persona_facts</code>, <code>knowledge.voice_patterns</code>).</p>\n\n<li>**Pregunta que responde:** ¿Qué componente concreto satisface esta capacidad?</li>\n<li>**Contrato:** `resolve(capacidad) → Retriever` (todos con interfaz `fetch(turn) → resultado | null`).</li>\n\n<h3>Capacidades y estado por fase</h3>\n\n<div class='tbl'>| Capacidad | Fase 1 (MVP) | Fase 2 (MVP+) | Fase 3+ |</div>\n<div class='tbl'>|---|---|---|---|</div>\n<div class='tbl'>| `knowledge.history` | REAL (últimos N mensajes, SQL) | REAL mejorado | REAL |</div>\n<div class='tbl'>| `knowledge.context` | REAL parcial | REAL parcial (derivado del historial; no lee `contexts`) | REAL parcial |</div>\n<div class='tbl'>| `knowledge.profile` | STUB (null) | REAL (profiles, PK) | REAL |</div>\n<div class='tbl'>| `knowledge.memory` | STUB | REAL (memories, pgvector + vip_id) | REAL |</div>\n<div class='tbl'>| `knowledge.policy` | STUB | REAL (policies activas) | REAL + `vip_id` |</div>\n<div class='tbl'>| `knowledge.examples` | STUB | REAL (few-shot) | REAL + gold-first + `vip_id` |</div>\n<div class='tbl'>| `knowledge.schedule` | STUB | STUB | REAL (agenda de la dueña) |</div>\n<div class='tbl'>| `knowledge.persona_facts` | — | — | REAL (catálogo estático / canal) |</div>\n<div class='tbl'>| `knowledge.voice_patterns` | — | — | REAL (catálogo estático / canal) |</div>\n\n<p><code>knowledge.ephemeral</code> <b>no</b> es asiento del Registry: lo inyecta un <code>KnowledgeAugmenter</code> de aplicación después del fetch (eventos con vigencia). El Constructor de Contexto sí lo emite si viene en el mapa.</p>\n\n<h3>Retrieval vivo (2026-08-16)</h3>\n\n<li>**Examples (gold-first):** `find_by_similarity` ordena `quality=gold` antes que `standard`, y luego por distancia coseno. Umbral 0.7, límite 5; siempre intenta anexar 1 contraejemplo. Visibilidad: Atención ve solo globales; un VIP ve globales + las suyas ([[anti-contaminacion]]).</li>\n<li>**Policies:** match estático por `tema ∩ (topics ∪ intent)` + path DB (umbral 0.8). `vip_id` es eje distinto de `scope`. En Atención el path DB fuerza `scope=&#x27;all&#x27;` (nunca una política VIP-scoped). Fallo de DB no tira los hits estáticos.</li>\n<li>**Context:** sigue siendo REAL parcial — `waiting_for_reply_since`, `is_first_message_of_day`, `dia_semana`, `hora_actual` (America/Mexico_City). No usa la tabla `contexts`.</li>\n<li>**Memory / Profile:** no fetch si `vip_id is None`.</li>\n\n<h3>Límites duros</h3>\n\n<li>Ningún Retriever puede importar otro Retriever de tipo distinto.</li>\n<li>Los retrievers devuelven conocimiento estructurado filtrado; nunca mezclan tipos ni deciden si se usará lo recuperado.</li>\n<li>Un retriever nunca devuelve Memoria de otro VIP ([[anti-contaminacion]]).</li>\n\n<div class='prov'>^[docs/SPEC-1.1.md §4.4, docs/REQUERIMIENTOS.md §3.4, src/diana/cognitive/retrievers/]</div>", "wikilinks": ["director-cognitivo", "anti-contaminacion", "anti-contaminacion"]}}, {"id": "article:concepts/comunicacion-con-producto", "label": "Comunicación con Producto", "color": "#4f8ef7", "group": "article", "detail": {"name": "Comunicación con Producto", "type": "article", "typeLabel": "Artículo", "summary": "Regla obligatoria de AGENTS.md §0: el interlocutor del chat **no es un desarrollador** — es el **dueño o dueña de producto**. Toda comunicación agente ↔ usuario usa nivel técnico medio-bajo, lengua...", "tags": "[contrato, concepts, regla-negocio]", "content": "<p>---</p>\n<p>title: Comunicación con Producto</p>\n<p>created: 2026-08-11</p>\n<p>updated: 2026-08-11</p>\n<p>type: concept</p>\n<p>tags: [contrato, regla-negocio]</p>\n<p>sources: [../../AGENTS.md]</p>\n<p>confidence: high</p>\n<p>---</p>\n\n<h2>Comunicación con Producto</h2>\n\n<p>Regla obligatoria de AGENTS.md §0: el interlocutor del chat <b>no es un desarrollador</b> — es el <b>dueño o dueña de producto</b>. Toda comunicación agente ↔ usuario usa nivel técnico medio-bajo, lenguaje claro y práctico.</p>\n\n<h3>Principios</h3>\n\n<li>Hablar de **qué pasa en el producto, qué gana o pierde el negocio, qué control tiene la dueña, qué hay que decidir**.</li>\n<li>Frases cortas y orientadas a la decisión o al resultado.</li>\n<li>Conceptos técnicos inevitables → traducir a impacto de producto (ej. no &quot;middleware fail-closed&quot;: &quot;si no podemos confirmar el estado, por seguridad no mandamos el mensaje&quot;).</li>\n<li>Preguntas en lenguaje de negocio/producto, no de implementación.</li>\n<li>Ante error/bloqueo: qué falló en la práctica, qué se puede hacer ahora, y si hace falta una decisión de la dueña.</li>\n\n<h3>Autocomprobación antes de enviar (AGENTS.md §0.5)</h3>\n\n<li>¿Lo entendería alguien que maneja el producto pero no programa?</li>\n<li>¿Queda claro el impacto en VIP / dueña / control / riesgo?</li>\n<li>¿La pregunta se puede responder sin saber de código?</li>\n<li>Si usé un término técnico, ¿lo traduje al efecto práctico?</li>\n\n<h3>Idioma (AGENTS.md §0.6)</h3>\n\n<p>Todo texto de producto — UI, prompts, seeds, mensajes al VIP, specs — se escribe en <b>español neutro (variante mexicana/neutra)</b>. El <b>español rioplatense (voseo) está prohibido</b>: querés, tenés, hacés, decime, sos, vos, y los imperativos voseantes (Revisá, Elegí, Mirá, Fijate…). Regla de acción inmediata: cualquier texto en voseo encontrado en código, docs, prompts, seeds o DB se corrige en el mismo instante a neutro; ninguna regla que prescriba voseo debe sobrevivir.</p>\n\n<h3>Qué NO cambia esta regla</h3>\n\n<p>El código, tests, commits y docs técnicos siguen en la convención del artefacto (inglés en código por defecto). Los límites de módulo y flujos canónicos siguen siendo de cumplimiento estricto.</p>\n\n<div class='prov'>^[AGENTS.md §0]</div>", "wikilinks": []}}, {"id": "article:concepts/decisor", "label": "Decisor", "color": "#4f8ef7", "group": "article", "detail": {"name": "Decisor", "type": "article", "typeLabel": "Artículo", "summary": "Componente determinista que decide la acción del turno. Trabaja sobre el vector del [[perfil-evaluacion-multidimensional]] + las restricciones de modo (BR-12: los modos son restricciones externas; ...", "tags": "[arquitectura, concepts, contrato], modulo", "content": "<p>---</p>\n<p>title: Decisor</p>\n<p>created: 2026-08-11</p>\n<p>updated: 2026-08-16</p>\n<p>type: concept</p>\n<p>tags: [arquitectura, modulo, contrato]</p>\n<p>sources: [../../docs/REQUERIMIENTOS.md, ../../AGENTS.md, ../../docs/SPEC-1.1.md, ../../src/diana/cognitive/decider.py]</p>\n<p>confidence: high</p>\n<p>---</p>\n\n<h2>Decisor</h2>\n\n<p>Componente determinista que decide la acción del turno. Trabaja sobre el vector del [[perfil-evaluacion-multidimensional]] + las restricciones de modo (BR-12: los modos son restricciones externas; el Decisor propone, los modos filtran).</p>\n\n<li>**Pregunta que responde:** ¿Qué acción tomar?</li>\n<li>**Acciones posibles:** Enviar, Aprobar, Escalar, Consultar doctrina. (Regenerar es residual; el Decisor no la emite.)</li>\n\n<h3>Orden de prioridades (contrato de **acciones**)</h3>\n\n<li>`seguridad &lt; umbral` → **Escalar** (`safety_below_threshold`)</li>\n<li>`needs_policy == true` + sin política + zona gris activa → **Consultar doctrina** (`doctrine_not_found`)</li>\n<li>`risk == &quot;alto&quot;` → **Escalar** (`risk_high`)</li>\n<li>`emotion == &quot;molesta&quot;` → **Escalar** (`frustracion_directa`)</li>\n<li>Naturalidad baja → re-generación **ya ocurrió upstream** (pre-Decisor; el Decisor no emite regenerate)</li>\n<li>Flag `feature_autonomous_mode` Y umbrales `*_min` superados → **Enviar** (`autonomous_ok`)</li>\n<li>Flag autónomo activo pero algún `*_min` no superado → **Aprobar** (`autonomous_below_threshold`)</li>\n<li>Si no → **Aprobar** (`ok_for_human_review`)</li>\n\n<p><code>mode</code> es residual de auditoría: <b>no</b> habilita ni bloquea el send. El único candado de envío es <code>feature_autonomous_mode</code>. El Director pasa <code>mode=&quot;supervised&quot;</code> a propósito.</p>\n\n<h3>Risk vs frustración (live, 2026-08-16)</h3>\n\n<p>El código evalúa <code>risk=alto</code> <b>antes</b> que <code>emotion=molesta</code>. Si un turno cumple ambas, la acción sigue siendo <b>Escalar</b> y el <code>reason</code> es <code>risk_high</code> (la señal más grave y accionable en <code>/traza</code>). AGENTS.md §4.1 aún lista 2b antes que 3; es drift de documento, no de acciones.</p>\n\n<p>La redraft de naturalidad es secuenciación del [[director-cognitivo]] (1×), no un paso de esta matriz.</p>\n\n<h3>Justificaciones registradas</h3>\n\n<li>**Zona gris antes que risk=alto (BR-02 modificado):** la falta de doctrina es causa tratable; resolverla elimina escalaciones futuras. La escalación por risk=alto solo se ejecuta cuando no hay doctrina pendiente.</li>\n<li>**Frustración directa:** `emotion=molesta` escala sin esperar acumulación de riesgo; se evalúa después de zona gris y de risk alto, y antes de send autónomo.</li>\n\n<h3>Reglas de fase</h3>\n\n<li>**Fase 1 (supervisado):** solo approve o escalate. Enviar, consultar doctrina y regenerar deshabilitados.</li>\n<li>**Fase 3+:** send autónomo al final del orden (solo si el flag autónomo está activo y los umbrales se superan). Los hooks de evolución de agente (trust, fático, mood) son **shadow-only** en application: no alteran esta matriz.</li>\n\n<div class='prov'>^[AGENTS.md §4.1, docs/REQUERIMIENTOS.md §3.7, src/diana/cognitive/decider.py]</div>", "wikilinks": ["perfil-evaluacion-multidimensional", "director-cognitivo"]}}, {"id": "article:concepts/detector-emocional", "label": "Detector de Quiebre Emocional", "color": "#4f8ef7", "group": "article", "detail": {"name": "Detector de Quiebre Emocional", "type": "article", "typeLabel": "Artículo", "summary": "Componente transversal de la evolución de agente (v1.2). Detecta señales emocionales fuertes **por turno, sin llamada LLM** (heurística v1 sobre la salida del analyst) y alimenta síntesis de perfil...", "tags": "[modulo, aprendizaje], concepts, riesgo", "content": "<p>---</p>\n<p>title: Detector de Quiebre Emocional</p>\n<p>created: 2026-08-11</p>\n<p>updated: 2026-08-21</p>\n<p>type: concept</p>\n<p>tags: [modulo, riesgo, aprendizaje]</p>\n<p>sources: [../../docs/SPEC-EVOLUCION-AGENTE.md]</p>\n<p>confidence: high</p>\n<p>---</p>\n\n<h2>Detector de Quiebre Emocional</h2>\n\n<p>Componente transversal de la evolución de agente (v1.2). Detecta señales emocionales fuertes <b>por turno, sin llamada LLM</b> (heurística v1 sobre la salida del analyst) y alimenta síntesis de perfil, seguridad del carril rápido y calibración del pipeline.</p>\n\n<li>**Dónde vive:** `emotional_signal_detector` — corre antes del carril rápido de la Fase 2 (mismo paso que el clasificador de turno), no dentro de la cadena del Director.</li>\n<li>**Entrada:** salida del analyst (`emotion`, `urgency`, `risk`, `intent`, `topics`).</li>\n<li>**Tabla:** `emotional_signal_log` — `signal_type`, `intensity`, `should_trigger_synthesis`, `should_escalate_to_owner`, `pipeline_would_have_escalated` (bool nullable), `created_at`.</li>\n\n<h3>Señales (set cerrado, sin &quot;escalada&quot; — eso es decisión del pipeline)</h3>\n\n<div class='tbl'>| Señal | Fuente heurística |</div>\n<div class='tbl'>|---|---|</div>\n<div class='tbl'>| `vulnerabilidad` | emotion ∈ {triste, ansiosa} + intent de apertura personal |</div>\n<div class='tbl'>| `angustia` | emotion ∈ {ansiosa, molesta, triste} + urgency alta + risk medio/alto |</div>\n<div class='tbl'>| `revelacion_de_vida` | topics ∈ {honestidad, tema_pesado, extrañar, reencuentro, conexion} |</div>\n<div class='tbl'>| `ruptura_de_patron` | comparación con baseline (rodante al inicio; `recent_trend` del perfil cuando exista) |</div>\n\n<h3>Umbrales (asimétricos, por diseño)</h3>\n\n<li>`should_trigger_synthesis` &gt;= **0.5** — síntesis de más es barata y de bajo riesgo.</li>\n<li>`should_escalate_to_owner` &gt;= **0.8** — escalación de más satura al owner y erosiona confianza.</li>\n\n<p><b>Constantes fijas con override manual por <code>system_config</code> — nunca auto-calibradas por LLM</b> (lección del incidente de calibración, ver [[calibracion-de-umbrales]]).</p>\n\n<h3>Comportamiento v1</h3>\n\n<li>`angustia`/crisis → saca el turno del carril rápido (reclasifica a emocional/sensible → aprobación del owner).</li>\n<li>La escalación del detector es **shadow-only**: se loguea y compara (`pipeline_would_have_escalated`); no fuerza al Decider. La escalación forzada del Decider **no está implementada** (no es un flag futuro prometido) — el detector mide y registra en shadow; no cambia ninguna decisión.</li>\n<li>Cuando `should_escalate_to_owner=true` pero `pipeline_would_have_escalated=false` → señal valiosa de punto ciego del pipeline; se loguea para revisión periódica en la ficha del VIP.</li>\n\n<p>Relacionado: [[pipeline-cognitivo]], [[perfil-evolutivo]], [[escalacion]].</p>\n\n<div class='prov'>^[docs/SPEC-EVOLUCION-AGENTE.md — componente transversal]</div>\n<div class='prov'>^[docs/ESTADO-PROYECTO.md §Evolución de agente]</div>", "wikilinks": ["calibracion-de-umbrales", "pipeline-cognitivo", "perfil-evolutivo", "escalacion"]}}, {"id": "article:concepts/director-cognitivo", "label": "Director Cognitivo", "color": "#4f8ef7", "group": "article", "detail": {"name": "Director Cognitivo", "type": "article", "typeLabel": "Artículo", "summary": "Componente 100 % código determinista que orquesta el pipeline. **Nunca piensa, nunca escribe, nunca consulta memoria directamente, nunca invoca un LLM para decidir qué hacer.**", "tags": "[arquitectura, concepts, contrato], modulo", "content": "<p>---</p>\n<p>title: Director Cognitivo</p>\n<p>created: 2026-08-11</p>\n<p>updated: 2026-08-11</p>\n<p>type: concept</p>\n<p>tags: [arquitectura, modulo, contrato]</p>\n<p>sources: [../../docs/REQUERIMIENTOS.md, ../../docs/SPEC-1.1.md, ../../AGENTS.md]</p>\n<p>confidence: high</p>\n<p>---</p>\n\n<h2>Director Cognitivo</h2>\n\n<p>Componente 100 % código determinista que orquesta el pipeline. <b>Nunca piensa, nunca escribe, nunca consulta memoria directamente, nunca invoca un LLM para decidir qué hacer.</b></p>\n\n<li>**Pregunta que responde:** ¿Qué necesita este turno?</li>\n<li>**Naturaleza:** código puro (REQ-COG-02, BR-08).</li>\n<li>**Entrada:** Turn en estado received + texto.</li>\n<li>**Salida:** coordinación del pipeline hasta obtener una Decision.</li>\n\n<h3>Cómo opera</h3>\n\n<li>Cortocircuito de escalación por palabras/temas prohibidos (antes del Analista, REQ-COG-16).</li>\n<li>Invoca Analista → obtiene Comprensión.</li>\n<li>Invoca Planificador → obtiene Plan de recuperación.</li>\n<li>Pide al [[capability-registry]] resolver cada capacidad del plan.</li>\n<li>Constructor de Contexto → prompt mínimo dinámico.</li>\n<li>Generador (LLM) → borrador.</li>\n<li>Evaluador (LLM) → [[perfil-evaluacion-multidimensional]].</li>\n<li>[[decisor]] → Decision.</li>\n\n<p>El Director conoce únicamente <b>capacidades</b> (<code>knowledge.memory</code>, <code>knowledge.policy</code>, etc.), no módulos concretos — eso garantiza sustituibilidad total (REQ-COG-03).</p>\n\n<h3>Límites duros</h3>\n\n<li>Nunca consulta un LLM para decidir.</li>\n<li>No conoce aiogram ni la capa Telegram.</li>\n<li>No escribe en Staging ni decide delays.</li>\n<li>La regeneración por naturalidad baja es secuenciación del Director (pre-Decisor), no una acción del [[decisor]] (AGENTS.md §4.1 nota prioridad 4).</li>\n\n<div class='prov'>^[docs/REQUERIMIENTOS.md §3.3, AGENTS.md §2.1]</div>", "wikilinks": ["capability-registry", "perfil-evaluacion-multidimensional", "decisor", "decisor"]}}, {"id": "article:concepts/escalacion", "label": "Escalación", "color": "#4f8ef7", "group": "article", "detail": {"name": "Escalación", "type": "article", "typeLabel": "Artículo", "summary": "El bot **no** debe cerrar el caso: la dueña (o un humano) toma el hilo (REQ-ESC-*). Hay dos vías de escalación.", "tags": "[flujo, concepts, contrato], riesgo", "content": "<p>---</p>\n<p>title: Escalación</p>\n<p>created: 2026-08-11</p>\n<p>updated: 2026-08-11</p>\n<p>type: concept</p>\n<p>tags: [flujo, riesgo, contrato]</p>\n<p>sources: [../../docs/REQUERIMIENTOS.md, ../../AGENTS.md]</p>\n<p>confidence: high</p>\n<p>---</p>\n\n<h2>Escalación</h2>\n\n<p>El bot <b>no</b> debe cerrar el caso: la dueña (o un humano) toma el hilo (REQ-ESC-*). Hay dos vías de escalación.</p>\n\n<h3>1. Cortocircuito determinístico (REQ-COG-16, REQ-ESC-01)</h3>\n\n<p>Palabras/temas prohibidos (pagos, reclamos, crisis, &quot;eres un bot&quot;) disparan la escalación <b>antes del Analista</b> — sin costo de LLM y sin riesgo de que el modelo improvise. El VIP no recibe respuesta automática del flujo normal.</p>\n\n<h3>2. Escalación semántica (REQ-ESC-02)</h3>\n\n<p>El Analista puede señalar <code>risk=alto</code>, o el Evaluador/[[decisor]] escalan a partir del perfil: seguridad baja (prioridad 1 del Decisor) o <code>emotion=molesta</code> (frustración directa, prioridad 2b).</p>\n\n<h3>Ciclo de vida</h3>\n\n<li>La dueña **tria** la escalación: válida, falso positivo, o forzar generación normal (REQ-ESC-04).</li>\n<li>Los falsos positivos se registran para reducir repeticiones indebidas (REQ-ESC-05).</li>\n<li>Queda traza auditable: quién, por qué, veredicto, incluidos los objetos del pipeline (REQ-ESC-06).</li>\n<li>Métrica asociada: tasa de falsos positivos de escalación (REQ-MET-03).</li>\n\n<h3>Jerarquía con la zona gris (BR-02)</h3>\n\n<p>La escalación por <b>seguridad</b> tiene prioridad absoluta sobre la zona gris. La escalación por <b>risk semántico</b> se evalúa después de la zona gris (ver [[decisor]] y [[zona-gris-y-politicas]]).</p>\n\n<div class='prov'>^[docs/REQUERIMIENTOS.md §9.6]</div>", "wikilinks": ["decisor", "decisor", "zona-gris-y-politicas"]}}, {"id": "article:concepts/eventos-temporales", "label": "Eventos temporales", "color": "#4f8ef7", "group": "article", "detail": {"name": "Eventos temporales", "type": "article", "typeLabel": "Artículo", "summary": "Contexto de vida corta que **solo la dueña** escribe para que Diana lo tenga presente un rato (promo del fin de semana, un cumpleaños, un aviso puntual). No es memoria de un VIP ni doctrina permane...", "tags": "[memoria, concepts, operacion, regla-negocio]", "content": "<p>---</p>\n<p>title: Eventos temporales</p>\n<p>created: 2026-08-16</p>\n<p>updated: 2026-08-16</p>\n<p>type: concept</p>\n<p>tags: [memoria, operacion, regla-negocio]</p>\n<p>sources:</p>\n<li>../../src/diana/application/ephemeral_event_service.py</li>\n<li>../../src/diana/application/ephemeral_knowledge.py</li>\n<li>../../alembic/versions/027_ephemeral_events.py</li>\n<p>confidence: high</p>\n<p>---</p>\n\n<h2>Eventos temporales</h2>\n\n<p>Contexto de vida corta que <b>solo la dueña</b> escribe para que Diana lo tenga presente un rato (promo del fin de semana, un cumpleaños, un aviso puntual). No es memoria de un VIP ni doctrina permanente. Vive en <code>ephemeral_events</code> (migración <b>027</b>) y entra al turno como <code>knowledge.ephemeral</code>.</p>\n\n<p>No hay feature flag: el augmenter está <b>siempre</b> cableado. Si no hay eventos vigentes, el mapa de conocimiento no cambia.</p>\n\n<h3>Quick path</h3>\n\n<li>Panel de la dueña → **📅 Eventos temporales** ([[superficie-admin]]).</li>\n<li>«¿Qué le digo a Diana?» + duración (Hoy / 2 días / 3 días / 1 semana / otra fecha).</li>\n<li>Confirmar. Mientras `start_at ≤ ahora &lt; end_at` y no está pausado, cada turno recibe el texto.</li>\n<li>Al vencer, Diana deja de verlo sola: no hay job de limpieza.</li>\n\n<h3>Qué puede inyectar la dueña</h3>\n\n<li>**Texto libre** (`body`): lo que Diana debe tener presente.</li>\n<li>**Ventana** `[start_at, end_at)` (semiabierta).</li>\n<li>**Pausar / reanudar** (reversible; pausado = invisible al augmenter).</li>\n<li>**Modificar** texto o fechas (conserva id y pausa).</li>\n<li>**Terminar antes** (`end_at = ahora`) o **eliminar** la fila.</li>\n\n<p>Duraciones que entiende el asistente: <code>N minutos|horas|días|semanas</code>, <code>hoy</code> (fin del día local), <code>ahora</code>, o <code>YYYY-MM-DD</code> / <code>YYYY-MM-DD HH:MM</code> (naive = zona del servidor). Fechas inválidas se reintentan; no se inventa la ventana.</p>\n\n<p>Los eventos son <b>globales</b> (la tabla no tiene <code>vip_id</code> ni <code>channel_type</code>): aplican a todo turno que pase por el augmenter, VIP o atención.</p>\n\n<h3>Cómo llega al contexto</h3>\n\n<p><code>EphemeralKnowledgeAugmenter</code> (capa application, no un retriever del [[capability-registry]]) lee <code>find_active_at(now)</code> y, si hay filas, añade una copia del mapa con:</p>\n\n<pre>\n{ &quot;knowledge.ephemeral&quot;: { &quot;eventos&quot;: [&quot;promo del fin de semana&quot;] } }\n</pre>\n\n<p>El [[pipeline-cognitivo]] lo emite al final de los bloques de conocimiento, <b>cercado</b> como dato de producto (<code>&lt;&lt;KNOWLEDGE_EPHEMERAL_DATA&gt;&gt;</code>, SEC-INJ-02): nunca como instrucción. Si no hay eventos activos, el mapa original se devuelve intacto.</p>\n\n<h3>Qué no puede contaminar</h3>\n\n<p>Probado en código; no hay regla de producto extra:</p>\n\n<li>No escribe `memories`, examples, policies ni staging. El [[aprendizaje-post-turno]] no lo referencia.</li>\n<li>No pisa `knowledge.profile` ni otras claves: solo añade `knowledge.ephemeral`.</li>\n<li>No muta el mapa de entrada (copia superficial si hay hit).</li>\n<li>No mezcla tipos de conocimiento ni cruza VIPs (no es ficha de VIP; ver [[memoria-vip]] / [[anti-contaminacion]]).</li>\n<li>Escrituras solo si `actor_id` es la dueña (`OwnerAuthError` si no).</li>\n\n<p>Relacionado: [[superficie-admin]], [[anti-contaminacion]], [[pipeline-cognitivo]].</p>\n\n<div class='prov'>^[src/diana/application/ephemeral_event_service.py]</div>\n<div class='prov'>^[src/diana/applica</div>", "wikilinks": ["superficie-admin", "capability-registry", "pipeline-cognitivo", "aprendizaje-post-turno", "memoria-vip", "anti-contaminacion", "superficie-admin", "anti-contaminacion", "pipeline-cognitivo"]}}, {"id": "article:concepts/feature-flags", "label": "Feature Flags", "color": "#4f8ef7", "group": "article", "detail": {"name": "Feature Flags", "type": "article", "typeLabel": "Artículo", "summary": "**Regla de oro (AGENTS.md §1):** comportamientos nuevos van detrás de feature flags. Flag off = el sistema se comporta como en la fase anterior.", "tags": "[operacion, concepts, contrato], decision", "content": "<p>---</p>\n<p>title: Feature Flags</p>\n<p>created: 2026-08-11</p>\n<p>updated: 2026-08-21</p>\n<p>type: concept</p>\n<p>tags: [operacion, decision, contrato]</p>\n<p>sources: [../../src/diana/config/settings.py, ../../.env.example, ../../AGENTS.md]</p>\n<p>confidence: high</p>\n<p>---</p>\n\n<h2>Feature Flags</h2>\n\n<p><b>Regla de oro (AGENTS.md §1):</b> comportamientos nuevos van detrás de feature flags. Flag off = el sistema se comporta como en la fase anterior.</p>\n\n<p>Runtime: pydantic <code>Settings</code> lee env <code>FEATURE_*</code> (campos <code>feature_*</code>). Default de código: <b>todos <code>false</code></b>. Migraciones 003/006 siembran claves en <code>system_config</code>, pero <code>load_feature_flags</code> se removió; el wiring usa <code>settings</code>, no la tabla.</p>\n\n<h3>Inventario (código)</h3>\n\n<h4>Fase 2</h4>\n\n<div class='tbl'>| Flag | Default | Efecto |</div>\n<div class='tbl'>|------|---------|--------|</div>\n<div class='tbl'>| `FEATURE_MEMORY_ENABLED` | false | Retrievers/extracción/backfill de memoria VIP |</div>\n<div class='tbl'>| `FEATURE_GRAY_ZONE_ENABLED` | false | Consulta de doctrina / freeze |</div>\n<div class='tbl'>| `FEATURE_STAGING_ENABLED` | false | Staging de correcciones |</div>\n<div class='tbl'>| `FEATURE_SANDBOX_ENABLED` | false | Sandbox + FakeDelivery |</div>\n\n<h4>Fase 3</h4>\n\n<div class='tbl'>| Flag | Default | Efecto |</div>\n<div class='tbl'>|------|---------|--------|</div>\n<div class='tbl'>| `FEATURE_AUTONOMOUS_MODE` | false | Envío autónomo (flujo 4.8). Sin esto nada se autoenvía. **En `.env`: `false`** (kill-switch L1) |</div>\n<div class='tbl'>| `FEATURE_RECONTACT_ENABLED` | false | Recontacto por silencio (4.9) |</div>\n<div class='tbl'>| `FEATURE_PROMO_ENABLED` | false | Promo no-VIP por trigger exacto (4.10) |</div>\n<div class='tbl'>| `FEATURE_CALIBRATION_ENABLED` | false | Job de calibración (4.11) |</div>\n<div class='tbl'>| `FEATURE_ADVANCED_BEHAVIOR` | false | Split + quirks humanos (4.12) |</div>\n<div class='tbl'>| `FEATURE_PERSONA_ADMIN_ENABLED` | false | Superficie admin de persona |</div>\n\n<h4>Fase 4</h4>\n\n<div class='tbl'>| Flag | Default | Efecto |</div>\n<div class='tbl'>|------|---------|--------|</div>\n<div class='tbl'>| `FEATURE_GENERAL_MODE_ENABLED` | false | Canal atención no-VIP. **En `.env`: `true`** (activo) |</div>\n\n<h4>Feedback de calidad (029)</h4>\n\n<div class='tbl'>| Flag | Default | Efecto |</div>\n<div class='tbl'>|------|---------|--------|</div>\n<div class='tbl'>| `FEATURE_QUALITY_FEEDBACK_ENABLED` | false | Escritura Destacar/Reprender. Retrieval siempre usa `quality`/`vip_id` (defaults = comportamiento pre-flag). **En `.env`: `true`** (activo, 2026-08-21) |</div>\n\n<p>Documentado en <code>.env.example</code>.</p>\n\n<h4>Fase 6 (vínculo Lucien)</h4>\n\n<div class='tbl'>| Flag | Default | Efecto |</div>\n<div class='tbl'>|------|---------|--------|</div>\n<div class='tbl'>| `FEATURE_LINK_ENABLED` | false | Middleware `[LINK]` + `LinkCoordinator`. Requiere `LINK_CHAT_ID`. **En `.env`: `true`** (activo, desplegado 2026-08-21) |</div>\n\n<h4>Evolución de agente (shadow)</h4>\n\n<div class='tbl'>| Flag | Default | Efecto |</div>\n<div class='tbl'>|------|---------|--------|</div>\n<div class='tbl'>| `FEATURE_EMOTIONAL_DETECTOR_ENABLED` | false | Detector emocional → `emotional_signal_log` |</div>\n<div class='tbl'>| `FEATURE_PROFILE_SYNTHESIS_ENABLED` | false | Resíntesis → `vip_profile` + job LLM |</div>\n<div class='tbl'>| `FEATURE_PHATIC_AUTONOMY` | false | Clasificador de turno → `turn_category_log` (solo medición/sombra) |</div>\n<div class='tbl'>| `FEATURE_MOOD_ENGINE` | false | Motor de mood → `vip_mood_state` |</div>\n<div class='tbl'>| `FEATURE_TRUST_BUDGET` | false | Presupuesto de confianza. **Inerte** sin `FEATURE_PHATIC_AUTONOMY` |</div>\n\n<p>Encender evo-agente solo mide/registra. <b>No</b> usa estas flags para entregar mensajes al VIP. En <code>.env</code> de producción están activos en modo</p>", "wikilinks": ["estado-del-proyecto", "modos-de-operacion", "esquema-fase6", "esquema-conocimiento", "calibracion-de-umbrales"]}}, {"id": "article:concepts/memoria-vip", "label": "Memoria VIP", "color": "#4f8ef7", "group": "article", "detail": {"name": "Memoria VIP", "type": "article", "typeLabel": "Artículo", "summary": "Conocimiento procesado del VIP en `memories` (Fase 5: \"Perfil de VIP con Memoria\"). Construye el puente entre el historial crudo (`message_history`, funcional) y la memoria procesada (estaba **vací...", "tags": "[memoria, aprendizaje], concepts", "content": "<p>---</p>\n<p>title: Memoria VIP</p>\n<p>created: 2026-08-11</p>\n<p>updated: 2026-08-11</p>\n<p>type: concept</p>\n<p>tags: [memoria, aprendizaje]</p>\n<p>sources: [../../docs/SPEC-FASE5.md, ../../docs/REQUERIMIENTOS.md]</p>\n<p>confidence: high</p>\n<p>---</p>\n\n<h2>Memoria VIP</h2>\n\n<p>Conocimiento procesado del VIP en <code>memories</code> (Fase 5: &quot;Perfil de VIP con Memoria&quot;). Construye el puente entre el historial crudo (<code>message_history</code>, funcional) y la memoria procesada (estaba <b>vacía: no existía escritor</b>).</p>\n\n<h3>Estructura de la ficha</h3>\n\n<p>Cada sección es una fila de <code>memories</code> con <code>category</code> + embedding + <code>content</code> jsonb, más una fila <code>category=&#x27;perfil&#x27;</code> con la ficha completa (vista/edición, backfill idempotente):</p>\n\n<li>`identidad` — datos personales estables</li>\n<li>`preferencias` — tono y temas que le funcionan</li>\n<li>`comercial` — historial de compra e intereses</li>\n<li>`limites` — temas a evitar</li>\n<li>`sensible` — datos delicados (requieren aprobación de la dueña)</li>\n<li>`perfil` — ficha completa en un JSON</li>\n\n<p>Formato de fila: <code>{texto, tipo, confianza, fuente, turno_id, aprobado_por}</code>.</p>\n\n<h3>Flujos</h3>\n\n<li>**Backfill (inicial):** historial cronológico → LLM por ventanas (200 msgs / 12K chars) → secciones + perfil. Idempotente. **Cola de a uno** con lock global y timer `BACKFILL_INTERVAL_SEC` (3600s) para proteger la cuenta de Telegram. Disparo: botón &quot;Generar perfil&quot; en la ficha del panel + automático al registrar VIP nuevo (decisión 2026-08-05: TODOS los VIPs se perfilan, sin opt-out).</li>\n<li>**Mantenimiento post-turno:** extracción incremental tras turns terminales no-sandbox con `FEATURE_MEMORY_ENABLED`; el LLM recibe un resumen de la ficha para **no repetir** hechos.</li>\n<li>**Dedup:** similitud semántica ≥ 0.85 contra filas del mismo VIP antes de insertar; fusiona si aporta detalle.</li>\n<li>**Control de la dueña:** hechos `sensible` nacen `status=&#x27;pending_owner&#x27;` → DM de aprobación (aprobar/descartar/editar). **Pendiente no se inyecta al contexto** (REQ-MEM-10).</li>\n<li>**Runtime:** `MemoryRetriever` sin cambios de interfaz (umbral 0.75, límite 5, filtrado por `vip_id`); excluye `pending_owner`/`discarded`.</li>\n\n<h3>Reglas</h3>\n\n<li>**BR-15 / REQ-MEM-12:** toda lectura/escritura filtra por `vip_id`; el canal `atencion` ([[canal-atencion]]) nunca toca `memories`; los ejemplos del banco y la memoria son mundos separados ([[anti-contaminacion]]).</li>\n<li>**Límites de módulo:** el escritor vive en `application/` y `learning/` (post-turno), nunca en `cognitive/` ni `behavior/`; `cognitive/` solo lee vía retriever.</li>\n<li>**Trazabilidad:** cada fila tiene `source_turn_id` + `aprobado_por`; la ficha `generado_el`/`actualizado_el`. Migración 022 (`status`, `source_turn_id`, índice `(vip_id, status)`).</li>\n\n<p>Relacionado: [[spec-fase5]], [[perfil-evolutivo]], [[aprendizaje-post-turno]].</p>\n\n<div class='prov'>^[docs/SPEC-FASE5.md]</div>", "wikilinks": ["canal-atencion", "anti-contaminacion", "spec-fase5", "perfil-evolutivo", "aprendizaje-post-turno"]}}, {"id": "article:concepts/modos-de-operacion", "label": "Modos de Operación", "color": "#4f8ef7", "group": "article", "detail": {"name": "Modos de Operación", "type": "article", "typeLabel": "Artículo", "summary": "Los modos son **restricciones externas** al pipeline: el [[decisor]] propone una acción y los modos filtran lo permitido (REQ-COG-10, BR-12).", "tags": "[modo, arquitectura, concepts, contrato]", "content": "<p>---</p>\n<p>title: Modos de Operación</p>\n<p>created: 2026-08-11</p>\n<p>updated: 2026-08-11</p>\n<p>type: concept</p>\n<p>tags: [modo, arquitectura, contrato]</p>\n<p>sources: [../../docs/REQUERIMIENTOS.md, ../../AGENTS.md]</p>\n<p>confidence: high</p>\n<p>---</p>\n\n<h2>Modos de Operación</h2>\n\n<p>Los modos son <b>restricciones externas</b> al pipeline: el [[decisor]] propone una acción y los modos filtran lo permitido (REQ-COG-10, BR-12).</p>\n\n<h3>Modos globales</h3>\n\n<li>**Supervisado:** ningún envío VIP sin acción de la dueña (aprobar o corregir), salvo excepciones explícitas (REQ-MODE-01). Es el modo recomendado al arrancar.</li>\n<li>**Autónomo:** el sistema envía sin aprobación previa, sujeto al Decisor + perfil de evaluación (REQ-MODE-02). Puede notificar a la dueña según reglas sobre dimensiones bajas (REQ-MODE-07).</li>\n\n<h3>Modos y estados complementarios</h3>\n\n<li>**Sandbox:** mismo pipeline cognitivo completo, solo el Behavior Engine es FakeDelivery (REQ-COG-14, BR-06). No contamina el aprendizaje de producción.</li>\n<li>**Pausa de datos por VIP:** el VIP no recibe automatización ni recontacto (BR-05).</li>\n<li>**Congelación:** mientras hay consulta de zona gris abierta, cero señales del bot hacia el VIP (REQ-GAP-03, REQ-NFR-03).</li>\n<li>**Auto-envío por VIP:** excepción per-VIP aunque el global sea supervisado (REQ-MODE-08).</li>\n\n<h3>Distinción clave (BR-01)</h3>\n\n<p><b>Aprobación ≠ escalación ≠ zona gris ≠ nota.</b> Cada una responde una pregunta distinta.</p>\n\n<div class='prov'>^[docs/REQUERIMIENTOS.md §9.5, §12]</div>", "wikilinks": ["decisor"]}}, {"id": "article:concepts/ops-single-instance", "label": "Operación Single-Instance", "color": "#4f8ef7", "group": "article", "detail": {"name": "Operación Single-Instance", "type": "article", "typeLabel": "Artículo", "summary": "Diana corre como **un solo proceso de bot activo**. Varios controles de concurrencia y seguridad son **process-local** (en memoria): correctos bajo esa premisa, **no seguros multi-réplica**.", "tags": "[operacion, concepts, contrato], riesgo", "content": "<p>---</p>\n<p>title: Operación Single-Instance</p>\n<p>created: 2026-08-11</p>\n<p>updated: 2026-08-11</p>\n<p>type: concept</p>\n<p>tags: [operacion, riesgo, contrato]</p>\n<p>sources: [../../docs/OPS_SINGLE_INSTANCE.md]</p>\n<p>confidence: high</p>\n<p>---</p>\n\n<h2>Operación Single-Instance</h2>\n\n<p>Diana corre como <b>un solo proceso de bot activo</b>. Varios controles de concurrencia y seguridad son <b>process-local</b> (en memoria): correctos bajo esa premisa, <b>no seguros multi-réplica</b>.</p>\n\n<h3>Inventario process-local</h3>\n\n<div class='tbl'>| Componente | Ubicación | Qué es local |</div>\n<div class='tbl'>|---|---|---|</div>\n<div class='tbl'>| Chat locks | `ChatLockProvider` / TurnCoordinator | Mapa `asyncio.Lock` por `chat_id`; serializa el turno dentro del proceso |</div>\n<div class='tbl'>| CorrectSessionStore | `telegram/handlers/callbacks.py` | FSM en memoria (owner escribiendo corrección libre, TTL 15 min); **un restart limpia las sesiones** |</div>\n<div class='tbl'>| DedupMiddleware | `telegram/middlewares/dedup.py` | Caché TTL en memoria de ids de update/callback |</div>\n<div class='tbl'>| RateLimitMiddleware | `telegram/middlewares/rate_limit.py` | Ventana deslizante por usuario en proceso; owner exento |</div>\n\n<h3>Consecuencias multi-réplica (si se corre igual)</h3>\n\n<li>Double long-poll / multi-writer: dos procesos pueden recibir y actuar sobre los mismos updates.</li>\n<li>Sesiones Correct divididas: botón en A, texto libre en B → ignorado o sesión equivocada.</li>\n<li>Rate limits/dedup débiles: contadores por proceso, no globales.</li>\n<li>El chat lock no cruza procesos: pipelines concurrentes para el mismo chat pueden correr en paralelo.</li>\n\n<p><b>No tratar como features multi-réplica soportadas.</b> Preferir un único proceso activo (o coordinación real compartida antes de escalar). El lock multi-proceso por chat queda residual (Postgres <code>SELECT … FOR UPDATE</code> / advisory locks).</p>\n\n<div class='prov'>^[docs/OPS_SINGLE_INSTANCE.md]</div>", "wikilinks": []}}, {"id": "article:concepts/perfil-evaluacion-multidimensional", "label": "Perfil de Evaluación Multidimensional", "color": "#4f8ef7", "group": "article", "detail": {"name": "Perfil de Evaluación Multidimensional", "type": "article", "typeLabel": "Artículo", "summary": "El Evaluador produce un **vector de dimensiones independientes**. **No existe score único ni promedio** (REQ-COG-08, BR-09) — es el reemplazo de la antigua \"confianza única\".", "tags": "[arquitectura, concepts, decision]", "content": "<p>---</p>\n<p>title: Perfil de Evaluación Multidimensional</p>\n<p>created: 2026-08-11</p>\n<p>updated: 2026-08-11</p>\n<p>type: concept</p>\n<p>tags: [arquitectura, decision]</p>\n<p>sources: [../../docs/REQUERIMIENTOS.md, ../../docs/SPEC-1.1.md]</p>\n<p>confidence: high</p>\n<p>---</p>\n\n<h2>Perfil de Evaluación Multidimensional</h2>\n\n<p>El Evaluador produce un <b>vector de dimensiones independientes</b>. <b>No existe score único ni promedio</b> (REQ-COG-08, BR-09) — es el reemplazo de la antigua &quot;confianza única&quot;.</p>\n\n<h3>Dimensiones mínimas obligatorias (7)</h3>\n\n<li>**Naturalidad** — ¿suena a la dueña?</li>\n<li>**Precisión** — ¿dice algo falso?</li>\n<li>**Doctrina** — ¿respeta reglas de negocio?</li>\n<li>**Consistencia** — ¿coherente con el historial?</li>\n<li>**Seguridad** — ¿evita promesas/riesgos?</li>\n<li>**Cobertura** — ¿responde lo que preguntaron?</li>\n<li>**Empatía** — ¿tono adecuado al estado del interlocutor?</li>\n\n<h3>Uso</h3>\n\n<p>El [[decisor]] aplica reglas sobre el vector (no sobre un promedio):</p>\n\n<li>Seguridad &lt; umbral → Escalar</li>\n<li>Doctrina &lt; umbral y falta política → Consultar doctrina (zona gris)</li>\n<li>Naturalidad &lt; umbral → re-generación (secuenciada por el Director, pre-Decisor)</li>\n\n<h3>Calibración</h3>\n\n<p>Los umbrales operativos <b>no se confían a los valores absolutos</b> del Evaluador: se calibran empíricamente a partir de la curva de correcciones reales (REQ-EVAL-01..03, ver [[calibracion-de-umbrales]] cuando se ingiera el Pool 2). El sistema registra por turno el perfil completo y si el borrador fue corregido.</p>\n\n<div class='prov'>^[docs/REQUERIMIENTOS.md §3.7, §9.10]</div>", "wikilinks": ["decisor", "calibracion-de-umbrales"]}}, {"id": "article:concepts/perfil-evolutivo", "label": "Perfil Evolutivo", "color": "#4f8ef7", "group": "article", "detail": {"name": "Perfil Evolutivo", "type": "article", "typeLabel": "Artículo", "summary": "El perfil sintetizado del VIP que evoluciona solo (Fase 1 de la evolución de agente). Va más allá de la memoria episódica ([[memoria-vip]]): compila **rasgos estables, tendencia reciente y sensibil...", "tags": "[memoria, aprendizaje, concepts, decision]", "content": "<p>---</p>\n<p>title: Perfil Evolutivo</p>\n<p>created: 2026-08-11</p>\n<p>updated: 2026-08-11</p>\n<p>type: concept</p>\n<p>tags: [memoria, aprendizaje, decision]</p>\n<p>sources: [../../docs/SPEC-EVOLUCION-AGENTE.md]</p>\n<p>confidence: high</p>\n<p>---</p>\n\n<h2>Perfil Evolutivo</h2>\n\n<p>El perfil sintetizado del VIP que evoluciona solo (Fase 1 de la evolución de agente). Va más allá de la memoria episódica ([[memoria-vip]]): compila <b>rasgos estables, tendencia reciente y sensibilidades</b> con versionado y auditoría.</p>\n\n<li>Tablas (migraciones 024+): `vip_profile` (stable_traits, recent_trend, sensitivities, version, synthesis_trigger) y `vip_profile_history` (snapshots con diff_summary).</li>\n\n<h3>Estructura del output de síntesis (JSON forzado)</h3>\n\n<pre>\n{\n  &quot;stable_traits&quot;: { ... },\n  &quot;recent_trend&quot;: { ... },\n  &quot;sensitivities&quot;: [ {&quot;trait&quot;: &quot;...&quot;, &quot;weight&quot;: 0.0-1.0, &quot;evidence_count&quot;: n} ],\n  &quot;changes_summary&quot;: &quot;qué cambió y por qué&quot;,\n  &quot;confidence&quot;: 0.0-1.0\n}\n</pre>\n\n<p>El campo <code>confidence</code> es clave: con baja confianza (pocos hechos nuevos, señales contradictorias) el job <b>no sobrescribe</b> — solo actualiza <code>recent_trend</code> y deja <code>stable_traits</code>/<code>sensitivities</code> intactos (anti-drift por ruido).</p>\n\n<h3>Ciclo de resíntesis</h3>\n\n<li>**Disparadores** (`profile_synthesis_trigger_service`, barato, sin LLM): umbral de volumen de mensajes, inactividad tras sesión activa, señal fuerte, o `detector.should_trigger_synthesis` (ver [[detector-emocional]]).</li>\n<li>**Job** (`profile_synthesis_job` → envuelve `ProfileSynthesisService`; los jobs no ejecutan lógica): input al LLM en 3 bloques explícitos — perfil actual + hechos episódicos nuevos + `feedback_signals` (EA-04: correcciones de turnos fático/emocional con texto completo; el LLM filtra tono/personalidad vs. contenido).</li>\n<li>**Decaimiento:** dentro del mismo prompt, con antigüedad de cada trait/sensitivity; baja el `weight` de lo no reforzado y lo remueve de `sensitivities` (no de `stable_traits`) bajo umbral.</li>\n<li>**Versionado:** guarda el perfil anterior en `vip_profile_history`, incrementa `version`, `changes_summary` como diff legible. El owner audita desde la ficha del VIP (EA-06).</li>\n\n<h3>Reglas duras</h3>\n\n<li>**EA-05 (anti-contaminación):** `stable_traits`/`sensitivities` jamás entran al banco de ejemplos ni al retriever de examples; **solo `recent_trend` (y mood) alimentan el contexto de generación**. Test estilo scans de anti-contaminación.</li>\n<li>Los umbrales de síntesis se calibran de forma asimétrica: generoso para sintetizar, conservador para escalar.</li>\n<li>La Fase 2 (autonomía fática) no sale de shadow hasta que `recent_trend` sea confiable (la calidad de la autonomía depende del contexto de perfil).</li>\n\n<h3>Motor de mood (Fase 3)</h3>\n\n<p><code>vip_mood_state</code> con 3 ejes (juguetón-serio, cálido-distante, energía): promedio móvil con retorno a la base (<code>nuevo = actual*(1-tasa_retorno) + señal*peso</code> + ruido acotado). El mood <b>no genera texto</b>: matiza la selección de variantes en <code>draft_variants.py</code> por distancia entre ejes y tono etiquetado de cada variante. Corre en shadow hasta validar que los ejes se mueven razonablemente.</p>\n\n<p>Relaci</p>", "wikilinks": ["memoria-vip", "detector-emocional", "trust-budget", "spec-evolucion-agente", "memoria-vip"]}}, {"id": "article:concepts/pipeline-cognitivo", "label": "Pipeline Cognitivo", "color": "#4f8ef7", "group": "article", "detail": {"name": "Pipeline Cognitivo", "type": "article", "typeLabel": "Artículo", "summary": "Conjunto de procesos cognitivos especializados que colaboran para tomar una **decisión conversacional**. El sistema no es un chatbot: la inteligencia emerge de la colaboración de componentes, cada ...", "tags": "[arquitectura, concepts, flujo]", "content": "<p>---</p>\n<p>title: Pipeline Cognitivo</p>\n<p>created: 2026-08-11</p>\n<p>updated: 2026-08-11</p>\n<p>type: concept</p>\n<p>tags: [arquitectura, flujo]</p>\n<p>sources: [../../docs/REQUERIMIENTOS.md, ../../docs/SPEC-1.1.md]</p>\n<p>confidence: high</p>\n<p>---</p>\n\n<h2>Pipeline Cognitivo</h2>\n\n<p>Conjunto de procesos cognitivos especializados que colaboran para tomar una <b>decisión conversacional</b>. El sistema no es un chatbot: la inteligencia emerge de la colaboración de componentes, cada uno con una sola pregunta (REQ-NFR-13).</p>\n\n<h3>Flujo canónico (turno VIP normal, REQ-COG-01)</h3>\n\n<pre>\nMensaje → Director → Comprensión (Analista) → Planificación → Recuperación\n(vía Capability Registry) → Construcción de Contexto → Generación → Evaluación\n→ Decisión → Behavior Engine (Entrega) → Aprendizaje (post-turno)\n</pre>\n\n<h3>Componentes y su única pregunta</h3>\n\n<div class='tbl'>| Componente | Pregunta | Naturaleza |</div>\n<div class='tbl'>|---|---|---|</div>\n<div class='tbl'>| [[director-cognitivo]] | ¿Qué necesita este turno? | 100 % código |</div>\n<div class='tbl'>| Analista | ¿Qué está pasando? | LLM → Comprensión |</div>\n<div class='tbl'>| Planificador | ¿Qué recuperar? | Determinista |</div>\n<div class='tbl'>| Recuperadores | ¿Qué sabemos sobre X? | Especializados, interfaz idéntica |</div>\n<div class='tbl'>| Constructor de Contexto | ¿Contexto mínimo necesario? | Composición dinámica |</div>\n<div class='tbl'>| Generador | ¿Cómo respondería la dueña? | LLM, solo redacta |</div>\n<div class='tbl'>| Evaluador | ¿Debemos confiar? | Perfil multidimensional |</div>\n<div class='tbl'>| [[decisor]] | ¿Qué acción tomar? | Reglas sobre vector + modo |</div>\n<div class='tbl'>| [[behavior-engine]] | ¿Cómo se actúa el mensaje? | Infraestructura, fuera de la cognición |</div>\n<div class='tbl'>| Aprendizaje | ¿Qué aprendimos? | Siempre post-turno |</div>\n\n<h3>Variantes del pipeline</h3>\n\n<li>**Turno VIP normal:** completo.</li>\n<li>**Sandbox:** completo, solo el Behavior Engine es FakeDelivery.</li>\n<li>**Recontacto por silencio:** reducido (sin Analista ni Planificador; recupera memoria + políticas).</li>\n<li>**Escalación por palabra prohibida:** cortocircuito determinístico antes del Analista.</li>\n\n<h3>Objeto de Comprensión</h3>\n\n<p>Salida estructurada del Analista que es el <b>lenguaje interno</b> del sistema: <code>intent</code>, <code>topics</code>, <code>emotion</code>, <code>urgency</code>, <code>risk</code> y flags <code>needs_*</code> por tipo de conocimiento. Todo lo demás depende de él.</p>\n\n<div class='prov'>^[docs/REQUERIMIENTOS.md §3.2-3.5, docs/SPEC-1.1.md §2]</div>", "wikilinks": ["director-cognitivo", "decisor", "behavior-engine"]}}, {"id": "article:concepts/principio-rector", "label": "Principio Rector", "color": "#4f8ef7", "group": "article", "detail": {"name": "Principio Rector", "type": "article", "typeLabel": "Artículo", "summary": "**El sistema no genera respuestas. El sistema toma decisiones. Las respuestas son únicamente una consecuencia de esas decisiones.**", "tags": "[arquitectura, concepts, decision]", "content": "<p>---</p>\n<p>title: Principio Rector</p>\n<p>created: 2026-08-11</p>\n<p>updated: 2026-08-11</p>\n<p>type: concept</p>\n<p>tags: [arquitectura, decision]</p>\n<p>sources: [../../docs/REQUERIMIENTOS.md, ../../docs/SPEC-1.1.md]</p>\n<p>confidence: high</p>\n<p>---</p>\n\n<h2>Principio Rector</h2>\n\n<p><b>El sistema no genera respuestas. El sistema toma decisiones. Las respuestas son únicamente una consecuencia de esas decisiones.</b></p>\n\n<p>Es la regla inamovible sobre la que se construye todo DianaV2 (SPEC-1.1 §0). El LLM es un razonador especializado dentro de un pipeline cognitivo, nunca el director del sistema.</p>\n\n<h3>Obligaciones derivadas</h3>\n\n<li>[[director-cognitivo]] es 100 % determinista: nunca pregunta a un LLM &quot;¿qué hago?&quot;.</li>\n<li>Especialización: cada componente responde una sola pregunta ([[pipeline-cognitivo]]).</li>\n<li>Explicabilidad total: los objetos intermedios se persisten para reconstruir cualquier decisión.</li>\n<li>Sustituibilidad: vía [[capability-registry]], ningún componente conoce a otro concreto.</li>\n<li>Anti-contaminación: la Memoria de un VIP nunca se convierte en few-shot general ([[anti-contaminacion]]).</li>\n\n<h3>Reglas de negocio que lo protegen</h3>\n\n<li>BR-08: El Director nunca pregunta a un LLM &quot;qué hacer&quot;. Solo orquesta.</li>\n<li>BR-09: No existe score único de confianza; el Decisor trabaja sobre el vector ([[perfil-evaluacion-multidimensional]]).</li>\n<li>BR-11: El aprendizaje ocurre siempre después del turno ([[aprendizaje-post-turno]]).</li>\n\n<div class='prov'>^[docs/REQUERIMIENTOS.md §3.11]</div>", "wikilinks": ["director-cognitivo", "pipeline-cognitivo", "capability-registry", "anti-contaminacion", "perfil-evaluacion-multidimensional", "aprendizaje-post-turno"]}}, {"id": "article:concepts/trust-budget", "label": "Trust Budget", "color": "#4f8ef7", "group": "article", "detail": {"name": "Trust Budget", "type": "article", "typeLabel": "Artículo", "summary": "Presupuesto de confianza por VIP y por categoría de turno (EA-01). Es la **fuente única de la decisión conductual**: reemplaza la habilitación global por VIP del `AutonomousModeService`, que queda ...", "tags": "[decision, aprendizaje, concepts, modo, riesgo]", "content": "<p>---</p>\n<p>title: Trust Budget</p>\n<p>created: 2026-08-11</p>\n<p>updated: 2026-08-21</p>\n<p>type: concept</p>\n<p>tags: [decision, aprendizaje, modo, riesgo]</p>\n<p>sources: [../../docs/SPEC-EVOLUCION-AGENTE.md]</p>\n<p>confidence: high</p>\n<p>---</p>\n\n<h2>Trust Budget</h2>\n\n<p>Presupuesto de confianza por VIP y por categoría de turno (EA-01). Es la <b>fuente única de la decisión conductual</b>: reemplaza la habilitación global por VIP del <code>AutonomousModeService</code>, que queda como infraestructura (master switch + umbrales de evaluación).</p>\n\n<li>Tabla: `vip_trust_budget` — `vip_id`, `turn_category`, `trust_score` (0..1), `correction_count`, `autonomous_count`, `last_correction_at`.</li>\n<li>Categorías de turno (de `turn_category_log`): `phatic` | `informational` | `emotional` | `sensitive`.</li>\n\n<h3>Cálculo (asimétrico por diseño, SPEC-EVOLUCION-AGENTE §5.1)</h3>\n\n<pre>\nsi autonomo_sin_correccion: trust_score += incremento_pequeño\nsi owner_corrige:           trust_score -= decremento_mayor; correction_count += 1\n</pre>\n\n<p>Arranca en un valor bajo por defecto. El <b>castigo pesa más que el premio</b>: el sistema es conservador por diseño. Se actualiza <b>solo por eventos</b> (correcciones / autónomos sin corrección) — la calibración LLM jamás lo toca.</p>\n\n<h3>Doble puerta del autoenvío (EA-01)</h3>\n\n<pre>\nautoenviar = (trust_score[categoria] &gt;= umbral) AND (evaluacion del turno &gt;= minimos del Decider)\n</pre>\n\n<p><b>Estado de cableado:</b> la doble puerta <b>sí está cableada</b> tras <code>FEATURE_AUTONOMOUS_MODE</code>, pero <b>deshabilitada</b> por el kill-switch L1 (<code>turn_orchestrator.py</code> ~304/2549, <code>recontact_service.py</code> ~209). Con <code>FEATURE_AUTONOMOUS_MODE=false</code> solo se acumula medición shadow (trust budget por VIP/categoría); nada se autoenvía.</p>\n\n<h3>Reglas</h3>\n\n<li>**EA-03 (regla dura):** la categoría `sensitive` nunca entra en autonomía, sin importar el trust_score — siempre aprobación del owner.</li>\n<li>**Fase 2 (carril rápido fático):** para turnos `phatic`, 3 filtros baratos antes de autoenviar: (1) clasificador seguro, (2) sin trigger forbidden, (3) chequeo de seguridad del borrador generado (EA-02). El trust budget para esa categoría debe superar el umbral (arranque conservador, ej. 0.9).</li>\n<li>**Fase 5.2:** para turnos de pipeline completo, alta dispersión entre las 7 dimensiones del [[perfil-evaluacion-multidimensional]] → tratar como baja confianza y no autoenviar aunque el trust_score sea alto.</li>\n<li>El owner ve la sección &quot;Confianza&quot; en la ficha del VIP (EA-06): score por categoría, tendencia y últimas correcciones.</li>\n\n<p>Relacionado: [[decisor]], [[modos-de-operacion]], [[spec-evolucion-agente]].</p>\n\n<div class='prov'>^[docs/SPEC-EVOLUCION-AGENTE.md §5, EA-01..03]</div>\n<div class='prov'>^[docs/ESTADO-PROYECTO.md §3 — autoenvío deshabilitado]</div>", "wikilinks": ["perfil-evaluacion-multidimensional", "decisor", "modos-de-operacion", "spec-evolucion-agente"]}}, {"id": "article:concepts/vinculo-lucien", "label": "Vínculo Lucien → Diana", "color": "#4f8ef7", "group": "article", "detail": {"name": "Vínculo Lucien → Diana", "type": "article", "typeLabel": "Artículo", "summary": "Cuando Lucien saca a alguien del Canal VIP, Diana **no lo da de baja sola**. Comprueba si esa persona es VIP suyo y le pregunta a la dueña. La llave es `FEATURE_LINK_ENABLED` (default `false` en có...", "tags": "[flujo, concepts, contrato, operacion]", "content": "<p>---</p>\n<p>title: Vínculo Lucien → Diana</p>\n<p>created: 2026-08-16</p>\n<p>updated: 2026-08-21</p>\n<p>type: concept</p>\n<p>tags: [flujo, contrato, operacion]</p>\n<p>sources: [../../docs/SPEC-FASE6.md, ../../src/diana/application/link.py]</p>\n<p>confidence: high</p>\n<p>---</p>\n\n<h2>Vínculo Lucien → Diana</h2>\n\n<p>Cuando Lucien saca a alguien del Canal VIP, Diana <b>no lo da de baja sola</b>. Comprueba si esa persona es VIP suyo y le pregunta a la dueña. La llave es <code>FEATURE_LINK_ENABLED</code> (default <code>false</code> en código; <b>activo en <code>.env</code></b>: <code>FEATURE_LINK_ENABLED=true</code>, 2026-08-21). La integración está <b>desplegada y verificada E2E</b> (bot-to-bot DM, aceptación real pasada). Contrato: [[spec-fase6]].</p>\n\n<h3>Quick path</h3>\n\n<li>Llega un mensaje de coordinación con prefijo `[LINK]` al chat `LINK_CHAT_ID`.</li>\n<li>El middleware lo consume **antes** de detectar dueña / auth / freeze — no entra al pipeline ni a `message_history`.</li>\n<li>Si el `user_id` es un VIP **activo** → DM a la dueña con 3 botones. Si no → se registra y termina.</li>\n<li>La dueña elige. El mensaje pierde los botones.</li>\n\n<h3>Qué consume Diana</h3>\n\n<p>Una línea, JSON estricto. Campos que el middleware exige: <code>event</code> = <code>vip_kicked</code>, <code>event_id</code> (texto no vacío), <code>user_id</code>, <code>reason</code> (texto no vacío). Opcionales: <code>username</code>, <code>channel_id</code>, <code>channel_name</code>.</p>\n\n<pre>\n[LINK] {&quot;v&quot;:1,&quot;event&quot;:&quot;vip_kicked&quot;,&quot;event_id&quot;:&quot;&lt;uuid&gt;&quot;,&quot;user_id&quot;:123,&quot;username&quot;:&quot;@ana&quot;,&quot;reason&quot;:&quot;admin_revoke&quot;,&quot;ts&quot;:1789123456}\n</pre>\n\n<p>Lucien puede mandar el <code>@</code> en <code>username</code>; el aviso lo normaliza (<code>Ana @ana</code>, nunca <code>@@ana</code>).</p>\n\n<h3>Botones de la dueña</h3>\n\n<p>Texto del aviso (español neutro): «El suscriptor {nombre} ha sido expulsado del Canal VIP. ¿Quieres inhabilitarlo aquí?»</p>\n\n<div class='tbl'>| Botón | Acción en `vips` | Estado en `link_events` |</div>\n<div class='tbl'>|---|---|---|</div>\n<div class='tbl'>| ❌ Expulsar | `is_active = false` (baja suave; el registro se conserva) | `decided_expel` |</div>\n<div class='tbl'>| 🚫 Inhabilitar | `frozen_until` = fecha lejana (default 2099-12-31 UTC) | `decided_disable` |</div>\n<div class='tbl'>| ✅ Mantener | sin cambios | `decided_keep` |</div>\n\n<p>Un VIP pausado o congelado <b>sigue siendo VIP</b>: si <code>is_active</code> es true, el aviso llega. Si el VIP ya no aplica al pulsar (carrera, ya inactivo, acción desconocida) → «ya no aplica» y estado <code>noop</code>.</p>\n\n<h3>Fail-closed y anti-contaminación</h3>\n\n<li>Con `FEATURE_LINK_ENABLED` activo, sin `LINK_CHAT_ID` configurado, o sin coordinator: el mensaje sigue de largo; cero comportamiento nuevo.</li>\n<li>Mismo `event_id` otra vez → no se vuelve a notificar (dedup UNIQUE + `create` idempotente).</li>\n<li>JSON inválido, `event` distinto, ids no finitos (`OverflowError`) → log `link_malformed`, se consume, no crashea, no llega al orquestador.</li>\n<li>Error real del coordinator **no** se disfraza de malformado: sube al `ErrorHandlerMiddleware`.</li>\n<li>Solo la dueña puede pulsar los botones (`link:*` owner-gated, antes del catch-all).</li>\n<li>El chat de coordinación **nunca** entra a `message_history`, al [[pipeline-cognitivo]] ni al [[aprendizaje-post-turno]].</li>\n\n<p>Relacionado: [[feature-flags]], [[modos-de-operacion]], [[anti-contaminacion]].</p>\n\n<div class='prov'>^[docs/SPEC-FASE6.md]</div>\n<div class='prov'>^[src/diana/application/link.py]</div>\n<div class='prov'>^[docs/ESTADO-PROYECTO.md §Fase 6]</div>", "wikilinks": ["spec-fase6", "pipeline-cognitivo", "aprendizaje-post-turno", "feature-flags", "modos-de-operacion", "anti-contaminacion"]}}, {"id": "article:concepts/zona-gris-y-politicas", "label": "Zona Gris y Políticas", "color": "#4f8ef7", "group": "article", "detail": {"name": "Zona Gris y Políticas", "type": "article", "typeLabel": "Artículo", "summary": "La zona gris es el mecanismo para cuando falta una **regla de negocio reutilizable** (doctrina): se consulta a la dueña y la respuesta se **destila** en una política estructurada (REQ-GAP-*).", "tags": "[politica, aprendizaje, concepts, flujo]", "content": "<p>---</p>\n<p>title: Zona Gris y Políticas</p>\n<p>created: 2026-08-11</p>\n<p>updated: 2026-08-16</p>\n<p>type: concept</p>\n<p>tags: [politica, aprendizaje, flujo]</p>\n<p>sources: [../../docs/REQUERIMIENTOS.md, ../../AGENTS.md, ../../src/diana/application/gray_zone_service.py, ../../src/diana/application/turn_orchestrator.py]</p>\n<p>confidence: high</p>\n<p>---</p>\n\n<h2>Zona Gris y Políticas</h2>\n\n<p>La zona gris es el mecanismo para cuando falta una <b>regla de negocio reutilizable</b> (doctrina): se consulta a la dueña y la respuesta se <b>destila</b> en una política estructurada (REQ-GAP-*).</p>\n\n<h3>Flujo</h3>\n\n<li>El Analista indica `needs_p
