", "type": "article", "typeLabel": "Artículo", "summary": "Módulo de aprendizaje, **siempre post-turno y controlado** (ver [[aprendizaje-post-turno]]).", "tags": "[modulo, aprendizaje, contrato], entities — módulos, entities/modulos", "content": "<p>---</p>\n<p>title: Learning</p>\n<p>created: 2026-08-11</p>\n<p>updated: 2026-08-11</p>\n<p>type: entity</p>\n<p>tags: [modulo, aprendizaje, contrato]</p>\n<p>sources: [../../AGENTS.md, ../../docs/SPEC-1.1.md]</p>\n<p>confidence: high</p>\n<p>---</p>\n\n<h2>Learning</h2>\n\n<p>Módulo de aprendizaje, <b>siempre post-turno y controlado</b> (ver [[aprendizaje-post-turno]]).</p>\n\n<li>**Pregunta que responde:** ¿Qué aprendimos de este turno?</li>\n<li>**Puede:** extraer candidatos, escribir en Staging, destilar políticas, actualizar métricas, calibrar umbrales.</li>\n<li>**Nunca puede:** ejecutarse durante el pipeline de decisión, promover automáticamente a banco vivo.</li>\n\n<h3>Subcomponentes (SPEC-1.1 §11)</h3>\n\n<li>`extractor.py` — extracción de hechos/candidatos (Fase 2).</li>\n<li>`staging.py` — gestión del Staging Area (Fase 2).</li>\n<li>`policy_distiller.py` — destilación de respuestas de zona gris en políticas estructuradas (Fase 2).</li>\n<li>`metrics.py` — métricas agregadas de aprendizaje (Fase 3).</li>\n\n<h3>Límites duros</h3>\n\n<li>**Prohibido** que Learning sea llamado desde dentro del Director o del pipeline de decisión (AGENTS.md §2.2).</li>\n<li>La calibración de umbrales solo se ejecuta como job programado, nunca dentro del pipeline (AGENTS.md §4.5, ver [[feature-flags]]).</li>\n\n<h3>Implementación real (2026-08)</h3>\n\n<p><code>learning/</code> tiene 1 archivo real: <code>post_turn.py</code> — &quot;Post-turn learning for F1: TRACE_KEYS completeness check only (no Staging)&quot;. El grueso del aprendizaje vive en <code>application/</code> (staging_service, memory_extraction_service, calibration_service) y en jobs — el módulo learning quedó mínimo; el staging se opera desde la capa de aplicación, respetando la regla post-turno.</p>\n\n<div class='prov'>^[src/diana/learning/*, src/diana/application/staging_service.py, AGENTS.md §2.1]</div>", "wikilinks": ["aprendizaje-post-turno", "feature-flags"]}}, {"id": "article:entities/modulos/llm-provider", "label": "LLM Provider", "color": "#4f8ef7", "group": "article", "detail": {"name": "LLM Provider", "type": "article", "typeLabel": "Artículo", "summary": "Abstracción de proveedores de modelo de lenguaje (ADR-006). Interfaz abstracta con **hot-swap** (REQ-ADM-03): cambiar proveedor/modelo en caliente sin tocar el resto del sistema.", "tags": "[modulo, decision], entities — módulos, entities/modulos", "content": "<p>---</p>\n<p>title: LLM Provider</p>\n<p>created: 2026-08-11</p>\n<p>updated: 2026-08-11</p>\n<p>type: entity</p>\n<p>tags: [modulo, decision]</p>\n<p>sources: [../../AGENTS.md, ../../docs/SPEC-1.1.md]</p>\n<p>confidence: high</p>\n<p>---</p>\n\n<h2>LLM Provider</h2>\n\n<p>Abstracción de proveedores de modelo de lenguaje (ADR-006). Interfaz abstracta con <b>hot-swap</b> (REQ-ADM-03): cambiar proveedor/modelo en caliente sin tocar el resto del sistema.</p>\n\n<li>**Pregunta que responde:** ¿Cómo hablo con el modelo?</li>\n<li>**Puede:** `generate` y `generate_structured`.</li>\n<li>**Nunca puede:** contener prompts de negocio, decidir umbrales, conocer VIP.</li>\n\n<h3>Proveedores</h3>\n\n<li>**Primario:** DeepSeek (LLM principal del sistema).</li>\n<li>**Secundario:** Anthropic (Claude) — respaldo configurable.</li>\n\n<h3>Reglas</h3>\n\n<li>El Cognitive Core depende de la interfaz, no del proveedor concreto.</li>\n<li>Los prompts de negocio viven en el Constructor de Contexto ([[pipeline-cognitivo]]), no en el provider.</li>\n<li>Generación estructurada (Pydantic v2) para objetos como la Comprensión y el [[perfil-evaluacion-multidimensional]].</li>\n\n<h3>Implementación real (2026-08)</h3>\n\n<p><code>llm/</code> tiene 2 archivos: <code>deepseek.py</code> (cliente OpenAI-compatible vía httpx, solo I/O) y <code>fake.py</code> (FakeLLM scriptable para tests). <b>Solo DeepSeek está implementado</b> — Anthropic queda como respaldo de diseño no implementado. La generación estructurada (Pydantic) alimenta Comprensión y perfil de evaluación.</p>\n\n<div class='prov'>^[src/diana/llm/*, docs/SPEC-1.1.md §1]</div>", "wikilinks": ["pipeline-cognitivo", "perfil-evaluacion-multidimensional"]}}, {"id": "article:entities/modulos/telegram-layer", "label": "Telegram Layer", "color": "#4f8ef7", "group": "article", "detail": {"name": "Telegram Layer", "type": "article", "typeLabel": "Artículo", "summary": "Capa de adaptación con Telegram (aiogram 3.x, Business Connection). Es la puerta de entrada y salida del sistema.", "tags": "[modulo, contrato], entities — módulos, entities/modulos", "content": "<p>---</p>\n<p>title: Telegram Layer</p>\n<p>created: 2026-08-11</p>\n<p>updated: 2026-08-11</p>\n<p>type: entity</p>\n<p>tags: [modulo, contrato]</p>\n<p>sources: [../../AGENTS.md, ../../docs/SPEC-1.1.md]</p>\n<p>confidence: high</p>\n<p>---</p>\n\n<h2>Telegram Layer</h2>\n\n<p>Capa de adaptación con Telegram (aiogram 3.x, Business Connection). Es la puerta de entrada y salida del sistema.</p>\n\n<li>**Pregunta que responde:** ¿Cómo entro y salgo de Telegram?</li>\n<li>**Puede:** recibir updates, enviar mensajes, middlewares de short-circuit.</li>\n<li>**Nunca puede:** decidir qué decir, invocar LLM, escribir en tablas de conocimiento.</li>\n\n<h3>Middlewares (SPEC-1.1 §2)</h3>\n\n<li>**Auth:** ¿está en allowlist? (REQ-AUTH-01)</li>\n<li>**ForbiddenWords:** cortocircuito de escalación por palabras/temas prohibidos (Fase 1, ver [[escalacion]])</li>\n<li>**FreezeCheck:** ¿está congelado por zona gris? (Fase 2, ver [[zona-gris-y-politicas]])</li>\n\n<h3>Estructura prevista (SPEC-1.1 §11)</h3>\n\n<p><code>telegram/handlers/</code> (business.py, admin.py, callbacks.py), <code>telegram/middlewares/</code> (auth, forbidden, freeze), <code>telegram/keyboards.py</code>.</p>\n\n<h3>Reglas de dependencia</h3>\n\n<li>Telegram Layer → Turn Coordinator (nunca directo al Cognitive Core).</li>\n<li>El mensaje saliente al VIP se envía en nombre de la dueña vía la conexión de negocio (REQ-AUTH-04, REQ-NFR-09) — nunca como un bot con otro nombre.</li>\n\n<h3>Implementación real (2026-08)</h3>\n\n<p><code>telegram/</code> tiene 24 archivos:</p>\n\n<li>**Handlers** (8): `business.py` (mensajes VIP), `admin.py`, `menu.py`, `callbacks.py` (keyboards de borradores), `doctrine.py` (zona gris `g:`), `staging.py`, `memory_approval.py` (aprobación de hechos sensibles F5), `persona_admin.py`, `business_connection.py`.</li>\n<li>**Middlewares** (8): `auth.py`, `forbidden.py`, `freeze_middleware.py`, `owner.py`, `rate_limit.py`, `dedup.py`, `business_connection.py`, `error_handler.py`, `logging.py`.</li>\n<li>**Otros:** `actuator.py` (adaptador aiogram del puerto de actuación), `notifier.py` (DMs a la dueña), `keyboards.py` (callback_data ≤ 64 bytes), `health.py` (probe /health), `setup.py`.</li>\n\n<div class='prov'>^[src/diana/telegram/*, AGENTS.md §2.1]</div>", "wikilinks": ["escalacion", "zona-gris-y-politicas"]}}, {"id": "article:entities/modulos/turn-coordinator", "label": "Turn Coordinator", "color": "#4f8ef7", "group": "article", "detail": {"name": "Turn Coordinator", "type": "article", "typeLabel": "Artículo", "summary": "Módulo de la capa Application que **serializa por chat_id** y garantiza que solo exista **un turno no terminal** por chat (REQ-NFR-02, REQ-VIP-06). Principio rector nº 7: \"El Turn Coordinator garan...", "tags": "[modulo, contrato, entities — módulos, entities/modulos, flujo]", "content": "<p>---</p>\n<p>title: Turn Coordinator</p>\n<p>created: 2026-08-11</p>\n<p>updated: 2026-08-11</p>\n<p>type: entity</p>\n<p>tags: [modulo, contrato, flujo]</p>\n<p>sources: [../../AGENTS.md, ../../docs/SPEC-1.1.md]</p>\n<p>confidence: high</p>\n<p>---</p>\n\n<h2>Turn Coordinator</h2>\n\n<p>Módulo de la capa Application que <b>serializa por chat_id</b> y garantiza que solo exista <b>un turno no terminal</b> por chat (REQ-NFR-02, REQ-VIP-06). Principio rector nº 7: &quot;El Turn Coordinator garantiza la serialización por chat&quot;.</p>\n\n<li>**Pregunta que responde:** ¿Qué turno está vivo?</li>\n<li>**Puede:** serializar por chat, gestionar la máquina de estados del Turn, cancelar entregas obsoletas.</li>\n<li>**Nunca puede:** decidir qué decir, invocar LLM, tocar memoria persistente.</li>\n\n<h3>Máquina de estados del Turn</h3>\n\n<pre>\n[received] → (cortocircuito) → [escalated] (TERMINAL)\n[received] → [analyzing] → [planning] → [retrieving] → [building_context]\n           → [generating] → [evaluating] → [deciding]\n           → [pending_approval] → (aprueba) → [delivered] (TERMINAL)\n                               → (descarta/escala) → [escalated] (TERMINAL)\n                               → (nuevo msg del VIP) → [superseded] (TERMINAL)\n</pre>\n\n<p><b>Invariante crítica:</b> solo un Turn no terminal (fuera de <code>superseded|delivered|failed|escalated</code>) por chat_id. Implementación sugerida: <code>SELECT ... FOR UPDATE</code> sobre <code>turns</code> o cola FIFO en memoria por chat (SPEC-1.1 §3, decisión abierta nº 2).</p>\n\n<h3>Reglas de dependencia</h3>\n\n<li>Recibe de la capa Telegram (middlewares) y orquesta hacia [[pipeline-cognitivo]].</li>\n<li>Prohibido **by-passear** el Turn Coordinator (AGENTS.md §2.2).</li>\n\n<div class='prov'>^[docs/SPEC-1.1.md §3, AGENTS.md §2.1]</div>", "wikilinks": ["pipeline-cognitivo"]}}, {"id": "article:entities/specs/agents-md", "label": "AGENTS.md", "color": "#4f8ef7", "group": "article", "detail": {"name": "AGENTS.md", "type": "article", "typeLabel": "Artículo", "summary": "Documento de operación para agentes de desarrollo (v1.3 — Fase 3 Producto Completo). Define **límites duros de módulo y flujos canónicos que ningún agente (humano o IA) puede violar** al modificar ...", "tags": "[spec, contrato, entities — specs, entities/specs, operacion]", "content": "<p>---</p>\n<p>title: AGENTS.md</p>\n<p>created: 2026-08-11</p>\n<p>updated: 2026-08-11</p>\n<p>type: entity</p>\n<p>tags: [spec, contrato, operacion]</p>\n<p>sources: [../../AGENTS.md]</p>\n<p>confidence: high</p>\n<p>---</p>\n\n<h2>AGENTS.md</h2>\n\n<p>Documento de operación para agentes de desarrollo (v1.3 — Fase 3 Producto Completo). Define <b>límites duros de módulo y flujos canónicos que ningún agente (humano o IA) puede violar</b> al modificar el código.</p>\n\n<h3>Contenido clave</h3>\n\n<li>**§0 Comunicación con el usuario:** reglas de [[comunicacion-con-producto]] y español neutro obligatorio.</li>\n<li>**§1 Propósito y principios rectores:** los 7 innegociables (Director determinista, una pregunta por componente, Behavior fuera de la cognición, aprendizaje post-turno, anti-contaminación, decisión reconstruible, Turn Coordinator serializa).</li>\n<li>**§2 Mapa de módulos y límites duros:** capas, preguntas, qué puede/nunca puede hacer cada módulo; reglas de dependencia unidireccionales y prohibiciones explícitas.</li>\n<li>**§3 Flujos canónicos por fase:** 4.1-4.12 (turno normal, cortocircuito, cancelación, memoria, zona gris, staging, sandbox, autónomo, recontacto, promo, calibración, behavior avanzado).</li>\n<li>**§4 Contratos críticos:** orden de prioridades del [[decisor]], BehaviorEngine, RecontactService, PromoService, CalibrationService.</li>\n<li>**§5 Reglas operativas por feature** y §6 checklist de revisión para PRs.</li>\n<li>**§7 Prohibiciones explícitas** con su razón; §8 cómo evolucionar el documento; §9 relación con los otros docs.</li>\n\n<h3>Regla de evolución</h3>\n\n<p>Cualquier cambio de límite de módulo o flujo canónico se documenta <b>primero aquí y después en el código</b>. Cambios solo de implementación interna no requieren modificar este archivo.</p>\n\n<div class='prov'>^[AGENTS.md]</div>", "wikilinks": ["comunicacion-con-producto", "decisor"]}}, {"id": "article:entities/specs/changelog", "label": "Changelog", "color": "#4f8ef7", "group": "article", "detail": {"name": "Changelog", "type": "article", "typeLabel": "Artículo", "summary": "Historial de cambios del sistema (CHANGELOG.md).", "tags": "[estado, entities — specs, entities/specs, operacion]", "content": "<p>---</p>\n<p>title: Changelog</p>\n<p>created: 2026-08-11</p>\n<p>updated: 2026-08-11</p>\n<p>type: entity</p>\n<p>tags: [estado, operacion]</p>\n<p>sources: [../../CHANGELOG.md]</p>\n<p>confidence: high</p>\n<p>---</p>\n\n<h2>Changelog</h2>\n\n<p>Historial de cambios del sistema (CHANGELOG.md).</p>\n\n<h3>Evolución de agente (shadow) — 2026-08-07</h3>\n\n<li>Motor de observación completo en modo shadow: señales emocionales, auto-clasificación por turno, mood 3 ejes, trust por VIP (ver [[detector-emocional]], [[perfil-evolutivo]], [[trust-budget]]).</li>\n<li>Eventos de corrección estructurados; purga automática TTL (housekeeping).</li>\n<li>El clasificador pondera contenido sensible/personal primero.</li>\n\n<h3>Funcionalidades acumuladas</h3>\n\n<li>**Memoria automática** y **perfiles VIP** desde el historial ([[memoria-vip]]).</li>\n<li>**Canal de atención** no-VIP con escalación real ([[canal-atencion]]).</li>\n<li>Freeze/pausa de VIP, menú rediseñado, registro de VIP por reenvío.</li>\n<li>Staging con aprobación de la dueña ([[aprendizaje-post-turno]]).</li>\n<li>Dashboard de la dueña (`/resumen`, `/metricas`), trazabilidad paso a paso.</li>\n<li>Ciclo de atención de 30 días + seguimiento proactivo no-VIP.</li>\n<li>Seguimiento autónomo post-respuesta, manejo de mensajes editados, recuperación resiliente tras reinicio, sandbox.</li>\n\n<h3>Mejoras y seguridad</h3>\n\n<li>Historial rápido en conversaciones largas; entrega human-like por modo.</li>\n<li>Español neutro consistente, sin dialecto ni slang (ver [[comunicacion-con-producto]]).</li>\n<li>Seguridad: los errores de memoria no exponen contenido crudo; sanitización de prompts; gates owner-only; canal de atención fail-closed.</li>\n\n<h3>Cambio rompedor</h3>\n\n<p>El canal de atención solo admite chats que recibieron la promo y permanece abierto 30 días (el pago lo cierra).</p>\n\n<div class='prov'>^[CHANGELOG.md]</div>", "wikilinks": ["detector-emocional", "perfil-evolutivo", "trust-budget", "memoria-vip", "canal-atencion", "aprendizaje-post-turno", "comunicacion-con-producto"]}}, {"id": "article:entities/specs/estado-del-proyecto", "label": "Estado del Proyecto", "color": "#4f8ef7", "group": "article", "detail": {"name": "Estado del Proyecto", "type": "article", "typeLabel": "Artículo", "summary": "Estado verificado el 2026-08-11: bot en producción (tmux prod, polling activo), migraciones al día (head `026`), branch main al día.", "tags": "[estado, entities — specs, entities/specs, operacion, riesgo]", "content": "<p>---</p>\n<p>title: Estado del Proyecto</p>\n<p>created: 2026-08-11</p>\n<p>updated: 2026-08-11</p>\n<p>type: summary</p>\n<p>tags: [estado, operacion, riesgo]</p>\n<p>sources: [../../docs/ESTADO-PROYECTO.md]</p>\n<p>confidence: high</p>\n<p>---</p>\n\n<h2>Estado del Proyecto</h2>\n\n<p>Estado verificado el 2026-08-11: bot en producción (tmux prod, polling activo), migraciones al día (head <code>026</code>), branch main al día.</p>\n\n<h3>Qué está activo</h3>\n\n<li>**Fase 4 — Atención general** ✅ activa (`FEATURE_GENERAL_MODE_ENABLED=true`): ciclo por chat de **30 días lineales** (trigger &quot;Quiero más información 🔥&quot; → promo sin LLM → chat habilitado; **el pago cierra el ciclo** y la entrega es manual de la dueña). Límite 20 msgs/día (CDMX), fail-open si falla la DB. Ver [[canal-atencion]].</li>\n<li>**Fase 5 — Perfil de memoria por VIP** ✅ completa (4 pools): backfill con cola durable + timer 1h (protección de cuenta), post-turno incremental best-effort, aprobación de sensibles por DM (`/memoria`), ficha con sección 🧠 Memoria. En producción: **81 filas** en `memories` (52 auto, 18 discarded, 11 approved), 10 backfills. Ver [[memoria-vip]].</li>\n<li>**Evolución de agente (pool `evo-agente`)** ✅ **shadow activo en producción** (migraciones 024-026 aplicadas): los hooks **miden y registran, no cambian decisiones** — el bot sigue 100 % supervisado (`FEATURE_AUTONOMOUS_MODE=false`). Datos shadow reales (2026-08-11): `turn_category_log` 48, `emotional_signal_log` 29, `vip_profile` 9 (versiones hasta v7), `vip_trust_budget` 2 (fático, score ~0.18). Ver [[perfil-evolutivo]], [[trust-budget]], [[detector-emocional]].</li>\n\n<h3>Flags en producción (modo medición)</h3>\n\n<p><code>FEATURE_EMOTIONAL_DETECTOR_ENABLED</code>, <code>FEATURE_PROFILE_SYNTHESIS_ENABLED</code>, <code>FEATURE_PHATIC_AUTONOMY</code>, <code>FEATURE_MOOD_ENGINE</code>, <code>FEATURE_TRUST_BUDGET</code> = <b>true</b> (solo miden); <code>FEATURE_AUTONOMOUS_MODE=false</code>. Ver [[feature-flags]].</p>\n\n<h3>Calidad</h3>\n\n<p>Suite unit <b>2441 verdes</b> + e2e (Docker) verdes; purity gates 3/3. Auditoría de 161 requisitos: ver [[informe-auditoria]].</p>\n\n<h3>Pendientes</h3>\n\n<li>**Fase 5 real de evolución (cablear doble puerta):** `can_autonomous` sin call-sites de envío; requiere confianza por categoría + `recent_trend` confiable.</li>\n<li>Cola durable `synthesis_queue` (hoy guard en memoria); ficha perfil EA-06 completa (historial de versiones); `.env.example` con flags nuevos.</li>\n<li>Fase 4 (iniciativa contextual) diferida por decisión del usuario.</li>\n<li>Drift de estilo: score 0.25 vs umbral 0.1 (esperado tras cambio de persona; se re-ancla en ~4 semanas).</li>\n<li>Privacidad backfill: opt-out por VIP, masking PII, retención, acuerdo con proveedor (documentado en [[spec-fase5]]).</li>\n\n<div class='prov'>^[docs/ESTADO-PROYECTO.md]</div>", "wikilinks": ["canal-atencion", "memoria-vip", "perfil-evolutivo", "trust-budget", "detector-emocional", "feature-flags", "informe-auditoria", "spec-fase5"]}}, {"id": "article:entities/specs/informe-auditoria", "label": "Informe de Auditoría", "color": "#4f8ef7", "group": "article", "detail": {"name": "Informe de Auditoría", "type": "article", "typeLabel": "Artículo", "summary": "Auditoría de alineamiento código ↔ requerimientos (julio 2026): **161 requisitos revisados** (P0/P1/P2).", "tags": "[riesgo, entities — specs, entities/specs, estado, requisito]", "content": "<p>---</p>\n<p>title: Informe de Auditoría</p>\n<p>created: 2026-08-11</p>\n<p>updated: 2026-08-11</p>\n<p>type: summary</p>\n<p>tags: [riesgo, estado, requisito]</p>\n<p>sources: [../../docs/INFORME_AUDITORIA.md]</p>\n<p>confidence: high</p>\n<p>---</p>\n\n<h2>Informe de Auditoría</h2>\n\n<p>Auditoría de alineamiento código ↔ requerimientos (julio 2026): <b>161 requisitos revisados</b> (P0/P1/P2).</p>\n\n<h3>Resumen numérico</h3>\n\n<div class='tbl'>| Estado | Cantidad |</div>\n<div class='tbl'>|---|---|</div>\n<div class='tbl'>| ✅ Cumple | 139 |</div>\n<div class='tbl'>| ⚠️ Observación menor | 14 |</div>\n<div class='tbl'>| 🔍 No implementado (P2 / fuera de alcance) | 6 |</div>\n<div class='tbl'>| ❌ No implementado (P1) | **2** |</div>\n\n<h3>Los 2 no implementados (P1)</h3>\n\n<li>**AUTH-03** — No hay tope configurable de VIPs (el sistema intentaría procesar cualquier cantidad).</li>\n<li>**AUTH-07** — Modo observación de chats no-VIP sin responder no existe.</li>\n\n<h3>Observaciones relevantes</h3>\n\n<li>**GAP-11 (P1)** — Al resolver zona gris no se pide generalización explícita a la dueña; hoy se usa el texto tal cual (ver [[zona-gris-y-politicas]]).</li>\n<li>**COG-16** — El cortocircuito de escalación vive en un middleware de Telegram, no en el Director como dice el diseño (funciona, capa distinta).</li>\n<li>**REE-02 / COG-15** — El recontacto usa plantillas fijas, no el pipeline reducido con personalización.</li>\n<li>**MODE-05** — Regenerar variantes de borrador fuera de alcance; **MODE-09** — sin feedback post-send autónomo dedicado.</li>\n<li>**MET-04** — Detector de drift implementado pero sin baseline no funciona; **ADM-03** — sin cambio de LLM en caliente.</li>\n\n<h3>Fortalezas confirmadas</h3>\n\n<p>Pipeline cognitivo completo con Director determinista, evaluación 7D con prioridades correctas, Behavior Engine separado, zona gris completa con expiración 24h, 5 tipos de conocimiento separados con anti-contaminación, persistencia total en PostgreSQL con secretos fuera del repo, admin completa.</p>\n\n<div class='prov'>^[docs/INFORME_AUDITORIA.md]</div>", "wikilinks": ["zona-gris-y-politicas"]}}, {"id": "article:entities/specs/spec-1-1", "label": "SPEC-1.1.md", "color": "#4f8ef7", "group": "article", "detail": {"name": "SPEC-1.1.md", "type": "article", "typeLabel": "Artículo", "summary": "Contrato de diseño e implementación (SPEC.md v1.5 — Híbrido Integrado, basado en [[spec-requerimientos]] v2.1). Es la **única fuente de verdad para la implementación**; estrategia incremental por f...", "tags": "[spec, arquitectura], decision, entities — specs, entities/specs", "content": "<p>---</p>\n<p>title: SPEC-1.1.md</p>\n<p>created: 2026-08-11</p>\n<p>updated: 2026-08-11</p>\n<p>type: entity</p>\n<p>tags: [spec, decision, arquitectura]</p>\n<p>sources: [../../docs/SPEC-1.1.md]</p>\n<p>confidence: high</p>\n<p>---</p>\n\n<h2>SPEC-1.1.md</h2>\n\n<p>Contrato de diseño e implementación (SPEC.md v1.5 — Híbrido Integrado, basado en [[spec-requerimientos]] v2.1). Es la <b>única fuente de verdad para la implementación</b>; estrategia incremental por fases.</p>\n\n<h3>Stack tecnológico (bloqueado)</h3>\n\n<li>Python 3.12+, aiogram 3.x (Business Connection nativo), PostgreSQL 16+ (único almacén durable), SQLAlchemy 2.0 async + asyncpg, Pydantic v2, pgvector (Fase 2+).</li>\n<li>LLM primario **DeepSeek**, secundario **Anthropic** (hot-swap vía interfaz abstracta).</li>\n<li>Embeddings locales sentence-transformers (Fase 2).</li>\n<li>**No se usa en V1:** Redis, LangChain, Celery, Kafka.</li>\n\n<h3>Contenido clave</h3>\n\n<li>Arquitectura de alto nivel con [[turn-coordinator]] y máquina de estados del turno (§2-3).</li>\n<li>Contratos por componente (§4): [[director-cognitivo]], Analista, Planificador, [[capability-registry]], Constructor de Contexto, Generador, Evaluador, [[decisor]], [[behavior-engine]].</li>\n<li>Modelo de datos clasificado por fase (§5): tablas Fase 1 (vips, message_history, pipeline_traces, pending_deliveries, turns, escalation_events), Fase 2 (profiles, memories, contexts, policies, examples, staging_candidates, gray_zone_queries), Fase 3 (learning_metrics, system_config).</li>\n<li>ADRs (§9): ADR-001 aiogram; ADR-002 Director + Capability Registry; ADR-003 solo PostgreSQL+pgvector; ADR-004 Behavior Engine con asyncio.Task; ADR-005 embeddings locales; ADR-006 LLMProvider con hot-swap.</li>\n<li>Criterios de aceptación técnicos TAC-01..13 (§10).</li>\n<li>Estructura de carpetas propuesta (§11) — coincide con `src/diana/` del repo.</li>\n\n<div class='prov'>^[docs/SPEC-1.1.md]</div>", "wikilinks": ["spec-requerimientos", "turn-coordinator", "director-cognitivo", "capability-registry", "decisor", "behavior-engine"]}}, {"id": "article:entities/specs/spec-evolucion-agente", "label": "SPEC-EVOLUCION-AGENTE.md", "color": "#4f8ef7", "group": "article", "detail": {"name": "SPEC-EVOLUCION-AGENTE.md", "type": "article", "typeLabel": "Artículo", "summary": "Contrato de implementación de la **Evolución de agente** (v1.2): llevar a Diana de \"bot con memoria consultada\" a \"agente con perfil evolutivo, autonomía calibrada por confianza y personalidad con ...", "tags": "[spec, aprendizaje, decision, entities — specs, entities/specs, riesgo]", "content": "<p>---</p>\n<p>title: SPEC-EVOLUCION-AGENTE.md</p>\n<p>created: 2026-08-11</p>\n<p>updated: 2026-08-11</p>\n<p>type: entity</p>\n<p>tags: [spec, decision, aprendizaje, riesgo]</p>\n<p>sources: [../../docs/SPEC-EVOLUCION-AGENTE.md]</p>\n<p>confidence: high</p>\n<p>---</p>\n\n<h2>SPEC-EVOLUCION-AGENTE.md</h2>\n\n<p>Contrato de implementación de la <b>Evolución de agente</b> (v1.2): llevar a Diana de &quot;bot con memoria consultada&quot; a &quot;agente con perfil evolutivo, autonomía calibrada por confianza y personalidad con textura (mood)&quot;.</p>\n\n<p><b>Principio guía:</b> cada pieza nueva detrás de feature flag y con traza auditable — nada se libera sin poder revertirse.</p>\n\n<p><b>Lección incorporada (2026-08-06):</b> los umbrales de seguridad/confianza son <b>constantes fijas con override manual</b> vía <code>system_config</code>, <b>nunca auto-calibrados por LLM</b>. Precedente: el incidente de calibración (safety_min calibrado a 0.95 por correcciones → escalaciones masivas). Ver [[calibracion-de-umbrales]].</p>\n\n<h3>Decisiones de diseño aprobadas (EA-01..06)</h3>\n\n<li>**EA-01** — El [[trust-budget]] es la **fuente única de la decisión conductual** por (VIP, categoría); autoenvío = doble puerta: `trust_score &gt;= umbral` Y evaluación del turno &gt;= mínimos del Decider. Se actualiza solo por eventos (correcciones/autónomos), jamás por calibración LLM.</li>\n<li>**EA-02** — Carril rápido con 3 filtros baratos: clasificador seguro de fático, sin trigger forbidden, chequeo de seguridad del borrador.</li>\n<li>**EA-03** — Categoría `sensitive` = regla dura: siempre aprobación del owner.</li>\n<li>**EA-04** — `feedback_signals`: proxy por categoría + LLM de síntesis filtra relevancia (sin esquema de clasificación extra).</li>\n<li>**EA-05** — Anti-contaminación: `stable_traits`/`sensitivities` jamás alimentan el banco de ejemplos; solo `recent_trend` y mood entran al contexto de generación.</li>\n<li>**EA-06** — UI admin: secciones en la ficha existente del VIP (sin comandos nuevos).</li>\n\n<h3>Fases del contrato</h3>\n\n<li>**Fase 0 — Fundaciones:** migraciones 024+ (`vip_profile`, `vip_profile_history`, `vip_mood_state`, `vip_trust_budget`, `turn_category_log`, `emotional_signal_log`) + [[detector-emocional]] (componente transversal).</li>\n<li>**Fase 1 — Resíntesis de memoria:** [[perfil-evolutivo]] (stable_traits/recent_trend/sensitivities, decaimiento, versionado, `profile_synthesis_job`).</li>\n<li>**Fase 2 — Autonomía fática:** clasificador de turno (phatic/informational/emotional/sensitive) + carril rápido (ver [[trust-budget]]).</li>\n<li>**Fase 3 — Motor de mood:** 3 ejes (juguetón-serio, cálido-distante, energía), promedio móvil con retorno a la base; matiza selección de variantes.</li>\n<li>**Fase 4 — Iniciativa contextual:** recontacto prioriza `recent_trend` + hechos con `follow_up` (campo aditivo opcional).</li>\n<li>**Fase 5 — Trust budget:** [[trust-budget]] activo.</li>\n\n<h3>Orden de ejecución</h3>\n\n<p>Fase 0 + detector → Fase 1 y 2 en paralelo (shadow) → Fase 3 (shadow) → Fase 5 (activo cuando Fase 2 sale de shadow) → Fase 4.</p>\n\n<h3>Estado (2026-08)</h3>\n\n<p>Fase 0 y componentes desplegados; flags en medición; pendiente la mecánica del modo shadow (3 estados, doble llave, sombra por defecto).</p>\n\n<div class='prov'>^[docs/SP</div>", "wikilinks": ["calibracion-de-umbrales", "trust-budget", "detector-emocional", "perfil-evolutivo", "trust-budget", "trust-budget"]}}, {"id": "article:entities/specs/spec-fase2", "label": "SPEC-FASE2.md", "color": "#4f8ef7", "group": "article", "detail": {"name": "SPEC-FASE2.md", "type": "article", "typeLabel": "Artículo", "summary": "Contrato de diseño e implementación de la **Fase 2 (MVP+)**: Memoria, Aprendizaje Controlado y Zona Gris (v2.1, basado en [[spec-1-1]] y [[spec-requerimientos]] bloques MEM/TRN/GAP/EVAL).", "tags": "[spec, aprendizaje, entities — specs, entities/specs, memoria, politica]", "content": "<p>---</p>\n<p>title: SPEC-FASE2.md</p>\n<p>created: 2026-08-11</p>\n<p>updated: 2026-08-11</p>\n<p>type: entity</p>\n<p>tags: [spec, memoria, aprendizaje, politica]</p>\n<p>sources: [../../docs/SPEC-FASE2.md]</p>\n<p>confidence: high</p>\n<p>---</p>\n\n<h2>SPEC-FASE2.md</h2>\n\n<p>Contrato de diseño e implementación de la <b>Fase 2 (MVP+)</b>: Memoria, Aprendizaje Controlado y Zona Gris (v2.1, basado en [[spec-1-1]] y [[spec-requerimientos]] bloques MEM/TRN/GAP/EVAL).</p>\n\n<h3>Propósito</h3>\n\n<p>Transformar el &quot;bot supervisado&quot; de Fase 1 en un sistema que aprende y razona con memoria:</p>\n\n<li>**Memoria real** — retrievers con pgvector (memories, policies, examples).</li>\n<li>**Doctrina reutilizable** — [[zona-gris-y-politicas]]: consultas a la dueña → policies estructuradas.</li>\n<li>**Aprendizaje controlado** — [[aprendizaje-post-turno]] con Staging Area y promoción explícita.</li>\n<li>**Evaluación calibrable** — registro de perfiles para [[calibracion-de-umbrales]] futura.</li>\n<li>**Sustituibilidad** — mismas interfaces del [[capability-registry]]; el Director no cambia.</li>\n\n<h3>Feature toggles (todos default false)</h3>\n\n<p><code>FEATURE_MEMORY_ENABLED</code>, <code>FEATURE_GRAY_ZONE_ENABLED</code>, <code>FEATURE_STAGING_ENABLED</code>, <code>FEATURE_SANDBOX_ENABLED</code> (ver [[feature-flags]]).</p>\n\n<h3>Componentes nuevos</h3>\n\n<li>**Retrievers reales** (reemplazan stubs): MemoryRetriever (umbral 0.75, `WHERE vip_id` obligatorio), PolicyRetriever (umbral 0.8, scope), ExamplesRetriever (top-k 3-5, contraejemplo 10%).</li>\n<li>**StagingService** — `save_correction`, `promote_to_example`, `promote_to_policy`, `discard`. Toda política nueva pasa por staging (BR-13).</li>\n<li>**GrayZoneService** — `create_query`, `freeze_vip`/`unfreeze_vip`, `resolve_with_doctrine`, `expire_old_queries` (timeout 24h default, acción configurable: escalate o use_draft).</li>\n<li>**PolicyDistiller** — estructura la política: `trigger_description`, `rule`, `scope`, `ejemplo_aplicado`.</li>\n<li>**Evaluador** — doctrina según tabla: `needs_policy=false` → 0.7 neutral; con políticas → valor real; `needs_policy=true` + sin políticas → 0.2 (señal de zona gris).</li>\n<li>**Decisor** — prioridad 2 nueva: `consult_doctrine` cuando `needs_policy=true` y retrieval vacío (ver [[decisor]]).</li>\n\n<h3>Orden de activación recomendado</h3>\n\n<p>Índices HNSW → seed de políticas → flags uno a uno (memoria → staging → zona gris). Rollback solo cambiando configuración.</p>\n\n<div class='prov'>^[docs/SPEC-FASE2.md]</div>", "wikilinks": ["spec-1-1", "spec-requerimientos", "zona-gris-y-politicas", "aprendizaje-post-turno", "calibracion-de-umbrales", "capability-registry", "feature-flags", "decisor"]}}, {"id": "article:entities/specs/spec-fase3", "label": "SPEC-FASE3.md", "color": "#4f8ef7", "group": "article", "detail": {"name": "SPEC-FASE3.md", "type": "article", "typeLabel": "Artículo", "summary": "Contrato de diseño e implementación de la **Fase 3 (Producto Completo)**: Autonomía, Proactividad y Métricas (v3.1, revisión post-review; base: [[spec-1-1]], [[spec-fase2]], Anexo T).", "tags": "[spec, aprendizaje], entities — specs, entities/specs, modo, operacion", "content": "<p>---</p>\n<p>title: SPEC-FASE3.md</p>\n<p>created: 2026-08-11</p>\n<p>updated: 2026-08-11</p>\n<p>type: entity</p>\n<p>tags: [spec, modo, operacion, aprendizaje]</p>\n<p>sources: [../../docs/SPEC-FASE3.md]</p>\n<p>confidence: high</p>\n<p>---</p>\n\n<h2>SPEC-FASE3.md</h2>\n\n<p>Contrato de diseño e implementación de la <b>Fase 3 (Producto Completo)</b>: Autonomía, Proactividad y Métricas (v3.1, revisión post-review; base: [[spec-1-1]], [[spec-fase2]], Anexo T).</p>\n\n<h3>Capacidades que completa</h3>\n\n<li>**Modo autónomo** — envío sin aprobación previa sujeto a umbrales y config por VIP (extensión del [[decisor]]: prioridades 5-6; ver [[modos-de-operacion]]).</li>\n<li>**Recontacto por silencio** — pipeline reducido con exclusión de estados bloqueantes (`is_blocked()`: pausa, congelación, aprobación pendiente, sandbox; REQ-REE-03, BR-05).</li>\n<li>**Promo no-VIP** — trigger exacto, secuencia multi-mensaje **sin LLM**, diferenciación primer envío/reenvío (`promo.repeat_days` = 30) y trazabilidad (`promo_executions`).</li>\n<li>**[[calibracion-de-umbrales]] automática** — job semanal; garantía de margen: autónomo &gt;= supervisado + 0.05.</li>\n<li>**Behavior Engine avanzado** — mensajes divididos (`split_chars` 4096), quirks humanos, secuencias (`deliver_with_sequence`).</li>\n<li>**Métricas agregadas** — `learning_metrics`: tasa de aprobación sin corrección, repetición de zona gris, falsos positivos de escalación, `style_drift_score`, `autonomous_send_rate`.</li>\n\n<h3>Umbrales iniciales (arranque en frío)</h3>\n\n<li>Autónomos: `safety_min=0.9`, `doctrine_min=0.8`, `naturalness_min=0.7`.</li>\n<li>Supervisados: `safety_min=0.5`, `doctrine_min=0.4`, `naturalness_min=0.5`.</li>\n\n<h3>Tablas nuevas</h3>\n\n<p><code>recontact_schedules</code>, <code>promo_triggers</code>, <code>promo_executions</code>, <code>learning_metrics.style_drift_score</code>.</p>\n\n<h3>Hook de cancelación (BR-07)</h3>\n\n<p>El TurnCoordinator llama <code>RecontactService.cancel_recontact(vip_id)</code> cuando el VIP escribe — el recontacto programado se cancela si hay actividad.</p>\n\n<h3>Nota de activación</h3>\n\n<p>Recomendado activar flags uno a uno: recontacto → promo → calibración → autónomo → behavior avanzado (ver [[feature-flags]]).</p>\n\n<div class='prov'>^[docs/SPEC-FASE3.md]</div>", "wikilinks": ["spec-1-1", "spec-fase2", "decisor", "modos-de-operacion", "calibracion-de-umbrales", "feature-flags"]}}, {"id": "article:entities/specs/spec-fase4", "label": "SPEC-FASE4.md", "color": "#4f8ef7", "group": "article", "detail": {"name": "SPEC-FASE4.md", "type": "article", "typeLabel": "Artículo", "summary": "Contrato de diseño e implementación de la **Fase 4 — Atención al Cliente General (canal no-VIP)** (v1.0, borrador aprobado). Convierte el sistema en asistente permanente de atención: cualquier pers...", "tags": "[spec, entities — specs, entities/specs, modo, regla-negocio]", "content": "<p>---</p>\n<p>title: SPEC-FASE4.md</p>\n<p>created: 2026-08-11</p>\n<p>updated: 2026-08-11</p>\n<p>type: entity</p>\n<p>tags: [spec, modo, regla-negocio]</p>\n<p>sources: [../../docs/SPEC-FASE4.md]</p>\n<p>confidence: high</p>\n<p>---</p>\n\n<h2>SPEC-FASE4.md</h2>\n\n<p>Contrato de diseño e implementación de la <b>Fase 4 — Atención al Cliente General (canal no-VIP)</b> (v1.0, borrador aprobado). Convierte el sistema en asistente permanente de atención: cualquier persona que escriba por Telegram Business (no-VIP) recibe atención con identidad Diana versión servicio.</p>\n\n<h3>Decisiones de producto</h3>\n\n<li>Atención **supervisada** siempre (aprobación/corrección de la dueña; autónomo postergado).</li>\n<li>Identidad: misma Diana, **versión servicio**: cálida y profesional, sin coqueteo, sin contenido íntimo.</li>\n<li>Flujo con guion: promo de bienvenida automática (existente) → identificación de intención → guion (precios, diferencias, suscripción, datos de pago).</li>\n<li>Reglas duras: sin contacto personal (&quot;¿dónde te puedo ver?&quot; → servicio inexistente); **Diana es la única que atiende** (nunca derivar).</li>\n<li>**Límite: 20 mensajes del cliente por día por chat** (zona horaria `America/Mexico_City`).</li>\n<li>Sin entrega automática de contenido: el bot guía hasta el pago y **avisa a la dueña** (entrega manual).</li>\n<li>Zona gris aplica a atención: ante desconocimiento → consulta a la dueña, nunca inventar ni derivar.</li>\n\n<h3>Concepto clave: perfil de canal</h3>\n\n<p>El sistema pasa de &quot;una persona global&quot; a un perfil por tipo de chat (ver [[canal-atencion]]). Una sola rama determinista en la puerta (AuthMiddleware): <code>vip_id</code> + <code>channel_type</code> se deciden una vez, el pipeline no cambia.</p>\n\n<li>`FEATURE_GENERAL_MODE_ENABLED` (default false) gobierna todo el comportamiento.</li>\n<li>`persona_versions.channel_type` (`vip` | `atencion`) — una versión activa por canal (migración 018).</li>\n<li>Tabla `daily_message_limits` (chat_id, fecha_local, count).</li>\n<li>Anti-contaminación total entre canales: atención nunca toca `memories` ni el banco VIP.</li>\n\n<h3>Seguridad</h3>\n\n<p>El perfil <code>atencion</code> nunca emite contenido explícito/sexual ni material del canal VIP; <code>forbidden_keywords</code> y freeze aplican a ambos canales.</p>\n\n<div class='prov'>^[docs/SPEC-FASE4.md]</div>", "wikilinks": ["canal-atencion"]}}, {"id": "article:entities/specs/spec-fase5", "label": "SPEC-FASE5.md", "color": "#4f8ef7", "group": "article", "detail": {"name": "SPEC-FASE5.md", "type": "article", "typeLabel": "Artículo", "summary": "Contrato de diseño e implementación de la **Fase 5 — Perfil de VIP con Memoria (backfill + mantenimiento)** (v1.0, aprobado). Construye el puente entre los dos caminos de la información:", "tags": "[spec, aprendizaje], entities — specs, entities/specs, memoria", "content": "<p>---</p>\n<p>title: SPEC-FASE5.md</p>\n<p>created: 2026-08-11</p>\n<p>updated: 2026-08-11</p>\n<p>type: entity</p>\n<p>tags: [spec, memoria, aprendizaje]</p>\n<p>sources: [../../docs/SPEC-FASE5.md]</p>\n<p>confidence: high</p>\n<p>---</p>\n\n<h2>SPEC-FASE5.md</h2>\n\n<p>Contrato de diseño e implementación de la <b>Fase 5 — Perfil de VIP con Memoria (backfill + mantenimiento)</b> (v1.0, aprobado). Construye el puente entre los dos caminos de la información:</p>\n\n<li>**Historial crudo** (`message_history`): funcional, 1.015+ mensajes importados.</li>\n<li>**Memoria procesada** (`memories`): **vacía (0 filas) — no existía escritor**. Esta fase lo crea (ver [[memoria-vip]]).</li>\n\n<h3>Decisiones de producto (dueña)</h3>\n\n<li>El perfil por VIP se construye **una vez (backfill)** leyendo el historial completo; fichas ricas o casi vacías son aceptables.</li>\n<li>Luego se **mantiene solo** con extracción post-turno incremental.</li>\n<li>**Control de la dueña**: datos sensibles (salud, familia, dinero, ubicación, trabajo) → candidatos que la dueña aprueba; lo trivial se agrega solo.</li>\n<li>La ficha es **visible y editable** en el panel (datos/notas por VIP).</li>\n<li>Nada de esto se comparte con el canal de atención ([[spec-fase4]]): la memoria es exclusiva de VIPs.</li>\n<li>`FEATURE_MEMORY_ENABLED` es la llave maestra: apagada → comportamiento idéntico al actual.</li>\n\n<h3>Elementos clave</h3>\n\n<li>**Backfill**: historial → LLM (ventanas de 200 msgs / 12K chars) → secciones en `memories` + fila `perfil`. Idempotente. Cola persistente con **lock global: una extracción a la vez** y timer (`BACKFILL_INTERVAL_SEC` = 3600s) para proteger la cuenta de Telegram.</li>\n<li>**Categorías de la ficha**: `identidad`, `preferencias`, `comercial`, `limites`, `sensible`, `perfil` (ficha completa).</li>\n<li>**Migración 022**: `memories.status` (`auto` | `pending_owner` | `approved` | `discarded`) + `source_turn_id` + índice `(vip_id, status)`.</li>\n<li>**Aprobación**: hechos `pending_owner` aparecen en el DM de la dueña (aprobar/descartar/editar); **no se inyectan al contexto** hasta aprobación.</li>\n<li>**Dedup**: similitud semántica ≥ 0.85 contra filas del mismo VIP antes de insertar.</li>\n<li>**Anti-contaminación**: toda lectura/escritura filtra por `vip_id` (BR-15); el canal `atencion` nunca toca `memories`; tests explícitos de aislamiento.</li>\n\n<h3>Pendientes de privacidad (fix round F3)</h3>\n\n<p>Durante el backfill el historial completo del chat se envía al proveedor LLM externo (by-design, con ventanas y tope de 12K chars). Pendientes: opt-out por VIP, evaluación de masking PII, documentar retención, acuerdo de procesamiento con el proveedor.</p>\n\n<div class='prov'>^[docs/SPEC-FASE5.md]</div>", "wikilinks": ["memoria-vip", "spec-fase4"]}}, {"id": "article:entities/specs/spec-requerimientos", "label": "REQUERIMIENTOS.md", "color": "#4f8ef7", "group": "article", "detail": {"name": "REQUERIMIENTOS.md", "type": "article", "typeLabel": "Artículo", "summary": "Documento de requisitos del sistema (v2.1 — Arquitectura Cognitiva + refinamiento de aprendizaje, políticas y métricas). Define **qué debe cumplir** el sistema, sin prescribir tecnologías (eso vive...", "tags": "[spec, entities — specs, entities/specs, estado], requisito", "content": "<p>---</p>\n<p>title: REQUERIMIENTOS.md</p>\n<p>created: 2026-08-11</p>\n<p>updated: 2026-08-11</p>\n<p>type: entity</p>\n<p>tags: [spec, requisito, estado]</p>\n<p>sources: [../../docs/REQUERIMIENTOS.md]</p>\n<p>confidence: high</p>\n<p>---</p>\n\n<h2>REQUERIMIENTOS.md</h2>\n\n<p>Documento de requisitos del sistema (v2.1 — Arquitectura Cognitiva + refinamiento de aprendizaje, políticas y métricas). Define <b>qué debe cumplir</b> el sistema, sin prescribir tecnologías (eso vive en [[spec-1-1]]).</p>\n\n<h3>Contenido principal</h3>\n\n<li>**Arquitectura Cognitiva** (§3): el sistema no es un chatbot; el LLM es razonador especializado; principio rector (ver [[principio-rector]]).</li>\n<li>**Alcance** (§4): chats de negocio VIP, DM de la dueña, escalación, memoria, recontacto, promo no-VIP, sandbox, pipeline auditable.</li>\n<li>**Requisitos funcionales** (§9): REQ-AUTH, REQ-COG, REQ-VIP, REQ-HUM, REQ-MODE, REQ-ESC, REQ-GAP, REQ-MEM, REQ-TRN, REQ-EVAL, REQ-REE, REQ-PRO, REQ-ADM, REQ-PER, REQ-MET.</li>\n<li>**Requisitos no funcionales** (§10): REQ-NFR-01..16 (UX percibida, concurrencia, control de riesgo, explicabilidad, sustituibilidad, anti-contaminación, aprendizaje controlado…).</li>\n<li>**Reglas de negocio transversales** (§11): BR-01..15.</li>\n<li>**Matriz de decisión** (§12), historias de usuario (§13), criterios de aceptación AC-01..19 (§14).</li>\n<li>**MVP recomendado** (§18): recorte por releases (supervisado → MVP+ aprendizaje → producto completo).</li>\n\n<h3>Relaciones</h3>\n\n<li>Bases de [[spec-1-1]] (el &quot;cómo&quot;).</li>\n<li>Operación para agentes: [[agents-md]] (límites de módulo).</li>\n<li>Cambios de comportamiento de producto → actualizar REQUERIMIENTOS primero, luego SPEC (§17).</li>\n\n<div class='prov'>^[docs/REQUERIMIENTOS.md]</div>", "wikilinks": ["spec-1-1", "principio-rector", "spec-1-1", "agents-md"]}}, {"id": "article:entities/tablas/esquema-conocimiento", "label": "Esquema de Datos — Conocimiento (F2)", "color": "#4f8ef7", "group": "article", "detail": {"name": "Esquema de Datos — Conocimiento (F2)", "type": "article", "typeLabel": "Artículo", "summary": "Tablas de conocimiento de la Fase 2 (MVP+): los cinco tipos de conocimiento + staging + zona gris. Índices HNSW con pgvector (384 dims, embeddings locales).", "tags": "[dato, aprendizaje, entities — tablas, entities/tablas, memoria, politica]", "content": "<p>---</p>\n<p>title: Esquema de Datos — Conocimiento (F2)</p>\n<p>created: 2026-08-11</p>\n<p>updated: 2026-08-11</p>\n<p>type: entity</p>\n<p>tags: [dato, memoria, aprendizaje, politica]</p>\n<p>sources: [../../alembic/versions/, ../../docs/SPEC-FASE2.md]</p>\n<p>confidence: high</p>\n<p>---</p>\n\n<h2>Esquema de Datos — Conocimiento (F2)</h2>\n\n<p>Tablas de conocimiento de la Fase 2 (MVP+): los cinco tipos de conocimiento + staging + zona gris. Índices HNSW con pgvector (384 dims, embeddings locales).</p>\n\n<h3>Tablas</h3>\n\n<li>**`profiles`** — perfil permanente del VIP (PK `vip_id`, `data` jsonb). Recuperado por `ProfileRetriever` (knowledge.profile).</li>\n<li>**`memories`** — hechos y preferencias por VIP, **siempre filtradas por `vip_id`** (BR-15; ver [[memoria-vip]]). Columnas F5: `status` (auto|pending_owner|approved|discarded), `source_turn_id`.</li>\n<li>**`contexts`** — contexto temporal interpretado, con `expires_at` (knowledge.context).</li>\n<li>**`policies`** — doctrina estructurada: `trigger_description`, `rule`, `example_applied`, `scope`, `valid_until`, `is_active`, `created_from_gray_zone` (ver [[zona-gris-y-politicas]]).</li>\n<li>**`examples`** — banco vivo de few-shots + contraejemplos (`is_counterexample`, `original_draft`, `quality_score`, `source_staging_id`).</li>\n<li>**`staging_candidates`** — Staging Area: `type` (example|memory|policy), `payload` jsonb, `status` (pending|promoted|discarded), `created_by` (correction|extraction|gray_zone) — ver [[aprendizaje-post-turno]].</li>\n<li>**`gray_zone_queries`** — consultas de doctrina abiertas: `status` (open|resolved|expired), `freeze_until`, `resolution` — ver [[zona-gris-y-politicas]].</li>\n\n<p>Relacionado: [[capability-registry]], [[spec-fase2]], [[anti-contaminacion]].</p>\n\n<div class='prov'>^[alembic/versions/003+, docs/SPEC-FASE2.md §4]</div>", "wikilinks": ["memoria-vip", "zona-gris-y-politicas", "aprendizaje-post-turno", "zona-gris-y-politicas", "capability-registry", "spec-fase2", "anti-contaminacion"]}}, {"id": "article:entities/tablas/esquema-evolucion", "label": "Esquema de Datos — Evolución de Agente", "color": "#4f8ef7", "group": "article", "detail": {"name": "Esquema de Datos — Evolución de Agente", "type": "article", "typeLabel": "Artículo", "summary": "Fundaciones de datos de la evolución de agente (migraciones 024+, Fase 0 del contrato; ver [[spec-evolucion-agente]]). Sin estos datos no hay perfil evolutivo ni trust budget.", "tags": "[dato, aprendizaje, decision], entities — tablas, entities/tablas", "content": "<p>---</p>\n<p>title: Esquema de Datos — Evolución de Agente</p>\n<p>created: 2026-08-11</p>\n<p>updated: 2026-08-11</p>\n<p>type: entity</p>\n<p>tags: [dato, aprendizaje, decision]</p>\n<p>sources: [../../alembic/versions/, ../../docs/SPEC-EVOLUCION-AGENTE.md]</p>\n<p>confidence: high</p>\n<p>---</p>\n\n<h2>Esquema de Datos — Evolución de Agente</h2>\n\n<p>Fundaciones de datos de la evolución de agente (migraciones 024+, Fase 0 del contrato; ver [[spec-evolucion-agente]]). Sin estos datos no hay perfil evolutivo ni trust budget.</p>\n\n<h3>Tablas</h3>\n\n<li>**`vip_profile`** — perfil sintetizado por VIP: `stable_traits` (jsonb), `recent_trend` (jsonb), `sensitivities` (jsonb), `version`, `last_synthesized_at`, `synthesis_trigger` (volume|session_close|strong_signal|emotional_signal) — ver [[perfil-evolutivo]].</li>\n<li>**`vip_profile_history`** — snapshots de cada versión anterior: `profile_snapshot` (jsonb), `diff_summary` (texto LLM), `created_at` — auditoría de drift.</li>\n<li>**`vip_mood_state`** — estado de mood por VIP: 3 ejes float (-1..1) `axis_playful_serious`, `axis_warm_distant`, `axis_energy`, `updated_at` — motor de mood (shadow).</li>\n<li>**`vip_trust_budget`** — confianza por `(vip_id, turn_category)`: `trust_score` (0..1), `correction_count`, `autonomous_count`, `last_correction_at` — ver [[trust-budget]].</li>\n<li>**`turn_category_log`** — clasificación de cada turno (phatic|informational|emotional|sensitive) — alimenta trust budget.</li>\n<li>**`emotional_signal_log`** — señal emocional por turno: `signal_type`, `intensity`, `should_trigger_synthesis`, `should_escalate_to_owner`, `pipeline_would_have_escalated` (nullable) — ver [[detector-emocional]].</li>\n<li>**`backfill_queue`** — cola durable de perfiles pendientes (REQ-MEM-05): una extracción a la vez, lock global.</li>\n\n<h3>Retención</h3>\n\n<p><code>vip_profile_history</code>, <code>turn_category_log</code> y <code>emotional_signal_log</code> crecen sin límite — política de purga con el patrón de <code>TracePurgeJob</code> (retención por tabla; <code>agent_data_purge.py</code>).</p>\n\n<p>Relacionado: [[perfil-evolutivo]], [[trust-budget]], [[detector-emocional]], [[memoria-vip]].</p>\n\n<div class='prov'>^[alembic/versions/024+, docs/SPEC-EVOLUCION-AGENTE.md §Fase 0]</div>", "wikilinks": ["spec-evolucion-agente", "perfil-evolutivo", "trust-budget", "detector-emocional", "perfil-evolutivo", "trust-budget", "detector-emocional", "memoria-vip"]}}, {"id": "article:entities/tablas/esquema-fase1", "label": "Esquema de Datos — Base (F1)", "color": "#4f8ef7", "group": "article", "detail": {"name": "Esquema de Datos — Base (F1)", "type": "article", "typeLabel": "Artículo", "summary": "Tablas fundacionales de la Fase 1 (MVP Supervisado). Diseñadas en SPEC-1.1 §5 para evitar migraciones rotas; implementadas en las migraciones 001-005+.", "tags": "[dato, entities — tablas, entities/tablas, operacion], requisito", "content": "<p>---</p>\n<p>title: Esquema de Datos — Base (F1)</p>\n<p>created: 2026-08-11</p>\n<p>updated: 2026-08-11</p>\n<p>type: entity</p>\n<p>tags: [dato, requisito, operacion]</p>\n<p>sources: [../../alembic/versions/, ../../docs/SPEC-1.1.md]</p>\n<p>confidence: high</p>\n<p>---</p>\n\n<h2>Esquema de Datos — Base (F1)</h2>\n\n<p>Tablas fundacionales de la Fase 1 (MVP Supervisado). Diseñadas en SPEC-1.1 §5 para evitar migraciones rotas; implementadas en las migraciones 001-005+.</p>\n\n<h3>Tablas</h3>\n\n<li>**`vips`** — allowlist: `telegram_user_id` único, `display_name`, `is_active`, `paused_until` (REQ-AUTH-01..03, REQ-ADM-04).</li>\n<li>**`message_history`** — historial crudo de mensajes (`chat_id`, `role` vip|owner|bot, `text`, `timestamp`; índice por chat+timestamp).</li>\n<li>**`pipeline_traces`** — trazabilidad completa del pipeline (comprensión, plan, retrieved, prompt, texto generado, evaluación, decisión, delivery) — la base de la explicabilidad (REQ-COG-11, REQ-PER-06/07).</li>\n<li>**`pending_deliveries`** — entregas en vuelo con `status` (pending|delivering|done|cancelled); recuperación tras reinicio (REQ-PER-02).</li>\n<li>**`turns`** — máquina de estados del turno (`status`: received…delivered|escalated|superseded|failed; `superseded_by` para la cadena de supersedencia). Invariante: un no-terminal por chat (ver [[turn-coordinator]]).</li>\n<li>**`escalation_events`** — eventos de escalación (`tipo`: cortocircuito_determinista | semantica, `motivo`, `notificado`; ver [[escalacion]]).</li>\n<li>**`business_connections`** — conexiones de negocio persistentes (REQ-PER-01).</li>\n<li>**`pending_approvals`** — cola de aprobaciones en DM (CAS `claim_waiting`, paridad con el doble en memoria).</li>\n\n<p>Relacionado: [[spec-1-1]], [[superficie-admin]], [[infrastructure-persistence]].</p>\n\n<div class='prov'>^[alembic/versions/001-005, src/diana/infrastructure/db/models.py]</div>", "wikilinks": ["turn-coordinator", "escalacion", "spec-1-1", "superficie-admin", "infrastructure-persistence"]}}, {"id": "article:entities/tablas/esquema-fase3", "label": "Esquema de Datos — Proactividad y Métricas (F3)", "color": "#4f8ef7", "group": "article", "detail": {"name": "Esquema de Datos — Proactividad y Métricas (F3)", "type": "article", "typeLabel": "Artículo", "summary": "Tablas de la Fase 3 (Producto Completo): recontacto, promo, métricas, configuración y timers de runtime.", "tags": "[dato, entities — tablas, entities/tablas, modo], operacion", "content": "<p>---</p>\n<p>title: Esquema de Datos — Proactividad y Métricas (F3)</p>\n<p>created: 2026-08-11</p>\n<p>updated: 2026-08-11</p>\n<p>type: entity</p>\n<p>tags: [dato, operacion, modo]</p>\n<p>sources: [../../alembic/versions/, ../../docs/SPEC-FASE3.md]</p>\n<p>confidence: high</p>\n<p>---</p>\n\n<h2>Esquema de Datos — Proactividad y Métricas (F3)</h2>\n\n<p>Tablas de la Fase 3 (Producto Completo): recontacto, promo, métricas, configuración y timers de runtime.</p>\n\n<h3>Tablas</h3>\n\n<li>**`recontact_schedules`** — recontacto programado: `last_contact_at`, `next_contact_at`, `status` (pending|done|cancelled). Índice por `(next_contact_at, status)`.</li>\n<li>**`promo_triggers`** — triggers exactos de promo: `trigger_text` único, `response_sequence` jsonb, `is_active`.</li>\n<li>**`promo_executions`** — trazabilidad ligera de promos enviadas (`chat_id`, `trigger_id`, `sequence_sent`, `status`) — no usa pipeline_traces (no es turno cognitivo).</li>\n<li>**`learning_metrics`** — métricas agregadas semanales: `approval_without_correction_rate`, `gray_zone_repetition_count`, `false_positive_escalation_rate`, `style_drift_score`, `autonomous_send_rate`, `total_turns`.</li>\n<li>**`system_config`** — configuración global (flags, umbrales, blobs) — la base de los [[feature-flags]] y de la [[calibracion-de-umbrales]].</li>\n<li>**`runtime_timers`** — timers persistentes de runtime para recuperación tras crash (timer_manager).</li>\n<li>**`owner_marks`** — marcas de la dueña (ej. falsos positivos de escalación) para métricas.</li>\n\n<p>Relacionado: [[spec-fase3]], [[application-services]], [[jobs]], [[modos-de-operacion]].</p>\n\n<div class='prov'>^[alembic/versions/006+, docs/SPEC-FASE3.md §4]</div>", "wikilinks": ["feature-flags", "calibracion-de-umbrales", "spec-fase3", "application-services", "jobs", "modos-de-operacion"]}}, {"id": "article:entities/tablas/esquema-fase4", "label": "Esquema de Datos — Canal Atención (F4)", "color": "#4f8ef7", "group": "article", "detail": {"name": "Esquema de Datos — Canal Atención (F4)", "type": "article", "typeLabel": "Artículo", "summary": "Cambios de esquema de la Fase 4 (Atención al Cliente General, canal no-VIP; ver [[canal-atencion]]). Migración 018.", "tags": "[dato, entities — tablas, entities/tablas, modo, regla-negocio]", "content": "<p>---</p>\n<p>title: Esquema de Datos — Canal Atención (F4)</p>\n<p>created: 2026-08-11</p>\n<p>updated: 2026-08-11</p>\n<p>type: entity</p>\n<p>tags: [dato, modo, regla-negocio]</p>\n<p>sources: [../../alembic/versions/, ../../docs/SPEC-FASE4.md]</p>\n<p>confidence: high</p>\n<p>---</p>\n\n<h2>Esquema de Datos — Canal Atención (F4)</h2>\n\n<p>Cambios de esquema de la Fase 4 (Atención al Cliente General, canal no-VIP; ver [[canal-atencion]]). Migración 018.</p>\n\n<h3>Tablas y cambios</h3>\n\n<li>**`persona_versions.channel_type`** — columna nueva (`vip` | `atencion`); la constraint de versión activa pasa a ser por `(channel_type, is_active)`. Seed del perfil `atencion` (persona + estilo + políticas semilla).</li>\n<li>**`daily_message_limits`** — contador diario por chat de canal atención: PK única `(chat_id, fecha_local)`, `count`. Upsert atómico por turno; el corte es determinista (REQ-ATN-03/04).</li>\n<li>**`atencion_cycles`** — ciclo de vida de atención por chat (F4).</li>\n\n<h3>Reglas</h3>\n\n<li>El canal `atencion` usa solo `message_history` por chat — **nunca** `memories` (anti-contaminación entre canales).</li>\n<li>Los turns de atención se marcan `channel_type=&quot;atencion&quot;` en pipeline_traces.</li>\n\n<p>Relacionado: [[spec-fase4]], [[canal-atencion]], [[anti-contaminacion]].</p>\n\n<div class='prov'>^[alembic/versions/018, docs/SPEC-FASE4.md §13]</div>", "wikilinks": ["canal-atencion", "spec-fase4", "canal-atencion", "anti-contaminacion"]}}, {"id": "topic:entities-—-specs", "label": "Entities — Specs", "color": "#2bb673", "group": "topic", "detail": {"name": "Entities — Specs", "type": "topic", "typeLabel": "Tema", "summary": "Category from index: Entities — Specs (11 articles)", "tags": "category", "content": "<i>Sin contenido.</i>", "wikilinks": []}}, {"id": "topic:entities-—-módulos", "label": "Entities — Módulos", "color": "#2bb673", "group": "topic", "detail": {"name": "Entities — Módulos", "type": "topic", "typeLabel": "Tema", "summary": "Category from index: Entities — Módulos (9 articles)", "tags": "category", "content": "<i>Sin contenido.</i>", "wikilinks": []}}, {"id": "topic:entities-—-comandos", "label": "Entities — Comandos", "color": "#2bb673", "group": "topic", "detail": {"name": "Entities — Comandos", "type": "topic", "typeLabel": "Tema", "summary": "Category from index: Entities — Comandos (1 articles)", "tags": "category", "content": "<i>Sin contenido.</i>", "wikilinks": []}}, {"id": "topic:entities-—-tablas", "label": "Entities — Tablas", "color": "#2bb673", "group": "topic", "detail": {"name": "Entities — Tablas", "type": "topic", "typeLabel": "Tema", "summary": "Category from index: Entities — Tablas (5 articles)", "tags": "category", "content": "<i>Sin contenido.</i>", "wikilinks": []}}, {"id": "topic:concepts", "label": "Concepts", "color": "#2bb673", "group": "topic", "detail": {"name": "Concepts", "type": "topic", "typeLabel": "Tema", "summary": "Category from index: Concepts (20 articles)", "tags": "category", "content": "<i>Sin contenido.</i>", "wikilinks": []}}, {"id": "topic:comparisons", "label": "Comparisons", "color": "#2bb673", "group": "topic", "detail": {"name": "Comparisons", "type": "topic", "typeLabel": "Tema", "summary": "Category from index: Comparisons (0 articles)", "tags": "category", "content": "<i>Sin contenido.</i>", "wikilinks": []}}, {"id": "topic:queries", "label": "Queries", "color": "#2bb673", "group": "topic", "detail": {"name": "Queries", "type": "topic", "typeLabel": "Tema", "summary": "Category from index: Queries (0 articles)", "tags": "category", "content": "<i>Sin contenido.</i>", "wikilinks": []}}, {"id": "entity:staging-area", "label": "staging_area", "color": "#e8a33d", "group": "entity", "detail": {"name": "staging_area", "type": "entity", "typeLabel": "Entidad", "summary": "Área intermedia donde los candidatos de aprendizaje (examples, memory, policy) esperan aprobación antes de promoverlos; operada desde la capa de aplicación, nunca durante el pipeline", "tags": "dato, aprendizaje", "content": "<i>Sin contenido.</i>", "wikilinks": []}}, {"id": "entity:banco-ejemplos", "label": "Banco de Ejemplos (few-shot)", "color": "#e8a33d", "group": "entity", "detail": {"name": "Banco de Ejemplos (few-shot)", "type": "entity", "typeLabel": "Entidad", "summary": "Casos exitosos reutilizables entre VIP con reglas de acceso propias, separado de la Memoria por VIP (BR-10); el retrieval prioriza similitud semantica, luego recencia y limpieza, pudiendo incluir un contraejemplo junto al positivo.", "tags": "aprendizaje, memoria", "content": "<i>Sin contenido.</i>", "wikilinks": []}}, {"id": "entity:system-config", "label": "system_config", "color": "#e8a33d", "group": "entity", "detail": {"name": "system_config", "type": "entity", "typeLabel": "Entidad", "summary": "Tabla de configuracion del sistema: recibe los umbrales calibrados con registro de timestamp para auditoria y es el mecanismo de override manual de las constantes fijas de seguridad y confianza.", "tags": "operacion, estado", "content": "<i>Sin contenido.</i>", "wikilinks": []}}, {"id": "entity:cortocircuito-escalacion", "label": "Cortocircuito deterministico de escalacion", "color": "#e8a33d", "group": "entity", "detail": {"name": "Cortocircuito deterministico de escalacion", "type": "entity", "typeLabel": "Entidad", "summary": "Palabras o temas prohibidos (pagos, reclamos, crisis, 'eres un bot') disparan la escalacion antes del Analista, sin costo de LLM y sin riesgo de que el modelo improvise (REQ-COG-16, REQ-ESC-01).", "tags": "riesgo, flujo", "content": "<i>Sin contenido.</i>", "wikilinks": []}}, {"id": "entity:espanol-neutro", "label": "Espanol neutro (regla de idioma)", "color": "#e8a33d", "group": "entity", "detail": {"name": "Espanol neutro (regla de idioma)", "type": "entity", "typeLabel": "Entidad", "summary": "Todo texto de producto (UI, prompts, seeds, mensajes al VIP, specs) se escribe en espanol neutro; el voseo rioplatense esta prohibido y cualquier texto en voseo se corrige de inmediato (AGENTS.md 0.6).", "tags": "regla-negocio, contrato", "content": "<i>Sin contenido.</i>", "wikilinks": []}}, {"id": "entity:zona-gris", "label": "Zona gris", "color": "#e8a33d", "group": "entity", "detail": {"name": "Zona gris", "type": "entity", "typeLabel": "Entidad", "summary": "Estado de consulta a la duena cuando el turno necesita politica y no existe una (needs_policy); su resolucion se convierte en Politica estructurada, no en few-shot, y tiene jerarquia definida frente a la escalacion (BR-02).", "tags": "decision, flujo", "content": "<i>Sin contenido.</i>", "wikilinks": []}}, {"id": "claim:umbrales-seguridad-nunca-auto-calibrados", "label": "Umbrales de seguridad y confianza: constantes fijas con override manual", "color": "#8e5bd9", "group": "claim", "detail": {"name": "Umbrales de seguridad y confianza: constantes fijas con override manual", "type": "claim", "typeLabel": "Claim", "summary": "Tras el incidente de escalaciones masivas (2026-08, calibracion de safety_min a ~0.95), los umbrales de seguridad y confianza quedan prohibidos de auto-calibracion por LLM: son constantes fijas con override manual via system_config (SPEC-EVOLUCION-AGENTE v1.2); la calibracion automatica esta desactivada en produccion.", "tags": "riesgo, decision", "content": "<i>Sin contenido.</i>", "wikilinks": []}}, {"id": "claim:zona-gris-antes-que-riesgo-alto", "label": "La zona gris se resuelve antes que escalar por risk=alto", "color": "#8e5bd9", "group": "claim", "detail": {"name": "La zona gris se resuelve antes que escalar por risk=alto", "type": "claim", "typeLabel": "Claim", "summary": "BR-02 modificado: la falta de doctrina es causa tratable y resolverla elimina escalaciones futuras, por eso la escalacion semantica por riesgo se evalua despues de la zona gris; la escalacion por seguridad mantiene prioridad absoluta sobre ambas.", "tags": "decision, flujo", "content": "<i>Sin contenido.</i>", "wikilinks": []}}, {"id": "claim:aprendizaje-siempre-post-turno", "label": "El aprendizaje es siempre post-turno y controlado", "color": "#8e5bd9", "group": "claim", "detail": {"name": "El aprendizaje es siempre post-turno y controlado", "type": "claim", "typeLabel": "Claim", "summary": "El aprendizaje ocurre siempre despues de terminar el turno, nunca durante el pipeline de decision (REQ-TRN-05, BR-11); nada se promueve al banco de ejemplos sin confirmacion explicita de la duena y ningun hecho de memoria se convierte automaticamente en few-shot.", "tags": "aprendizaje", "content": "<i>Sin contenido.</i>", "wikilinks": []}}, {"id": "entity:tabla-memories", "label": "Tabla memories", "color": "#e8a33d", "group": "entity", "detail": {"name": "Tabla memories", "type": "entity", "typeLabel": "Entidad", "summary": "Tabla de memoria procesada del VIP: filas por categoría (identidad, preferencias, comercial, limites, sensible, perfil) con embedding y content jsonb, filtrada siempre por vip_id.", "tags": "dato, memoria", "content": "<i>Sin contenido.</i>", "wikilinks": []}}, {"id": "entity:modo-sandbox", "label": "Modo sandbox", "color": "#e8a33d", "group": "entity", "detail": {"name": "Modo sandbox", "type": "entity", "typeLabel": "Entidad", "summary": "Modo de operación con el pipeline cognitivo completo donde el Behavior Engine usa FakeDelivery; no contamina el aprendizaje de producción.", "tags": "modo, operacion", "content": "<i>Sin contenido.</i>", "wikilinks": []}}, {"id": "entity:congelacion", "label": "Congelación", "color": "#e8a33d", "group": "entity", "detail": {"name": "Congelación", "type": "entity", "typeLabel": "Entidad", "summary": "Estado del VIP durante una consulta de zona gris abierta: cero señales del bot (sin lectura, typing, envío ni recontacto) hasta resolver la política.", "tags": "modo, flujo, politica", "content": "<i>Sin contenido.</i>", "wikilinks": []}}, {"id": "entity:objeto-comprension", "label": "Objeto de Comprensión", "color": "#e8a33d", "group": "entity", "detail": {"name": "Objeto de Comprensión", "type": "entity", "typeLabel": "Entidad", "summary": "Salida estructurada del Analista (intent, topics, emotion, urgency, risk, flags needs_*) que funciona como lenguaje interno del pipeline; todo lo demás depende de él.", "tags": "arquitectura, contrato", "content": "<i>Sin contenido.</i>", "wikilinks": []}}, {"id": "entity:turn-categories", "label": "Categorías de turno", "color": "#e8a33d", "group": "entity", "detail": {"name": "Categorías de turno", "type": "entity", "typeLabel": "Entidad", "summary": "Clasificación de turnos (phatic, informational, emotional, sensitive) registrada en turn_category_log que define el trust budget por categoría de turno.", "tags": "dato, decision", "content": "<i>Sin contenido.</i>", "wikilinks": []}}, {"id": "entity:categoria-sensitive-no-autonoma", "label": "Regla EA-03: sensitive nunca autónoma", "color": "#e8a33d", "group": "entity", "detail": {"name": "Regla EA-03: sensitive nunca autónoma", "type": "entity", "typeLabel": "Entidad", "summary": "Regla dura: la categoría de turno sensitive nunca entra en autonomía sin importar el trust_score; siempre requiere aprobación del owner.", "tags": "regla-negocio, riesgo, decision", "content": "<i>Sin contenido.</i>", "wikilinks": []}}, {"id": "claim:sistema-toma-decisiones", "label": "El sistema no genera respuestas: toma decisiones", "color": "#8e5bd9", "group": "claim", "detail": {"name": "El sistema no genera respuestas: toma decisiones", "type": "claim", "typeLabel": "Clai stgres-unico-almacen", "label": "exemplifies", "arrows": "to", "width": 1.8}];
const TYPE_ORDER = ["article","entity","claim","topic","table","source"];
const ACTIVE = new Set(TYPE_ORDER);

const tg = window.Telegram?.WebApp;
if (tg) { tg.ready(); tg.expand(); if (tg.colorScheme === "light") { document.body.dataset.theme = "light"; } }
const nodes = new vis.DataSet(NODES.map(n => ({...n, title: n.label})));
const edges = new vis.DataSet(EDGES);
const container = document.getElementById('graph');
const network = new vis.Network(container, {nodes, edges}, {
  physics: { stabilization: {iterations: 350}, barnesHut: {gravitationalConstant: -3200, springLength: 135, springConstant: 0.045}},
  nodes: { shape: 'dot', size: 15, font: {color: '#dde3ea', size: 11}, borderWidth: 1, borderWidthSelected: 2.5 },
  edges: { color: {color: '#4a5a6e', highlight: '#7ab8ff'}, font: {color: '#8fa3b8', size: 9, strokeWidth: 0}, smooth: {enabled: true} },
  interaction: { hover: true, tooltipDelay: 150, navigationButtons: true, keyboard: true, selectConnectedEdges: true }
});

// stats
document.getElementById('stats').textContent = NODES.length + ' nodos · ' + EDGES.length + ' relaciones';

// filtros por tipo
const filterBar = document.getElementById('filters');
TYPE_ORDER.forEach(t => {
  const c = document.createElement('div');
  c.className = 'chip on'; c.textContent = t;
  c.onclick = () => {
    if (ACTIVE.has(t)) { ACTIVE.delete(t); c.classList.remove('on'); }
    else { ACTIVE.add(t); c.classList.add('on'); }
    applyFilters();
  };
  filterBar.appendChild(c);
});
function applyFilters() {
  const ids = new Set(NODES.filter(n => ACTIVE.has(n.type)).map(n => n.id));
  nodes.forEach(n => nodes.update({id: n.id, hidden: !ids.has(n.id)}));
  edges.forEach(e => {
    const vis = ids.has(e.from) && ids.has(e.to);
    edges.update({id: e.id, hidden: !vis});
  });
}

// slugify: normaliza títulos a slugs (sin acentos, guiones) para resolver wikilinks
function slugify(s) {
  return String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '')
    .replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
}
function findNodeBySlug(slug) {
  const w = slugify(slug);
  return NODES.find(n => slugify(n.label) === w
    || String(n.id).includes(':' + w) || String(n.id).includes('/' + w)) || null;
}
// panel lateral
const side = document.getElementById('side');
const sideBody = document.getElementById('sideBody');
function showDetail(d) {
  if (!d) return;
  const wl = (d.wikilinks || []).map(w => `<a data-wl="${w.replace(/"/g,'&quot;')}">[[${w}]]</a>`).join(' ');
  sideBody.innerHTML = `
    <h2>${d.name}</h2>
    <span class="badge" style="background:${({article:'#4f8ef7',entity:'#e8a33d',claim:'#8e5bd9',topic:'#2bb673',table:'#e86f4f',source:'#999999',module:'#4f8ef7',concept:'#e8a33d'})[d.type] || '#888'}">${d.typeLabel}</span>
    ${d.tags ? `<div class="tags">🏷️ ${d.tags}</div>` : ''}
    ${d.summary ? `<p><b>${d.summary}</b></p>` : ''}
    ${wl ? `<div class="wl">Enlaza a: ${wl}</div>` : ''}
    <hr style="border:none;border-top:1px solid var(--border);margin:10px 0"/>
    ${d.content}
  `;
  side.classList.add('open');
  sideBody.querySelectorAll('a[data-wl]').forEach(a => {
    a.onclick = () => {
      const target = findNodeBySlug(a.dataset.wl);
      if (target) { network.selectNodes([target.id]); network.focus(target.id, {scale: 1.1}); showDetail(target.detail); }
      else { hint.textContent = `No encontré '${a.dataset.wl}' en el grafo`; }
    };
  });
}
document.getElementById('closeSide').onclick = () => side.classList.remove('open');
network.on('selectNode', p => { showDetail(p.nodes[0] && nodes.get(p.nodes[0]).detail); });
network.on('deselectNode', () => side.classList.remove('open'));

// busqueda con navegacion entre coincidencias
const search = document.getElementById('search');
const hint = document.getElementById('hint');
const resultsBox = document.getElementById('results');
let hits = [], hitIdx = 0;
function renderDropdown() {
  resultsBox.innerHTML = '';
  if (!hits.length) { resultsBox.style.display = 'none'; return; }
  hits.forEach((h, i) => {
    const row = document.createElement('div');
    row.className = 'rrow' + (i === hitIdx ? ' cur' : '');
    row.innerHTML = `${h.label}<span class="rtype">${h.detail.typeLabel}</span>`;
    row.onclick = () => { goHit(i); };
    resultsBox.appendChild(row);
  });
  resultsBox.style.display = 'block';
}
function goHit(i) {
  if (!hits.length) return;
  hitIdx = ((i % hits.length) + hits.length) % hits.length;
  const h = hits[hitIdx];
  network.selectNodes([h.id]); network.focus(h.id, {scale: 1.15}); showDetail(h.detail);
  hint.textContent = hits.length > 1
    ? `Coincidencia ${hitIdx + 1} de ${hits.length} — Enter para la siguiente`
    : '1 coincidencia';
  renderDropdown();
}
search.addEventListener('input', () => {
  const q = search.value.trim().toLowerCase();
  if (!q) { hits = []; hitIdx = 0; renderDropdown(); network.selectNodes([]);
    hint.textContent = 'Clic en un nodo para ver detalle'; return; }
  hits = NODES.filter(n => String(n.label).toLowerCase().includes(q) ||
                            String(n.detail.summary).toLowerCase().includes(q)).slice(0, 10);
  hitIdx = 0;
  if (hits.length === 0) { renderDropdown(); hint.textContent = 'Sin resultados'; return; }
  goHit(0);
});
search.addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); if (hits.length) goHit(hitIdx + 1); }
  if (e.key === 'Escape') { search.value = ''; hits = []; renderDropdown(); }
});
document.addEventListener('click', e => {
  if (!resultsBox.contains(e.target) && e.target !== search) resultsBox.style.display = 'none';
});
window.addEventListener('resize', () => network.redraw());
setTimeout(() => { document.body.dataset.theme = (tg && tg.colorScheme === 'light') ? 'light' : 'dark'; }, 50);
</script>
